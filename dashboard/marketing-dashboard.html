<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAR</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafafa;
    --panel: #ffffff;
    --grey: #6b6b6b;
    --line: #d8d8d8;
    --today: #1a1a1a;
    --mono: 'Courier New', Courier, monospace;
    --c-today:#e8453c; --c-next:#2f6fed; --c-wait:#e49b0f; --c-idea:#8a4fd6; --c-park:#8a8f98; --c-done:#2e9e5b; --c-andy:#2f6fed; --c-claude:#12a39a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  header { background: #fff; border-top: 3px solid var(--c-next); padding: 5px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); }
  header img.logo-img { height: 30px; width: auto; display: block; flex-shrink: 0; }
  header .logo { width: 30px; height: 30px; flex-shrink: 0; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
  header p { display: none; }
  header .btn { padding: 4px 10px; font-size: 13px; }
  header .spacer { flex: 1; }
  button { font-family: inherit; font-size: 14px; cursor: pointer; }
  .btn { padding: 8px 14px; border: 1px solid var(--c-next); background: var(--c-next); color: #fff; }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .btn.small { padding: 4px 10px; font-size: 13px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 20px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; }
  .tab { padding: 3px 10px; font-size: 13px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 0; }
  .tab.on { background: var(--c-next); color: #fff; border-color: var(--c-next); }
  .tab .n { font-family: var(--mono); font-size: 12px; opacity: .7; margin-left: 4px; }
  .tabs .who { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--grey); }
  .tabs select { font-family: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); background: #fff; }

  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
  .group-title { margin: 22px 0 8px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--grey); font-family: var(--mono); }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
  .card { border-left: 5px solid var(--c-park); }
  .card.s-Today { border-left-color: var(--c-today); background: #fff8f7; }
  .card.s-Next { border-left-color: var(--c-next); }
  .card.s-Waiting { border-left-color: var(--c-wait); background: #fffaf0; }
  .card.s-Idea { border-left-color: var(--c-idea); }
  .card.s-Done { border-left-color: var(--c-done); }
  .who-tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:#fff; padding:1px 8px; margin-right:8px; vertical-align:middle; }
  .who-tag.andy { background: var(--c-andy); } .who-tag.claude { background: var(--c-claude); }
  .action { font-size: 17px; font-weight: 600; margin-top: 6px; overflow-wrap:anywhere; }
  .card .title { font-size: 13px; font-weight: 400; color: var(--grey); }
  .pf { margin-top: 8px; font-size: 14px; color: #333; overflow-wrap: anywhere; } .pf div { margin-top: 5px; } .pf b { color: var(--grey); font-size: 11px; letter-spacing: .8px; text-transform: uppercase; margin-right: 6px; }
  details.more { margin-top: 6px; } details.more summary { cursor:pointer; font-size:13px; color:#2a5db0; }
  .gt-Today{color:var(--c-today)} .gt-Next{color:var(--c-next)} .gt-Waiting{color:var(--c-wait)} .gt-Idea{color:var(--c-idea)} .gt-Done{color:var(--c-done)}
  .btn.go { background: var(--c-claude); border-color: var(--c-claude); }
  .btn.done { background: var(--c-done); border-color: var(--c-done); }
  .card.done .title { text-decoration: line-through; color: var(--grey); }
  .card .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .step { color: #333; font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
  .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); color: var(--grey); background: #fff; }
  .chip.me { border-color: var(--c-andy); color: var(--c-andy); }
  .chip.cl { border-color: var(--c-claude); color: var(--c-claude); }
  .chip.num { font-family: var(--mono); border: none; padding-left: 0; }
  .chip.wait { border-color: #b36b00; color: #b36b00; }
  .chip.go { background: var(--c-claude); color: #fff; border-color: var(--c-claude); }
  .chip.nogo { border-style: dashed; }
  .chip.due { font-family: var(--mono); }
  .chip.late { border-color: #b00020; color: #b00020; }
  .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .acts select { font-size: 13px; padding: 4px; border: 1px solid var(--line); background: #fff; }
  a.chatlnk { text-decoration: none; text-align: center; display: block; }
  a.lnk { font-size: 13px; color: #2a5db0; text-decoration: none; }
  .empty { color: var(--grey); padding: 40px 0; text-align: center; }
  .error-state { background: #fff; border: 1px solid #b00020; color: #b00020; padding: 14px; margin: 20px 0; }

  dialog { border: 1px solid var(--ink); padding: 0; width: min(520px, 94vw); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .dlg h2 { margin: 0 0 4px; font-size: 18px; }
  .dlg label { font-size: 12px; color: var(--grey); display: flex; flex-direction: column; gap: 3px; }
  .dlg input, .dlg select, .dlg textarea { font-family: inherit; font-size: 15px; padding: 7px 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .dlg .row { display: flex; gap: 10px; } .dlg .row > label { flex: 1; }
  .dlg .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; font-size: 14px; display: none; }

  .mission { background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--c-park); margin-bottom: 14px; padding: 14px 16px; }
  .mission.s-Today { border-left-color: var(--c-today); } .mission.s-Next { border-left-color: var(--c-next); } .mission.s-Waiting { border-left-color: var(--c-wait); } .mission.s-Idea { border-left-color: var(--c-park); }
  .mission .mhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .mission h2 { margin: 0; font-size: 19px; line-height: 1.3; flex: 1; min-width: 200px; }
  .prog { margin-top: 8px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--grey); }
  .bar { flex: 1; height: 8px; background: #eceef1; max-width: 260px; } .bar > i { display: block; height: 100%; background: var(--c-done); }
  .nextbox { margin-top: 10px; padding: 10px 12px; background: #f3f7ff; border: 1px solid #d5e3ff; }
  .nextbox .lbl { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--grey); font-weight: 700; }
  details.steps { margin-top: 10px; } details.steps > summary { cursor: pointer; font-size: 14px; color: #2a5db0; font-weight: 600; }
  .typehead { margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 1px; font-family: var(--mono); }
  .typehead.BUILD { color: var(--c-idea); } .typehead.RUN { color: var(--c-claude); }
  .typehead .cnt { font-weight: 400; color: var(--grey); margin-left: 8px; letter-spacing: 0; }
  .typechip { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 1px 6px; border: 1px solid; margin-right: 6px; }
  .typechip.BUILD { color: var(--c-idea); border-color: var(--c-idea); } .typechip.RUN { color: var(--c-claude); border-color: var(--c-claude); } .typechip.ALERT { color: #c62828; border-color: #c62828; }
  .card.alert { border-left: 6px solid #c62828; background: #fdecea; }
  .card.alert .title { color: #8e1b1b; }
  .tab.alerttab, .tab.alerttab.on { background: #c62828; color: #fff; border-color: #c62828; font-weight: 700; }
  .steps .card { margin-left: 0; }
  .addbar { margin-bottom: 14px; } #addform { display:flex; gap:8px; }
  #addform input { flex:1; min-width:0; font:inherit; font-size:16px; padding:8px 12px; border:1px solid var(--line); background:#fff; }
  #addform .btn { min-width:90px; }
  .subtabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .hint { background:#f3f7ff; border:1px solid #d5e3ff; padding:10px 14px; font-size:14px; margin-bottom:12px; }
  .card.f-Followed { border-left-color: var(--c-wait); } .card.f-FollowedBack { border-left-color: var(--c-done); } .card.f-Skipped { border-left-color: var(--c-park); } .card.f-due { border-left-color: var(--c-today); background:#fff8f7; }
  .fhandle { font-weight:700; font-size:17px; } .fhandle a { color:inherit; text-decoration:none; } .fnm { color:var(--grey); font-size:13px; margin-left:6px; }
  .fwhy { font-size:13px; color:var(--c-idea); margin-top:4px; } .fmeta { font-size:12px; color:var(--grey); margin-top:4px; font-family:var(--mono); }
  .btn.warn { background: var(--c-today); border-color: var(--c-today); }
  /* Today's routine (12 Oct 2026): daily lines that repeat, ticked each day */
  .routine { background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--c-today); padding: 14px 16px; margin-bottom: 18px; }
  .routine h2 { margin: 0 0 4px; font-size: 19px; } .routine .sub { font-size: 13px; color: var(--grey); margin-bottom: 8px; }
  .dline { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid #eee; }
  .dline:first-of-type { border-top: none; }
  .dline input[type=checkbox] { width: 26px; height: 26px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--c-done); cursor: pointer; }
  .dline .body { flex: 1; min-width: 0; }
  .dline.ticked .action { text-decoration: line-through; color: var(--grey); }
  .dline.missed .action { color: var(--c-today); }
  .dline.later { opacity: .55; }
  .dline .dacts { display: flex; gap: 6px; flex-wrap: wrap; }
  .clips { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .clip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: #f6f7f9; border: 1px solid #e6e8ec; font-size: 14px; }
  .clip .cn { flex: 1; min-width: 160px; }
  .clip.posted .cn { color: var(--grey); }
  .btn.tt { background: #111; border-color: #111; }
  .repeat-days { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
  .repeat-days label { flex-direction: row; align-items: center; gap: 4px; color: var(--ink); font-size: 14px; }
  .gnote { font-size: 13px; color: var(--grey); }
  .glink { display: flex; gap: 8px; align-items: center; } .glink input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); }
  .tracker { border: 1px solid var(--line); background: #fff; padding: 12px 14px; margin-bottom: 14px; }
  .tracker h2 { font-size: 17px; margin: 0; } .tracker .thead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; } .tracker .thead .sub { font-size: 13px; color: var(--grey); flex: 1; }
  .trow { border-top: 1px solid var(--line); padding: 9px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .trow .who { flex: 1 1 220px; min-width: 0; } .trow .who b { font-size: 15px; } .trow .who .fit { font-size: 12.5px; color: var(--grey); }
  .trow .tacts { display: flex; gap: 6px; flex-wrap: wrap; }
  .tier { font-size: 11px; font-weight: 700; padding: 1px 6px; color: #fff; background: #78909c; vertical-align: 2px; } .tier.t1 { background: #2e7d32; } .tier.t2 { background: #ef6c00; } .tier.t3 { background: #6d4c41; }
  .tstat { font-size: 12px; font-weight: 700; padding: 2px 7px; border: 1px solid currentColor; white-space: nowrap; }
  .tstat.due { color: #c62828; background: #fdecea; } .tstat.ok { color: #2a7a2a; } .tstat.wait { color: #2a5db0; } .tstat.todo { color: #b06a00; } .tstat.closed { color: #888; }
  #giftDlg .row { flex-wrap: wrap; } #giftDlg .row label { flex: 1 1 140px; min-width: 0; } #giftDlg input, #giftDlg select { width: 100%; box-sizing: border-box; min-width: 0; }
  header .btn { white-space: nowrap; }
  .gpool { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; max-height: 230px; overflow-y: auto; border: 1px solid var(--line); padding: 6px; }
  .gpool button { border: 2px solid transparent; padding: 0; background: #fff; cursor: pointer; font: inherit; font-size: 10.5px; line-height: 1.2; text-align: center; color: var(--ink); }
  .gpool button.on { border-color: var(--ink); }
  .gpool img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #eee; }
  .gpick { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .gpick img { width: 64px; height: 64px; object-fit: cover; }
  @media (max-width: 640px) {
    header { padding: 5px 12px; } .tabs { padding: 5px 12px; } .tabs .who { margin-left: 0; width: 100%; }
    .card { flex-direction: column; } .acts { flex-direction: row; width: 100%; }
  }
  /* Products tab (18 Oct 2026): template-driven product runs */
  .pbox { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; margin-bottom: 12px; }
  .pbox h3 { margin: 0 0 8px; font-size: 15px; }
  .prow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .prow input[type=text] { flex: 1 1 300px; min-width: 0; font-family: var(--mono); font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); }
  .tplinfo { margin-top: 8px; font-size: 14px; } .tplinfo b { color: var(--grey); font-size: 11px; letter-spacing: .8px; text-transform: uppercase; margin-right: 6px; }
  .dpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 8px 0; }
  .dpick label { border: 1px solid var(--line); padding: 6px 8px; font-size: 14px; display: flex; gap: 6px; align-items: center; cursor: pointer; background: #fff; }
  .dpick label.busy { color: var(--grey); }
  .prule textarea, .prule input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); }
  .prule textarea { min-height: 120px; font-family: var(--mono); font-size: 12.5px; }
  .prule label { display: block; font-size: 12px; color: var(--grey); margin-top: 8px; }
  .pex { background: #fafafa; border: 1px dashed var(--line); padding: 8px 10px; margin-top: 8px; font-size: 14px; }
  .run { border-left: 5px solid var(--c-park); }
  .run.need { border-left-color: var(--c-today); background: #fff8f7; } .run.prog { border-left-color: var(--c-next); }
  .run.live { border-left-color: var(--c-done); } .run.bad { border-left-color: #8a8f98; background: #f6f6f6; }
  .run .pv { width: 100%; max-width: 520px; display: block; margin-top: 8px; border: 1px solid var(--line);
    background-color: #fff; background-image: linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
  .run .acts2 { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .lib summary { cursor: pointer; font-size: 15px; }
  .libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .libcard { border: 1px solid var(--line); padding: 8px; background: #fff; font-size: 13px; min-width: 0; }
  .libcard img.chk { width: 100%; aspect-ratio: 1; object-fit: contain; display: block;
    background-color: #fff; background-image: linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size: 14px 14px; background-position: 0 0,0 7px,7px -7px,-7px 0; }
  .libcard .noart { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; color: var(--grey); background: #f3f3f3; }
  .libname { font-weight: 600; margin-top: 6px; } .libph { color: var(--grey); font-size: 12px; }
  .liblinks { font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
  .libcard.logo { grid-column: span 2; } .libcard.logo .lgw, .libcard.logo .lgd { padding: 10px; } .libcard.logo .lgd { background: #1e1e1e; }
  .libcard.logo img { width: 100%; display: block; }
  @media (max-width: 640px) { .libcard.logo { grid-column: span 1; } }
  .sides { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; } .sides b { flex-basis: 100%; font-size: 13px; }
  .tick { display: inline-flex !important; flex-direction: row !important; align-items: center; gap: 5px; font-size: 14px !important; color: var(--ink) !important; margin: 0 !important; }
  .prule .tick input { width: auto; }
  .sheets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; } .sheets img { width: 100%; display: block; border: 1px solid var(--line); }
  @media (max-width: 640px) { .sheets { grid-template-columns: 1fr; } }
  .run pre { white-space: pre-wrap; font-size: 12px; background: #fafafa; padding: 6px; margin: 4px 0 0; }
</style>
</head>
<body>
<header>
  <img class="logo-img" src="https://res.cloudinary.com/dkapdtxek/image/upload/v1791598843/SCSMAuto/sc_letters_logo_header_v1.png" alt="SC" onerror="this.outerHTML='<div class=&quot;logo&quot;>SC</div>'">
  <div><h1>Marketing</h1><p>What needs doing, in order</p></div>
  <div class="spacer"></div>
  <button class="btn ghost" id="giftBtn">Gift NFT</button>
  <button class="btn" id="addBtn">+ Add</button>
</header>
<div class="tabs" id="tabs"></div>
<main id="list"><div class="empty">Loading…</div></main>

<dialog id="dlg">
  <form method="dialog" class="dlg" id="form">
    <h2 id="dlgTitle">Add</h2>
    <label>What <input id="f_title" maxlength="80" required placeholder="Short and clear"></label>
    <label>Next step <input id="f_next" maxlength="100" placeholder="One line"></label>
    <div class="row">
      <label>Type <select id="f_type"><option>BUILD</option><option>RUN</option><option>MISSION</option><option value="DAILY">DAILY (repeats)</option></select></label>
      <label>Mission <select id="f_parent"></select></label>
    </div>
    <div id="f_repeat_wrap"><label>Repeat on</label><div class="repeat-days" id="f_repeat"></div></div>
    <div class="row">
      <label>Category <select id="f_cat"></select></label>
      <label>Status <select id="f_status"></select></label>
    </div>
    <div class="row">
      <label>Who <select id="f_owner"><option>Andy</option><option>Claude</option></select></label>
      <label>Due <input id="f_due" type="date"></label>
    </div>
    <label>Waiting on <input id="f_wait" maxlength="60" placeholder="Leave empty if nothing is holding it up"></label>
    <label>Link <input id="f_link" type="url" placeholder="https://…"></label>
    <label>Problem (required for a task) <textarea id="f_problem" rows="3" maxlength="1000" placeholder="What is wrong or what needs doing, and why it matters"></textarea></label>
    <label>Proposed solution (if there is one) <textarea id="f_solution" rows="2" maxlength="1000"></textarea></label>
    <label>Notes summary <textarea id="f_notes" rows="2" maxlength="1000" placeholder="Short summary of anything already known"></textarea></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="button" class="btn ghost" id="removeBtn">Remove</button>
      <button type="submit" class="btn" id="saveBtn">Save</button>
    </div>
  </form>
</dialog>
<dialog id="giftDlg">
  <form method="dialog" class="dlg" id="giftForm">
    <h2>Gift a Blueprint NFT</h2>
    <div class="gnote">One free Blueprint per person, as a £0 shop order. You get a private gift link to paste in the DM; they choose their own wallet or a new email wallet when they open it.</div>
    <div class="row">
      <label>Handle <input id="g_handle" maxlength="60" placeholder="@name" required></label>
      <label>Platform <select id="g_platform"><option>Instagram</option><option>X</option><option>TikTok</option><option>Facebook</option><option>YouTube</option></select></label>
    </div>
    <label>Blueprint <input id="g_search" type="search" placeholder="Search, e.g. 0012"></label>
    <div class="gpool" id="g_pool"><div class="gnote">Loading Blueprints…</div></div>
    <div class="gpick" id="g_pick"></div>
    <div class="gnote" id="g_status"></div>
    <div class="glink" id="g_link"></div>
    <div class="foot">
      <button type="button" class="btn ghost" id="g_cancel">Close</button>
      <button type="button" class="btn" id="g_send">Send gift</button>
    </div>
  </form>
</dialog>
<dialog id="tDlg">
  <form method="dialog" class="dlg" id="tForm">
    <h2 id="tTitle">Add a person</h2>
    <div class="row">
      <label>Handle <input id="t_handle" maxlength="60" placeholder="@name" required></label>
      <label>Platform <select id="t_platform"><option>X</option><option>Instagram</option><option>TikTok</option><option>Facebook</option><option>YouTube</option></select></label>
    </div>
    <label>Profile link <input id="t_url" type="url" placeholder="https://…"></label>
    <label>Why they fit <input id="t_fit" maxlength="200" placeholder="One line: their audience matches our buyer because…"></label>
    <label>DM <textarea id="t_dm" rows="4" maxlength="4000"></textarea></label>
    <label>Follow-up DM <textarea id="t_fu" rows="3" maxlength="4000"></textarea></label>
    <label>Status <select id="t_status"><option>To send</option><option>Sent</option><option>Replied</option><option>Gift sent</option><option>Claimed</option><option>No reply</option><option>Removed</option></select></label>
    <label>Note <textarea id="t_notes" rows="2" maxlength="1000"></textarea></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="t_cancel">Cancel</button>
      <button type="button" class="btn" id="t_save">Save</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const BASE = 'https://n8n-production-afc2.up.railway.app/webhook/';
const LIST_URL = BASE + 'sc-marketing-list';
const SAVE_URL = BASE + 'sc-marketing-save';
const FOLLOW_LIST_URL = BASE + 'sc-follow-list';
const FOLLOW_SAVE_URL = BASE + 'sc-follow-save';
const UNFOLLOW_AFTER_DAYS = 7;
const CAL_URL = BASE + 'sc-calendar-list';
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
// Clips shown on the TikTok line: today's video posts (every video post also goes to YouTube; Dare to Buy slides do not).
const CLIP_STATUSES = ['approved', 'scheduled', 'posted'];
let cal = null, calLoading = false;
const clipFiles = {};

const CATEGORIES = ['Influencers', 'Follow list', 'Press and media','Posts and boosts', 'Shop', 'Systems', 'Ideas'];
const STATUSES = ['Today', 'Next', 'Waiting', 'Idea', 'Done'];
const ACTIVE = ['Today', 'Next', 'Waiting'];

let rows = [];
let frows = [];
let fview = 'To follow';
let showDone = false;   // 13 Oct 2026 (Andy): lines ticked today are hidden unless asked for
let view = 'Today';   // 12 Oct 2026 (Andy): the daily routine has its own tab, shown first
let who = 'Everyone';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2200); }
function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const rank = { Today: 0, Next: 1, Waiting: 2, Idea: 3, Done: 4 };

async function load() {
  try {
    const res = await fetch(LIST_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    rows = (Array.isArray(data) ? data : []).filter(r => r.status !== 'Removed');
    try { const fr = await fetch(FOLLOW_LIST_URL); if (fr.ok) { const fd = await fr.json(); frows = Array.isArray(fd) ? fd : []; } } catch (e2) { frows = []; }
    render();
  } catch (e) {
    $('list').innerHTML = '<div class="error-state">Could not load (' + esc(e.message) + '). Check the workflow SC - Marketing Actions API (list) is active.</div>';
  }
}

const missions = () => rows.filter(r => r.type === 'MISSION');
const kids = m => rows.filter(r => String(r.parent) === String(m.id) && r.type !== 'MISSION' && r.type !== 'DAILY');
const loose = () => rows.filter(r => r.type !== 'MISSION' && r.type !== 'DAILY' && r.type !== 'ALERT' && !missions().some(m => String(m.id) === String(r.parent)));
const dailies = () => rows.filter(r => r.type === 'DAILY');
const whoOk = r => who === 'Everyone' || r.owner === who;

function nextAction(m) {
  const act = kids(m).filter(r => ACTIVE.includes(r.status) && whoOk(r)).sort((a, b) => rank[a.status] - rank[b.status]);
  return act[0] || null;
}
function missionShown(m) {
  const ks = kids(m);
  if (view === 'Now') return ks.some(r => ACTIVE.includes(r.status) && whoOk(r)) || (!ks.length && ACTIVE.includes(m.status));
  if (CATEGORIES.includes(view)) return m.category === view && m.status !== 'Done';
  return false;
}
function flatShown(r) {
  if (r.type === 'MISSION' || !whoOk(r)) return false;
  if (view === 'Done') return r.status === 'Done';
  return false;
}
function tabCount(v) {
  if (v === 'Pages') return '';
  if (v === 'Pricing') return pr.loaded ? pr.rows.filter(x => prCalc(x).flag).length || '' : '';
  if (v === 'Products') return prod.loaded ? prod.runs.filter(r => /^andy_/.test(r.waiting_on || '')).length + prod.designs.filter(d => d.waiting_on === 'andy_design').length : '';
  if (v === 'Follow list') return frows.filter(FVIEWS['To follow']).length;
  if (v === 'Alerts') return rows.filter(r => r.type === 'ALERT' && r.status !== 'Done').length;
  if (v === 'Today') return routineDue().filter(r => r.status === 'Today' && r.done_on !== today()).length;
  const keep = view; view = v; let n;
  if (v === 'Done') n = rows.filter(flatShown).length;
  else n = missions().filter(missionShown).length + (v === 'Now' ? loose().filter(r => ACTIVE.includes(r.status) && whoOk(r)).length + rows.filter(r => r.type === 'ALERT' && r.status !== 'Done').length : 0);
  view = keep;
  // Influencers also counts gift-tracker people waiting on Andy: DM to send, replied, follow-up due (13 Oct 2026).
  if (v === 'Influencers' && track) n += track.filter(t => t.status === 'To send' || t.status === 'Replied' || followDue(t)).length;
  return n;
}

function renderTabs() {
  const names = ['Today', 'Alerts', 'Now', ...CATEGORIES, 'Products', 'Pricing', 'Done', 'Pages'];
  $('tabs').innerHTML = names.map(n => '<button class="tab' + (n === view ? ' on' : '') + (n === 'Alerts' && tabCount(n) > 0 ? ' alerttab' : '') + '" data-v="' + esc(n) + '">' + esc(n) + '<span class="n">' + tabCount(n) + '</span></button>').join('')
    + '<div class="who"><span>Who</span><select id="whoSel">' + ['Everyone', 'Andy', 'Claude'].map(o => '<option' + (o === who ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div>';
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  $('whoSel').onchange = e => { who = e.target.value; render(); };
}

function chatUrl(r) {
  const q = 'Marketing dashboard task #' + r.id + ': ' + r.title + '. Next step: ' + (r.next_step || '') + '. Read this row in the n8n data table SC Marketing Actions and work only on this task.'
    + ' First, save this chat\'s link on the row: get it by calling read_conversation with conversation_id "current" and max_turns 1, then call the n8n workflow SC - Marketing Chat Link (save) (webhook sc-marketing-chatlink) with id ' + r.id + ' and that chat_link.'
    + ' You can edit rows yourself: to update or close this row, call the n8n workflow SC - Marketing Actions API (save) (webhook sc-marketing-save) with this row\'s id and the WHOLE row, because it overwrites every field.'
    + ' When the work is done set status Done, next_step none, done_on today (YYYY-MM-DD), and put the cause, the fix and the test in notes.'
    + ' Keep notes as three lines: Problem: ... / Proposed solution: ... / Notes: ... (a short summary); the save workflow refuses an open task without a Problem. If it now needs Andy, set status Waiting, owner Andy and waiting_on instead. Then read the row back to check it saved.';
  return 'https://claude.ai/new?q=' + encodeURIComponent(q);
}

// 18 Oct 2026 (Andy): every open task states the problem, the proposed solution (if there is one) and a short summary of notes.
// Stored in the notes field as three labelled lines: Problem / Proposed solution / Notes.
function parseNotes(n) {
  const m = /^Problem:\s*([\s\S]*?)(?:\n+Proposed solution:\s*([\s\S]*?))?(?:\n+Notes:\s*([\s\S]*))?$/.exec(String(n || '').trim());
  return m ? { problem: (m[1] || '').trim(), solution: (m[2] || '').trim(), notes: (m[3] || '').trim() } : null;
}
function composeNotes(p, sol, n) {
  if (!p) return n;
  return 'Problem: ' + p + (sol ? '\nProposed solution: ' + sol : '') + (n ? '\nNotes: ' + n : '');
}
function notesHtml(r) {
  const p = parseNotes(r.notes);
  if (p) return '<div class="pf"><div><b>Problem</b>' + esc(p.problem) + '</div>' + (p.solution ? '<div><b>Proposed solution</b>' + esc(p.solution) + '</div>' : '') + (p.notes ? '<div><b>Notes</b>' + esc(p.notes) + '</div>' : '') + '</div>';
  return r.notes ? '<details class="more"><summary>More</summary><div class="step" style="color:#6b6b6b;margin-top:4px">' + esc(r.notes) + '</div></details>' : '';
}
function card(r, showMission) {
  const late = r.due && r.due < today() && r.status !== 'Done';
  const link = safeUrl(r.link);
  const isA = r.owner === 'Andy';
  const action = r.next_step || r.title;
  return '<div class="card s-' + esc(r.status) + (r.type === 'ALERT' ? ' alert' : '') + '" data-id="' + esc(r.id) + '">'
    + '<div class="body">'
    + '<div class="title">' + (r.type ? '<span class="typechip ' + esc(r.type) + '">' + esc(r.type) + '</span>' : '') + '<span class="who-tag ' + (isA ? 'andy' : 'claude') + '">' + (isA ? 'Your action' : 'Claude') + '</span>#' + esc(r.id) + ' &middot; ' + esc(r.title) + '</div>'
    + '<div class="action">' + esc(action) + '</div>'
    + '<div class="meta">'
    + (r.waiting_on ? '<span class="chip wait">Waiting on: ' + esc(r.waiting_on) + '</span>' : '')
    + (!isA && r.status !== 'Done' ? (r.go === 'yes' ? '<span class="chip go">Approved for Claude</span>' : '<span class="chip nogo">Not approved</span>') : '')
    + (r.type === 'ALERT' && Number(r.alert_count) > 1 ? '<span class="chip due late">' + esc(r.alert_count) + ' times</span>' : '')
    + (r.due ? '<span class="chip due' + (late ? ' late' : '') + '">' + esc(r.due) + '</span>' : '')
    + (showMission ? '<span class="chip">' + esc(r.category || '') + '</span>' : '')
    + (link ? '<a class="lnk" href="' + esc(link) + '" target="_blank" rel="noopener">Open</a>' : '')
    + '</div>'
    + notesHtml(r)
    + '</div>'
    + '<div class="acts"><select data-act="status">' + STATUSES.map(s => '<option' + (s === r.status ? ' selected' : '') + '>' + s + '</option>').join('') + '</select>'
    + (!isA && r.status !== 'Done' ? '<button class="btn small' + (r.go === 'yes' ? ' ghost' : ' go') + '" data-act="go">' + (r.go === 'yes' ? 'Stop Claude' : 'Go Claude') + '</button>' : '')
    + (r.status !== 'Done' ? '<button class="btn small done" data-act="done">Done</button>' : '')
    + (safeUrl(r.chat_link) ? '<a class="btn small ghost chatlnk" target="_blank" rel="noopener" href="' + esc(safeUrl(r.chat_link)) + '">Open chat</a>' : '')
    + '<a class="btn small ghost chatlnk" target="_blank" rel="noopener" href="' + esc(chatUrl(r)) + '">New chat</a>'
    + '<button class="btn small ghost" data-act="edit">Edit</button></div></div>';
}

function missionCard(m) {
  const ks = kids(m);
  const done = ks.filter(r => r.status === 'Done').length;
  const na = nextAction(m);
  const lead = na ? na.status : m.status;
  const pct = ks.length ? Math.round(done * 100 / ks.length) : 0;
  const link = safeUrl(m.link);
  let steps = '';
  ['BUILD', 'RUN'].forEach(t => {
    const list = ks.filter(r => (r.type || 'BUILD') === t).sort((a, b) => rank[a.status] - rank[b.status]);
    if (!list.length) return;
    const cnt = {}; list.forEach(r => cnt[r.status] = (cnt[r.status] || 0) + 1);
    steps += '<div class="typehead ' + t + '">' + t + (t === 'BUILD' ? ' (process and first test)' : ' (one per contact)') + '<span class="cnt">' + Object.keys(cnt).sort((a, b) => rank[a] - rank[b]).map(k => cnt[k] + ' ' + k.toLowerCase()).join(' · ') + '</span></div>' + list.map(r => card(r, false)).join('');
  });
  const nextHtml = na
    ? '<div class="nextbox"><div class="lbl">Next action</div><div class="action" style="margin-top:2px"><span class="who-tag ' + (na.owner === 'Andy' ? 'andy' : 'claude') + '">' + (na.owner === 'Andy' ? 'You' : 'Claude') + '</span>' + esc(na.next_step || na.title) + '</div>'
      + (parseNotes(na.notes) ? '<div class="step" style="margin-top:4px">' + esc(parseNotes(na.notes).problem) + '</div>' : '')
      + (na.waiting_on ? '<div class="meta"><span class="chip wait">Waiting on: ' + esc(na.waiting_on) + '</span></div>' : '') + '</div>'
    : '<div class="nextbox"><div class="lbl">Next action</div><div class="step">Nothing active</div></div>';
  return '<div class="mission s-' + esc(lead) + '" data-mid="' + esc(m.id) + '">'
    + '<div class="mhead"><h2>' + esc(m.title) + '</h2><span class="chip">' + esc(m.category || '') + '</span>'
    + (link ? '<a class="lnk" href="' + esc(link) + '" target="_blank" rel="noopener">Open</a>' : '')
    + '<button class="btn small ghost" data-mact="addstep">+ Step</button><button class="btn small ghost" data-mact="edit">Edit</button></div>'
    + '<div class="prog"><div class="bar"><i style="width:' + pct + '%"></i></div>' + done + ' of ' + ks.length + ' done</div>'
    + nextHtml
    + (ks.length ? '<details class="steps"><summary>All steps (' + ks.length + ')</summary>' + steps + '</details>' : '')
    + '</div>';
}

// 15 Oct 2026 (Andy): shortcut tab with the quiz and character result page links
const SHOP = 'https://stiffcompetition.shop/pages/';
const PAGE_LINKS = [['The quiz: How Stiff Are You?', 'how-stiff'], ['Major Wood', 'you-are-major-wood'], ['The Rear Admiral', 'you-are-the-rear-admiral'], ['Hammerin\u2019 Hanky', 'you-are-hammerin-hanky'], ['Slick Willy', 'you-are-slick-willy'], ['The Velvet Python', 'you-are-the-velvet-python'], ['The Grip', 'you-are-the-grip']];
function pagesHtml() {
  return '<div style="display:flex;flex-direction:column;gap:10px;max-width:420px">' + PAGE_LINKS.map(p => '<a class="btn" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="' + SHOP + p[1] + '">' + esc(p[0]) + '</a>').join('') + '</div>';
}

function render() {
  renderTabs();
  if (view === 'Follow list') { renderFollow(); return; }
  if (view === 'Pages') { $('list').innerHTML = pagesHtml(); return; }
  if (view === 'Products') { renderProducts(); return; }
  if (view === 'Pricing') { renderPricing(); return; }
  if (view === 'Today') { $('list').innerHTML = routineHtml(); wireRoutine(); return; }
  let html = '';
  if (view === 'Done') {
    const list = rows.filter(flatShown).sort((a, b) => rank[a.status] - rank[b.status]);
    html = list.map(r => card(r, true)).join('');
  } else if (view === 'Alerts') {
    html = rows.filter(r => r.type === 'ALERT' && r.status !== 'Done' && whoOk(r)).sort((a, b) => String(b.last_seen || '').localeCompare(String(a.last_seen || ''))).map(r => card(r, false)).join('') || '<div class="empty">No open alerts.</div>';
  } else {
    const ms = missions().filter(missionShown).sort((a, b) => {
      const ra = nextAction(a), rb = nextAction(b);
      return (ra ? rank[ra.status] : 9) - (rb ? rank[rb.status] : 9);
    });
    html = (view === 'Now' ? rows.filter(r => r.type === 'ALERT' && r.status !== 'Done' && whoOk(r)).map(r => card(r, false)).join('') : '') + ms.map(missionCard).join('');
    if (view === 'Now') html += loose().filter(r => ACTIVE.includes(r.status) && whoOk(r)).map(r => card(r, true)).join('');
  }
  if (view === 'Influencers') html = trackerHtml() + html;
  $('list').innerHTML = html || '<div class="empty">Nothing here.</div>';
  if (view === 'Influencers') wireTracker();
  $('list').querySelectorAll('.card').forEach(c => {
    const r = rows.find(x => String(x.id) === c.dataset.id);
    c.querySelector('[data-act=status]').onchange = e => save(Object.assign({}, r, { status: e.target.value }));
    const g = c.querySelector('[data-act=go]'); if (g) g.onclick = () => save(Object.assign({}, r, { go: r.go === 'yes' ? '' : 'yes' }));
    const d = c.querySelector('[data-act=done]'); if (d) d.onclick = () => save(Object.assign({}, r, { status: 'Done' }));
    c.querySelector('[data-act=edit]').onclick = () => openDlg(r);
  });
  $('list').querySelectorAll('.mission').forEach(c => {
    const m = rows.find(x => String(x.id) === c.dataset.mid);
    c.querySelector('[data-mact=edit]').onclick = () => openDlg(m);
    c.querySelector('[data-mact=addstep]').onclick = () => openDlg(null, m);
  });
}

async function save(r) {
  const prev = rows.slice();
  const i = rows.findIndex(x => String(x.id) === String(r.id));
  if (i >= 0) rows[i] = r;
  render();
  try {
    const res = await fetch(SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: r.id || '', title: r.title, category: r.category, status: r.status, next_step: r.next_step, owner: r.owner, due: r.due, link: r.link, notes: r.notes, waiting_on: r.waiting_on || '', go: r.go || '', parent: r.parent || '', type: r.type || '', repeat: r.repeat || '', done_on: r.done_on || '' }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'not saved');
    toast('Saved');
    if (i < 0) await load();
  } catch (e) { rows = prev; render(); toast('Not saved: ' + e.message); }
}

let editing = null;
function openDlg(r, parentMission) {
  editing = r || null;
  $('dlgTitle').textContent = r ? 'Edit' : 'Add';
  $('f_cat').innerHTML = CATEGORIES.map(c => '<option>' + c + '</option>').join('');
  $('f_status').innerHTML = STATUSES.map(c => '<option>' + c + '</option>').join('');
  $('f_parent').innerHTML = '<option value="">(none)</option>' + missions().map(m => '<option value="' + esc(m.id) + '">' + esc(m.title) + '</option>').join('');
  $('f_title').value = r ? r.title : '';
  $('f_next').value = r ? r.next_step || '' : '';
  $('f_type').value = r ? (r.type || 'BUILD') : (parentMission ? 'BUILD' : 'MISSION');
  $('f_parent').value = r ? (r.parent || '') : (parentMission ? String(parentMission.id) : '');
  $('f_cat').value = r ? r.category : (parentMission ? parentMission.category : (CATEGORIES.includes(view) ? view : 'Influencers'));
  $('f_status').value = r ? r.status : 'Next';
  $('f_owner').value = r ? r.owner || 'Andy' : 'Andy';
  $('f_due').value = r ? r.due || '' : '';
  $('f_link').value = r ? r.link || '' : '';
  $('f_wait').value = r ? r.waiting_on || '' : '';
  const pn = r ? parseNotes(r.notes) : null;
  $('f_problem').value = pn ? pn.problem : '';
  $('f_solution').value = pn ? pn.solution : '';
  $('f_notes').value = r ? (pn ? pn.notes : (r.notes || '')) : '';
  const rep = r ? (r.repeat || 'daily') : 'daily';
  $('f_repeat').innerHTML = DAYS.map(d => '<label><input type="checkbox" value="' + d + '"' + (rep === 'daily' || rep.split(',').includes(d) ? ' checked' : '') + '>' + d + '</label>').join('');
  $('f_repeat_wrap').style.display = $('f_type').value === 'DAILY' ? '' : 'none';
  $('removeBtn').style.display = r ? '' : 'none';
  $('dlg').showModal();
}
$('addBtn').onclick = () => openDlg(null);

// ---------- Gift NFT (13 Oct 2026, NFT Creator Outreach Playbook) ----------
// Calls SC - NFT Gift (sc-nft-gift): mode pool lists giftable Blueprints; mode gift makes the £0 order, sets up the claim,
// mints to a wallet when one is given, logs it and tells Andy on Telegram. One gift per handle (the workflow refuses a second).
const GIFT_URL = BASE + 'sc-nft-gift';
let giftPool = null, giftPick = null, giftRow = null;
async function loadGiftPool() {
  try {
    const r = await fetch(GIFT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'pool' }) });
    const d = await r.json();
    giftPool = (d && d.pool) || [];
  } catch (e) { giftPool = []; $('g_status').textContent = 'Could not load the Blueprints: ' + e.message; }
  drawGiftPool();
}
function drawGiftPool() {
  if (!giftPool) return;
  const q = $('g_search').value.trim().toLowerCase();
  const list = giftPool.filter(p => !q || p.title.toLowerCase().includes(q) || p.handle.toLowerCase().includes(q)).slice(0, 60);
  $('g_pool').innerHTML = list.length ? list.map(p => '<button type="button" data-h="' + esc(p.handle) + '"' + (giftPick && giftPick.handle === p.handle ? ' class="on"' : '') + '><img loading="lazy" alt="" src="' + esc(safeUrl(p.image)) + '">' + esc(p.title.replace(/^Blueprint\s*/i, '')) + '</button>').join('')
    : '<div class="gnote">' + (giftPool.length ? 'No Blueprint matches.' : 'No Blueprints are free to gift.') + '</div>';
  $('g_pool').querySelectorAll('button').forEach(b => b.onclick = () => { giftPick = giftPool.find(p => p.handle === b.dataset.h); drawGiftPool(); drawGiftPick(); });
}
function drawGiftPick() {
  $('g_pick').innerHTML = giftPick ? '<img alt="" src="' + esc(safeUrl(giftPick.image)) + '"><div><b>' + esc(giftPick.title) + '</b><br><span class="gnote">Shop price £' + esc(giftPick.price) + '; given at £0</span></div>' : '';
}
function openGift(row) {
  giftRow = row || null;
  ['g_handle', 'g_search'].forEach(id => $(id).value = '');
  if (giftRow) { $('g_handle').value = giftRow.handle || ''; $('g_platform').value = giftRow.platform || 'X'; }
  giftPick = null; drawGiftPick(); $('g_status').textContent = ''; $('g_link').innerHTML = ''; $('g_send').disabled = false;
  $('giftDlg').showModal();
  if (giftPool === null) loadGiftPool(); else drawGiftPool();
}
async function sendGift() {
  const handle = $('g_handle').value.trim();
  const miss = [];
  if (handle.replace('@', '').length < 2) miss.push('their handle');
  if (!giftPick) miss.push('a Blueprint');
  if (miss.length) { $('g_status').textContent = 'Please give ' + miss.join(', ') + '.'; return; }

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dueOn(r, d) { const rep = String(r.repeat || 'daily'); return rep === 'daily' || rep.split(',').includes(DAYS[d.getDay()]); }
function lastDueBefore(r) {
  for (let i = 1; i <= 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); if (dueOn(r, d)) return ymd(d); }
  return '';
}
function missedOn(r) {
  const last = lastDueBefore(r);
  if (!last || r.status !== 'Today') return '';
  const made = r.createdAt ? ymd(new Date(r.createdAt)) : '';
  if (made && made > last) return '';
  return (r.done_on || '') < last ? last : '';
}

  const sub = '<div class="subtabs">' + Object.keys(FVIEWS).map(v => '<button class="tab' + (v === fview ? ' on' : '') + '" data-fv="' + esc(v) + '">' + esc(v) + '<span class="n">' + frows.filter(FVIEWS[v]).length + '</span></button>').join('') + '</div>';
  const add = '<div class="addbar"><form id="addform"><input id="addhandle" type="text" placeholder="Add a username you followed, e.g. @name" autocomplete="off" autocapitalize="off"><button class="btn" type="submit">Add</button></form></div>';
  let hint = '';
  if (fview === 'To follow') hint = '<div class="hint">Follow these by hand: open the profile, press Follow on X, then press "I followed" here. About 25 a day is safe.</div>';
  if (fview === 'Unfollow due') hint = '<div class="hint">No follow-back after ' + UNFOLLOW_AFTER_DAYS + ' days. Unfollow by hand on X, then press "I unfollowed".</div>';
  const list = frows.filter(FVIEWS[fview]);
  $('list').innerHTML = add + sub + hint + (list.length ? list.map(followCard).join('') : '<div class="empty">Nothing here.</div>');
  $('addform').onsubmit = addFollow;
  $('list').querySelectorAll('[data-fv]').forEach(b => b.onclick = () => { fview = b.dataset.fv; render(); });
  $('list').querySelectorAll('[data-fid]').forEach(c => {
    const r = frows.find(x => String(x.id) === c.dataset.fid);
    c.querySelectorAll('[data-fa]').forEach(b => b.onclick = () => {
      const a = b.dataset.fa;
      if (a === 'followed') saveFollow(Object.assign({}, r, { status: 'Followed', followed_on: today() }));
      if (a === 'skip') saveFollow(Object.assign({}, r, { status: 'Skipped' }));
      if (a === 'back') saveFollow(Object.assign({}, r, { status: 'Followed back', checked_on: today() }));
      if (a === 'unfollowed') saveFollow(Object.assign({}, r, { status: 'Skipped', checked_on: today() }));
    });
  });
}

async function saveFollow(r) {
  const prev = frows.slice();
  const i = frows.findIndex(x => String(x.id) === String(r.id));
  frows[i] = r; render();
  try {
    const res = await fetch(FOLLOW_SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: r.id, status: r.status, followed_on: r.followed_on || '', checked_on: r.checked_on || '' }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const out = await res.json(); if (!out.ok) throw new Error('not saved');
    toast('Saved');
  } catch (e) { frows = prev; render(); toast('Not saved: ' + e.message); }
}

async function addFollow(e) {
  e.preventDefault();
  const h = cleanHandle($('addhandle').value);
  if (!h) return;
  const dup = frows.find(r => String(r.handle).toLowerCase() === h.toLowerCase());
  if (dup) { toast('Already on the list: ' + dup.status); return; }
  try {
    const res = await fetch(FOLLOW_SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ handle: h, status: 'Followed', followed_on: today(), checked_on: '' }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const out = await res.json(); if (!out.ok) throw new Error('not saved');
    fview = 'Waiting for follow-back';
    toast('Added @' + h);
    await load();
  } catch (err) { toast('Not added: ' + err.message); }
}

// ===== Products tab (18 Oct 2026, Andy): make products from a design and a Gelato template ID =====
// Andy makes the template in Gelato, pastes its ID here and presses Check. The template decides the product
// (t-shirt, mug, ...). The rules for that product type (title, description, tags, pictures) need Andy's yes once.
// Each run then goes: print fitted to the template -> Andy approves the design -> Gelato product -> Shopify draft
// -> Andy presses Go live. SC - Product Runner moves runs on every minute; SC - Product API serves this tab.
const PRODUCT_URL = BASE + 'sc-product-api';
const prod = { loaded: false, loading: false, designs: [], rules: [], runs: [], tpl: null, tplErr: '', picked: new Set(), timer: null, open: {} };
const RUN_STEPS = { queued: 'Queued', layout_running: 'Fitting the design', design_ready: 'Design ready', gelato_created: 'Making in Gelato', shopify_arrived: 'Reached Shopify', ready_check: 'Shopify draft', live: 'Live', failed: 'Failed', stopped: 'Stopped' };
const SHOP_ADMIN = 'https://admin.shopify.com/store/stiifcompnft/products/';

async function productApi(body) {
  const r = await fetch(PRODUCT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let d = null; try { d = await r.json(); } catch (e) { d = null; }
  if (!r.ok || !d) throw new Error(d && (d.error || d.message) ? (d.error || d.message) : 'The product service answered ' + r.status);
  if (d.ok === false) throw new Error(d.error || 'Refused');
  return d;
}
async function loadProducts(quiet) {
  if (prod.loading) return; prod.loading = true;
  try { const d = await productApi({ action: 'list' }); prod.designs = d.designs || []; prod.rules = d.rules || []; prod.runs = d.runs || []; prod.loaded = true; }
  catch (e) { if (!quiet) toast('Could not load products: ' + e.message); }
  prod.loading = false;
  if (view === 'Products') renderProducts(); else renderTabs();
}
function prodRule(t) { return prod.rules.find(r => r.product_type === t) || null; }
function openRuns(key, tid) { return prod.runs.filter(r => r.design_key === key && r.template_id === tid && ['failed', 'stopped'].indexOf(r.status) === -1); }
function fillPattern(s, d, tplTitle) {
  return String(s || '').split('{NAME}').join(d.name_line).split('{P1}').join(d.phrase_1).split('{P2}').join(d.phrase_2)
    .split('{CHAR_LINE}').join(d.char_line).split('{CHARACTER}').join(d.character).split('{TEMPLATE_TITLE}').join(tplTitle || '');
}

function renderProducts() {
  renderTabs();
  if (!prod.loaded) { $('list').innerHTML = '<div class="empty">Loading products…</div>'; loadProducts(); return; }
  clearInterval(prod.timer); prod.timer = setInterval(() => { if (view === 'Products' && !document.hidden && !document.querySelector('.prule :focus, #p_tid:focus')) loadProducts(true); else if (view !== 'Products') clearInterval(prod.timer); }, 30000);
  const t = prod.tpl;
  const designs = prod.designs.filter(d => d.status === 'approved' && d.kind !== 'logo');
  let h = '<div class="pbox"><h3>New product</h3>'
    + '<div class="prow"><input type="text" id="p_tid" placeholder="Gelato template ID (made in the Gelato dashboard)" value="' + esc(t ? t.templateId : ($('p_tid') ? $('p_tid').value : '')) + '">'
    + '<button class="btn" id="p_check">Check</button></div>';
  if (prod.tplErr) h += '<div class="tplinfo" style="color:#c62828">' + esc(prod.tplErr) + '</div>';
  if (t) {
    const rule = prodRule(t.product_type);
    h += '<div class="tplinfo"><div><b>Template</b>' + esc(t.templateName) + '</div>'
      + '<div><b>Product</b>' + esc(rule ? rule.label : t.product_type) + ' · ' + t.variantCount + ' variant' + (t.variantCount === 1 ? '' : 's') + (t.colours && t.colours.length ? ' · ' + esc(t.colours.join(', ')) : '') + '</div>'
      + '<div><b>Print area</b>' + esc((t.imageSlots || []).join('; ')) + '</div>'
      + (!rule ? '<div style="color:#c62828">There are no rules for this product type yet. Runs will wait until Claude has drafted them and you have said yes.</div>'
        : rule.approved !== 'yes' ? '<div style="color:#b06a00">The ' + esc(rule.label) + ' rules are a draft. Runs wait until you approve them below.</div>' : '')
      + '</div>';
    h += '<div class="dpick">' + designs.map(d => {
      const busy = openRuns(d.key, t.templateId).length > 0;
      return '<label class="' + (busy ? 'busy' : '') + '"><input type="checkbox" data-dk="' + esc(d.key) + '"' + (busy ? ' disabled' : (prod.picked.has(d.key) ? ' checked' : '')) + '>' + esc(d.character) + (busy ? ' (already made or running)' : '') + '</label>';
    }).join('') + '</div>';
    h += '<div class="prow"><button class="btn ghost small" id="p_all">Pick all</button><button class="btn" id="p_start"' + (prod.picked.size ? '' : ' disabled') + '>Start ' + prod.picked.size + ' run' + (prod.picked.size === 1 ? '' : 's') + '</button></div>';
  }
  h += '</div>';

  h += newDesignHtml() + designsInProgressHtml() + libraryHtml();

  prod.rules.filter(r => r.approved !== 'yes').forEach(r => {
    const ex = prod.designs.find(d => d.kind !== 'logo');
    h += '<div class="pbox prule" data-pt="' + esc(r.product_type) + '"><h3>' + esc(r.label) + ' rules: draft for your yes</h3>'
      + '<div class="tplinfo"><div><b>Layout</b>' + esc(r.layout_mode) + '</div><div><b>Ink</b>' + esc(r.ink_rule) + '</div><div><b>Pictures</b>' + esc(r.picture_set) + '</div></div>'
      + '<label>Title pattern ({NAME}, {P1}, {P2})<input data-f="title_pattern" value="' + esc(r.title_pattern) + '"></label>'
      + '<label>Description ({P1}, {P2}, {CHAR_LINE}, {TEMPLATE_TITLE})<textarea data-f="description_html">' + esc(r.description_html) + '</textarea></label>'
      + '<label>Tags (the character tag is added to each product; these decide the collections)<input data-f="tags_extra" value="' + esc(r.tags_extra) + '"></label>'
      + (r.layout_mode === 'sides' ? sidesHtml(r) : '')
      + (ex ? '<div class="pex"><b>Example: ' + esc(ex.character) + '</b><div style="font-weight:600;margin-top:4px">' + esc(fillPattern(r.title_pattern, ex, t && t.product_type === r.product_type ? t.title : '[template title]')) + '</div>'
        + '<div>' + fillPattern(r.description_html, ex, t && t.product_type === r.product_type ? esc(t.title) : '[template title]') + '</div></div>' : '')
      + '<div class="prow" style="margin-top:8px"><button class="btn ghost" data-ract="save">Save changes</button><button class="btn done" data-ract="approve">Approve these rules</button></div></div>';
  });

  const groups = [
    ['Needs you', r => /^andy_/.test(r.waiting_on || ''), 'need'],
    ['In progress', r => r.waiting_on === 'runner', 'prog'],
    ['Live', r => r.status === 'live', 'live'],
    ['Failed or stopped', r => r.status === 'failed' || r.status === 'stopped', 'bad']
  ];
  groups.forEach(g => {
    const list = prod.runs.filter(g[1]);
    if (!list.length) return;
    h += '<div class="group-title">' + g[0] + ' (' + list.length + ')</div>' + list.map(r => runCard(r, g[2])).join('');
  });
  if (!prod.runs.length) h += '<div class="empty">No product runs yet.</div>';
  $('list').innerHTML = h;
  wireProducts();
}

function runCard(r, cls) {
  const d = prod.designs.find(x => x.key === r.design_key) || {};
  const rule = prodRule(r.product_type);
  const step = RUN_STEPS[r.status] || r.status;
  const wait = r.waiting_on === 'andy_design' ? 'Check the print and approve it' : r.waiting_on === 'andy_live' ? 'Check the Shopify draft and press Go live' : r.waiting_on === 'andy_rules' ? 'Approve the ' + (rule ? rule.label : r.product_type) + ' rules above' : '';
  let h = '<div class="card run ' + cls + '" data-rid="' + r.id + '"><div class="body">'
    + '<div class="title">' + esc(r.title || ((d.character || r.design_key) + ' · ' + (rule ? rule.label : r.product_type))) + '</div>'
    + '<div class="step"><b>' + esc(step) + '</b>' + (wait ? ' · ' + esc(wait) : '') + '</div>'
    + '<div class="step" style="color:var(--grey)">' + esc(r.message || '') + '</div>'
    + '<div class="step" style="color:var(--grey);font-size:12px">' + esc(r.template_name || r.template_id) + (r.updated_on ? ' · ' + esc(String(r.updated_on).slice(0, 16).replace('T', ' ')) : '') + '</div>';
  if (r.preview_url && ['design_ready', 'gelato_created', 'shopify_arrived', 'ready_check'].indexOf(r.status) !== -1) h += '<a href="' + esc(safeUrl(r.preview_url)) + '" target="_blank" rel="noopener"><img class="pv" src="' + esc(safeUrl(r.preview_url)) + '" alt="Print file"></a>';
  if (r.shopify_product_id) h += '<div class="step"><a href="' + SHOP_ADMIN + esc(r.shopify_product_id) + '" target="_blank" rel="noopener">Open in Shopify</a></div>';
  h += '<div class="acts2">';
  if (r.waiting_on === 'andy_design') h += '<button class="btn done small" data-pact="approve_design">Approve design</button><button class="btn ghost small" data-pact="reject">Reject</button>';
  if (r.waiting_on === 'andy_live') h += '<button class="btn done small" data-pact="approve_live">Go live</button>';
  if (r.status === 'failed' || r.status === 'stopped') h += '<button class="btn ghost small" data-pact="retry">Retry</button>';
  if (['live', 'failed', 'stopped'].indexOf(r.status) === -1) h += '<button class="btn ghost small" data-pact="stop">Stop</button>';
  h += '</div>';
  if (r.log) h += '<details class="more"' + (prod.open[r.id] ? ' open' : '') + '><summary>Log</summary><pre>' + esc(r.log) + '</pre></details>';
  return h + '</div></div>';
}

function wireProducts() {
  const lib = $('p_lib'); if (lib) lib.ontoggle = () => { prod.libOpen = lib.open; };
  wireDesigns();
  $('p_check').onclick = async () => {
    const id = $('p_tid').value.trim();
    prod.tpl = null; prod.tplErr = ''; prod.picked.clear();
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) { prod.tplErr = 'That is not a Gelato template ID. Copy it from the template in the Gelato dashboard.'; renderProducts(); return; }
    $('p_check').disabled = true; $('p_check').textContent = 'Checking…';
    try { prod.tpl = await productApi({ action: 'check_template', templateId: id }); }
    catch (e) { prod.tplErr = 'Gelato could not read that template: ' + e.message; }
    renderProducts();
  };
  $('list').querySelectorAll('.dpick input').forEach(cb => cb.onchange = () => { cb.checked ? prod.picked.add(cb.dataset.dk) : prod.picked.delete(cb.dataset.dk); renderProducts(); });
  const all = $('p_all'); if (all) all.onclick = () => { $('list').querySelectorAll('.dpick input:not(:disabled)').forEach(cb => prod.picked.add(cb.dataset.dk)); renderProducts(); };
  const st = $('p_start'); if (st) st.onclick = async () => {
    const t = prod.tpl; const keys = Array.from(prod.picked);
    if (!t || !keys.length) return;
    if (!confirm('Start ' + keys.length + ' ' + (prodRule(t.product_type) ? prodRule(t.product_type).label.toLowerCase() : t.product_type) + ' run(s) from "' + t.templateName + '"? Nothing goes to Gelato or Shopify until you approve each design.')) return;
    st.disabled = true; st.textContent = 'Starting…';
    try { const d = await productApi({ action: 'start', templateId: t.templateId, templateName: t.templateName, product_type: t.product_type, designs: keys }); toast(d.started + ' run(s) queued'); prod.picked.clear(); await loadProducts(); }
    catch (e) { toast('Could not start: ' + e.message); renderProducts(); }
  };
  $('list').querySelectorAll('.prule').forEach(box => {
    const pt = box.dataset.pt;
    const vals = () => {
      const o = {}; box.querySelectorAll('[data-f]').forEach(i => o[i.dataset.f] = i.value);
      [1, 2].forEach(n => { const ticks = box.querySelectorAll('[data-side="' + n + '"]'); if (ticks.length) o['side_' + n] = Array.from(ticks).filter(c => c.checked).map(c => c.value).join(','); });
      return o;
    };
    box.querySelectorAll('[data-ract]').forEach(b => b.onclick = async () => {
      const approve = b.dataset.ract === 'approve';
      const v = vals();
      if (box.querySelector('[data-side]') && (!v.side_1 || !v.side_2)) { toast('Pick at least one part for each side'); return; }
      if (approve && !confirm('Approve these rules? Every new product of this type will use them.')) return;
      b.disabled = true;
      try { await productApi(Object.assign({ action: 'save_rule', product_type: pt, approve: approve }, v)); toast(approve ? 'Rules approved' : 'Rules saved'); await loadProducts(); }
      catch (e) { toast('Could not save: ' + e.message); b.disabled = false; }
    });
  });
  $('list').querySelectorAll('.run').forEach(c => {
    const rid = c.dataset.rid;
    const det = c.querySelector('details'); if (det) det.ontoggle = () => { prod.open[rid] = det.open; };
    c.querySelectorAll('[data-pact]').forEach(b => b.onclick = async () => {
      const stepName = b.dataset.pact;
      let note = '';
      if (stepName === 'approve_live' && !confirm('Put this product live on the shop now?')) return;
      if (stepName === 'stop' && !confirm('Stop this run?')) return;
      if (stepName === 'reject') { note = prompt('What is wrong with the design? The run stops and your note is kept in its log.', ''); if (note === null) return; }
      b.disabled = true;
      try { await productApi({ action: 'run_update', runId: Number(rid), step: stepName === 'reject' ? 'stop' : stepName, note: stepName === 'reject' ? 'design rejected: ' + note : note }); toast('Done'); await loadProducts(); }
      catch (e) { toast(e.message); b.disabled = false; }
    });
  });
}

      + '<div class="step" style="color:var(--grey)">' + esc(d.message || '') + '</div>';
    if (d.sheet_url) h += '<div class="sheets"><a href="' + esc(safeUrl(d.sheet_url)) + '" target="_blank" rel="noopener"><img src="' + esc(safeUrl(d.sheet_url)) + '" alt="Comparison with Hammerin\' Hanky"></a>'
      + '<a href="' + esc(safeUrl(d.likeness_url)) + '" target="_blank" rel="noopener"><img src="' + esc(safeUrl(d.likeness_url)) + '" alt="Likeness against the smiling reference"></a></div>';
    else if (d.picture_url) h += '<a href="' + esc(safeUrl(d.picture_url)) + '" target="_blank" rel="noopener"><img class="pv" src="' + esc(safeUrl(d.picture_url)) + '" alt="Latest picture"></a>';
    h += '<div class="acts2">';
    if (need) h += '<button class="btn done small" data-dact="approve">Approve design</button><button class="btn ghost small" data-dact="reject">Reject</button>';
    if (bad) h += '<button class="btn ghost small" data-dact="retry">Retry (new quote, $0.40 at most)</button>';
    if (!bad && !need) h += '<button class="btn ghost small" data-dact="stop">Stop</button>';
    h += '</div>';
    if (d.log) h += '<details class="more"><summary>Log</summary><pre>' + esc(d.log) + '</pre></details>';
    return h + '</div></div>';
  }).join('');
}
async function uploadRef(file, i) {
  const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', 'SCSMAuto');
  fd.append('public_id', 'design_refs/' + Date.now() + '_' + i);
  const r = await fetch(CLOUD_UPLOAD, { method: 'POST', body: fd }); const d = await r.json();
  if (!d.secure_url) throw new Error('Upload failed for ' + file.name);
  return d.secure_url;
}
function wireDesigns() {
  const nd = $('p_new'); if (nd) nd.ontoggle = () => { prod.newOpen = nd.open; };
  const inp = $('nd_refs');
  if (inp) inp.onchange = () => { $('nd_thumbs').innerHTML = Array.from(inp.files).map((f, i) => '<div class="libcard"><img class="chk" src="' + URL.createObjectURL(f) + '" alt=""><div class="libph">' + (i === 0 ? 'Smiling face' : 'Reference ' + (i + 1)) + '</div></div>').join(''); };
  const go = $('nd_go');
  if (go) go.onclick = async () => {
    const v = id => $(id).value.trim();
    const files = Array.from($('nd_refs').files || []);
    if (!v('nd_char') || !v('nd_p1') || !v('nd_p2') || !v('nd_line')) { toast('Fill in the name, both phrase lines and the character line'); return; }
    if (!files.length) { toast('Add the reference pictures, the smiling face first'); return; }
    if (!confirm('Build the ' + v('nd_char') + ' design? About $0.13 per attempt, $0.40 at most.')) return;
    go.disabled = true; go.textContent = 'Uploading pictures…';
    try {
      const refs = []; for (let i = 0; i < files.length; i++) refs.push(await uploadRef(files[i], i));
      go.textContent = 'Starting…';
      const d = await productApi({ action: 'new_design', character: v('nd_char'), name_line: v('nd_name'), phrase_1: v('nd_p1'), phrase_2: v('nd_p2'), char_line: v('nd_line'), refs: refs });
      toast('Design ' + d.key + ' queued'); prod.newOpen = false; await loadProducts();
    } catch (e) { toast('Could not start: ' + e.message); go.disabled = false; go.textContent = 'Build design'; }
  };
  $('list').querySelectorAll('[data-did]').forEach(c => {
    c.querySelectorAll('[data-dact]').forEach(b => b.onclick = async () => {
      let step = b.dataset.dact, note = '';
      if (step === 'approve' && !confirm('Approve this design? It joins the library and the product list.')) return;
      if (step === 'reject') { note = prompt('What is wrong with the design? It stops and your note is kept in its log.', ''); if (note === null) return; step = 'stop'; note = 'design rejected: ' + note; }
      if (step === 'stop' && !note && !confirm('Stop building this design?')) return;
      if (step === 'retry' && !confirm('Start again with up to 3 new attempts? About $0.13 each, $0.40 at most.')) return;
      b.disabled = true;
      try { await productApi({ action: 'design_update', designId: Number(c.dataset.did), step: step, note: note }); toast('Done'); await loadProducts(); }
      catch (e) { toast(e.message); b.disabled = false; }
    });
  });
}

// ===== Pricing tab (18 Oct 2026, Andy): cost, price and profit for every product in every market =====
// Data: n8n data table SC Pricing Matrix (inputs only: price, Gelato cost, Gelato shipping, FX, PayPal, code).
// Profit is worked out here: price in GBP - Gelato cost - Gelato shipping (only where we pay it) - PayPal fee.
// "After code" repeats it with the biggest promotion taken off. LOSS = zero or less. LOW = under the market's floor.
const PRICING_URL = BASE + 'sc-pricing-list', PRICING_FLOOR_URL = BASE + 'sc-pricing-floor';
const pr = { loaded: false, loading: false, rows: [], fx: {}, floors: {}, pp: { pct: 2.9, fixed: 0.3 }, promo: 10, mkt: 'All', prob: false, err: '' };
const PR_SYM = { GBP: '£', USD: '$', CAD: 'C$', EUR: '€', AUD: 'A$', NZD: 'NZ$' };
async function loadPricing(quiet) {
  if (pr.loading) return; pr.loading = true;
  try {
    const r = await fetch(PRICING_URL); if (!r.ok) throw new Error('answered ' + r.status);
    let all = await r.json(); if (all && !Array.isArray(all)) all = [all]; if (!Array.isArray(all)) throw new Error('unexpected answer');
    pr.err = '';
    pr.rows = all.filter(x => x.kind === 'row'); pr.fx = {}; pr.floors = {};
    all.forEach(x => {
      if (x.kind === 'fx') pr.fx[x.currency] = Number(x.price_gbp);
      if (x.kind === 'floor') pr.floors[x.market] = Number(x.margin_pct);
      if (x.kind === 'setting' && x.group === 'paypal') pr.pp = { pct: Number(x.margin_pct), fixed: Number(x.gelato_cost_gbp) };
      if (x.kind === 'setting' && x.group === 'promo') pr.promo = Number(x.margin_pct);
    });
    pr.loaded = true;
  } catch (e) { pr.err = e.message; if (!quiet) toast('Could not load pricing: ' + e.message); }
  pr.loading = false;
  if (view === 'Pricing') renderPricing(); else renderTabs();
}
function prCalc(x) {
  const fx = pr.fx[x.currency] || 1, pg = Number(x.price_local) / fx, paid = x.shopper_ship !== 'Charged';
  const cost = Number(x.gelato_cost_gbp) + (paid ? Number(x.gelato_ship_gbp) : 0);
  const fee = pg * pr.pp.pct / 100 + pr.pp.fixed, profit = pg - cost - fee;
  const pd = pg * (1 - pr.promo / 100), profitD = pd - cost - (pd * pr.pp.pct / 100 + pr.pp.fixed);
  const floorKey = /^Europe/.test(x.market) ? 'Europe' : x.market, floor = pr.floors[floorKey] || 0;
  const margin = profit / pg * 100;
  const flag = profit <= 0 || profitD <= 0 ? 'LOSS' : margin < floor ? 'LOW' : '';
  return { pg, paid, cost, fee, profit, profitD, margin, flag, loc: Number(x.price_local), sym: PR_SYM[x.currency] || '' };
}
function prTone(profit, margin, floor) {
  if (profit <= 0) return ['#f8d0d0', '#7f1414'];
  if (floor !== null && margin < floor) return ['#ffe9a8', '#6b4a00'];
  return ['#d4f0dc', '#11502a'];
}
const PR_COLS = [['product', 'Product'], ['market', 'Market'], ['price', 'Price'], ['cost', 'Gelato cost + shipping'], ['profit', 'Profit'], ['after', 'Profit after code']];
function prKey(x, c, k) {
  if (k === 'product') return (x.product + ' ' + x.size).toLowerCase();
  if (k === 'market') return x.market.toLowerCase();
  if (k === 'price') return c.pg; if (k === 'cost') return c.cost; if (k === 'profit') return c.profit; if (k === 'after') return c.profitD;
  return 0;
}
function renderPricing() {
  renderTabs();
  if (!pr.loaded) {
    if (pr.err) { $('list').innerHTML = '<div class="error-state">Could not load pricing (' + esc(pr.err) + '). Check the workflow SC - Pricing API is active. <button class="btn" id="pr_retry">Try again</button></div>'; $('pr_retry').onclick = () => { pr.err = ''; renderPricing(); }; return; }
    $('list').innerHTML = '<div class="empty">Loading pricing…</div>'; loadPricing(); return;
  }
  if (!pr.sort) { pr.sort = 'after'; pr.dir = 1; }
  const markets = ['All'].concat(Array.from(new Set(pr.rows.map(x => x.market))));
  const f = n => (n < 0 ? '-' : '') + '£' + Math.abs(n).toFixed(2);
  const calc = pr.rows.map(x => { const c = prCalc(x), fl = c.floorV; return [x, c]; });
  const floorOf = x => pr.floors[/^Europe/.test(x.market) ? 'Europe' : x.market] || 0;
  const worst = ([x, c]) => { const pd = c.pg * (1 - pr.promo / 100); const t1 = prTone(c.profit, c.margin, floorOf(x)), t2 = prTone(c.profitD, 0, null); return (t1[0] === '#f8d0d0' || t2[0] === '#f8d0d0') ? 'red' : (t1[0] === '#ffe9a8' || t2[0] === '#ffe9a8') ? 'amber' : 'green'; };
  const nRed = calc.filter(r => worst(r) === 'red').length, nAmb = calc.filter(r => worst(r) === 'amber').length, nGrn = calc.length - nRed - nAmb;
  const shown = calc.filter(([x, c]) => (pr.mkt === 'All' || x.market === pr.mkt) && (!pr.prob || worst([x, c]) !== 'green'))
    .sort((p, q) => { const a = prKey(p[0], p[1], pr.sort), b = prKey(q[0], q[1], pr.sort); return (a < b ? -1 : a > b ? 1 : 0) * pr.dir; });
  const tile = (n, label, bg, fg) => '<div style="flex:1;min-width:120px;padding:10px 12px;border-radius:8px;background:' + bg + ';color:' + fg + '"><div style="font-size:24px;font-weight:700;line-height:1">' + n + '</div><div style="font-size:12px">' + label + '</div></div>';
  let h = '<style>.prtab{width:100%;border-collapse:collapse;font-size:13px}.prtab th{text-align:left;padding:6px;border-bottom:2px solid #bbb;cursor:pointer;user-select:none;vertical-align:bottom}.prtab td{padding:5px 6px;border-bottom:1px solid #e6e6e6;vertical-align:top}.prtab .sub{display:block;font-size:11px;opacity:.7}@media(max-width:700px){.prtab{font-size:12px}.prtab th,.prtab td{padding:4px 3px}}</style>'
    + '<div class="pbox"><h3>Pricing, shipping and profit</h3>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">' + tile(nRed, 'losing money (before or after the code)', '#f8d0d0', '#7f1414') + tile(nAmb, 'under the floor (price rule not met)', '#ffe9a8', '#6b4a00') + tile(nGrn, 'healthy', '#d4f0dc', '#11502a') + '</div>'
    + '<div class="prow" style="flex-wrap:wrap;gap:10px;align-items:center"><label>Sort by <select id="pr_s">' + PR_COLS.map(c => '<option value="' + c[0] + '"' + (c[0] === pr.sort ? ' selected' : '') + '>' + c[1] + '</option>').join('') + '</select></label>'
    + '<button class="btn" id="pr_d">' + (pr.dir === 1 ? 'Lowest first ↑' : 'Highest first ↓') + '</button>'
    + '<label>Market <select id="pr_m">' + markets.map(m => '<option' + (m === pr.mkt ? ' selected' : '') + '>' + esc(m) + '</option>').join('') + '</select></label>'
    + '<label><input type="checkbox" id="pr_p"' + (pr.prob ? ' checked' : '') + '> Problems only</label></div>'
    + '<details style="margin-top:8px"><summary>Floor per market (profit as % of price; 25.9% = the standard rule of 35% on top of cost) and how profit is worked out</summary>'
    + '<div class="tplinfo">Profit = price in pounds - Gelato cost - Gelato shipping (where we pay it) - PayPal fee (' + pr.pp.pct + '% + £' + pr.pp.fixed.toFixed(2) + '). After code = the same with ' + pr.promo + '% off (STANDTALL10, ends 30 Nov 2026). Standard price rule: total cost (Gelato cost, Gelato shipping where we pay it, PayPal fee) plus 35%, rounded up to a whole number; Canada is 25% as long as it makes a profit. Rates and Gelato costs checked 18 Oct 2026. NFTs are not on this tab yet.</div>'
    + '<div class="prow" style="flex-wrap:wrap;gap:8px">' + ['United States', 'Canada', 'United Kingdom', 'Germany (EU)', 'Australia', 'New Zealand', 'Europe'].map(m =>
      '<label>' + esc(m) + ' <input type="number" class="pr_fl" data-m="' + esc(m) + '" value="' + (pr.floors[m] || 0) + '" style="width:56px"></label>').join('') + '</div></details></div>'
    + '<table class="prtab"><thead><tr>' + PR_COLS.map(c => '<th data-k="' + c[0] + '">' + c[1] + (pr.sort === c[0] ? (pr.dir === 1 ? ' ↑' : ' ↓') : '') + '</th>').join('') + '</tr></thead><tbody>';
  shown.forEach(([x, c]) => {
    const pd = c.pg * (1 - pr.promo / 100), fl = floorOf(x);
    const t1 = prTone(c.profit, c.margin, fl), t2 = prTone(c.profitD, 0, null);
    const cell = (t, main, sub) => '<td style="background:' + t[0] + ';color:' + t[1] + '"><b>' + main + '</b><span class="sub">' + sub + '</span></td>';
    h += '<tr><td><b>' + esc(x.product.replace(/^\d+ /, '')) + '</b><span class="sub">' + esc(x.size === '-' ? '' : x.size) + '</span></td>'
      + '<td>' + esc(x.market.replace('Europe: ', '')) + '<span class="sub">' + (/^Europe/.test(x.market) ? 'Europe · ' : '') + 'made in ' + esc(x.made_in) + '</span></td>'
      + '<td>' + c.sym + (Number.isInteger(c.loc) ? c.loc.toFixed(0) : c.loc.toFixed(2)) + '<span class="sub">' + f(c.pg) + '</span></td>'
      + '<td>' + f(Number(x.gelato_cost_gbp)) + ' + ' + f(Number(x.gelato_ship_gbp)) + '<span class="sub">' + (c.paid ? 'we pay the shipping' : 'shopper pays the shipping') + '</span></td>'
      + cell(t1, f(c.profit), '+' + (c.profit / (c.cost + c.fee) * 100).toFixed(1) + '% on cost · ' + c.margin.toFixed(1) + '% of price')
      + cell(t2, f(c.profitD), (c.profitD / pd * 100).toFixed(1) + '% of price')
      + '</tr>';
  });
  h += '</tbody></table>';
  $('list').innerHTML = h;
  $('pr_s').onchange = e => { pr.sort = e.target.value; renderPricing(); };
  $('pr_d').onclick = () => { pr.dir = -pr.dir; renderPricing(); };
  $('list').querySelectorAll('.prtab th').forEach(th => th.onclick = () => { if (pr.sort === th.dataset.k) pr.dir = -pr.dir; else { pr.sort = th.dataset.k; pr.dir = 1; } renderPricing(); });
  $('pr_m').onchange = e => { pr.mkt = e.target.value; renderPricing(); };
  $('pr_p').onchange = e => { pr.prob = e.target.checked; renderPricing(); };
  $('list').querySelectorAll('.pr_fl').forEach(i => i.onchange = async () => {
    try {
      const r = await fetch(PRICING_FLOOR_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ market: i.dataset.m, floor: Number(i.value) }) });
      if (!r.ok) throw new Error('answered ' + r.status);
      pr.floors[i.dataset.m] = Number(i.value); toast('Floor saved'); renderPricing();
    } catch (e) { toast('Not saved: ' + e.message); }
  });
}
