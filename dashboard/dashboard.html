// ---------- Cartoons board (18 Oct 2026, Andy) ----------
// A storyboard you assemble by hand from pieces that already exist (SC Content Library rows with kind "cartoon piece"),
// plus text cards, credits and "needed" cards for clips still to be made. Plays a rough cut for free; saves the recipe
// to the cartoon's Content Library row (kind "cartoon") through SC - Cartoon Board Save. Nothing here spends money:
// the needed cards are the build list, quoted before anything runs through SC - Cartoon Clip Maker.
const CB_SAVE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-cartoon-board-save';
const CB_LOGO = 'https://res.cloudinary.com/dkapdtxek/image/upload/v1789861830/sc_watermark_logo.png';
const CB_PRICE = { picture: 0.04, second: 0.084, checks: 0.01 };   // vendor pages 18 Oct 2026: Gemini 3.1 Flash-Lite Image, Kling O3 Standard audio off
const CB_CHARS = ['Major Wood', "Hammerin' Hanky", 'The Grip', 'The Velvet Python', 'Slick Willy', 'The Rear Admiral'];
const CB_TYPES = ['approach', 'reaction', 'back-off', 'stunned', 'walk', 'turn', 'other'];
let CB = { id: '', title: '', character: 'The Grip', shots: [], filter: '' };
let CB_PLAY = { on: false, idx: 0, t0: 0, raf: 0, stopFn: null };

function cbPieces() {
  return (LIB || []).filter(l => String(l.kind || '') === 'cartoon piece').map(l => {
    const n = String(l.notes || '');
    const kind = /green-screen/i.test(n) ? 'green' : /^Backdrop/i.test(n) ? 'backdrop' : l.video_url ? 'clip' : 'picture';
    return { id: 'LIB:' + l.id, lib: l, kind, title: l.title || ('Piece ' + l.id), character: l.character || '', video: l.video_url || '', image: l.image_url || '', duration: Number(l.duration || 0), notes: n };
  });
}
function cbCartoons() { return (LIB || []).filter(l => String(l.kind || '') === 'cartoon'); }
function cbNewShot(piece) {
  if (piece.kind === 'backdrop') return null;
  return { type: piece.kind, ref: piece.id, title: piece.title, character: piece.character, video: piece.video, image: piece.image,
    len: piece.duration > 0 ? Math.min(piece.duration, 5) : 2, src: piece.duration || 0, reverse: false, repeat: 1, trimStart: 0,
    backdrop: '', bdX: 50, scale: 100, offY: 0 };
}
function cbShotCost(s) { return s.type === 'needed' ? Math.round((CB_PRICE.picture + CB_PRICE.checks + Math.max(3, Math.ceil(s.len)) * CB_PRICE.second) * 100) / 100 : 0; }
function cbShotLen(s) { return Math.max(0.2, Number(s.len) || 0) * Math.max(1, Number(s.repeat) || 1); }
function cbTotals() {
  const t = CB.shots.reduce((a, s) => a + cbShotLen(s), 0);
  const c = CB.shots.reduce((a, s) => a + cbShotCost(s), 0);
  const n = CB.shots.filter(s => s.type === 'needed').length;
  return { seconds: Math.round(t * 10) / 10, cost: Math.round(c * 100) / 100, needed: n };
}

// ---- rough-cut player: one shot after another on the 9:16 stage ----
function cbStop() { CB_PLAY.on = false; if (CB_PLAY.raf) cancelAnimationFrame(CB_PLAY.raf); if (CB_PLAY.stopFn) { try { CB_PLAY.stopFn(); } catch (e) {} } CB_PLAY.stopFn = null; }
async function cbPlay() {
  cbStop(); if (!CB.shots.length) return; CB_PLAY.on = true;
  let clock = 0;
  for (let i = 0; i < CB.shots.length && CB_PLAY.on; i++) {
    const s = CB.shots[i]; const reps = Math.max(1, Number(s.repeat) || 1);
    for (let r = 0; r < reps && CB_PLAY.on; r++) { await cbPlayShot(s, clock); clock += Math.max(0.2, Number(s.len) || 0); }
  }
  CB_PLAY.on = false;
}
function cbStageSet(html) { const st = document.getElementById('cbStage'); if (!st) return null; st.innerHTML = html + '<div class="cb-time" id="cbTime">0.0 s</div>'; return st; }
function cbPlayShot(s, clock) {
  return new Promise(resolve => {
    const len = Math.max(0.2, Number(s.len) || 0) * 1000;
    const timeEl = () => document.getElementById('cbTime');
    const tick = (t0) => { const el = timeEl(); if (el) el.textContent = ((clock * 1000 + (performance.now() - t0)) / 1000).toFixed(1) + ' s'; };
    const holdWith = (html) => { cbStageSet(html); const t0 = performance.now(); const iv = setInterval(() => tick(t0), 100); CB_PLAY.stopFn = () => clearInterval(iv); setTimeout(() => { clearInterval(iv); resolve(); }, len); };
    if (s.type === 'text') return holdWith('<div class="cb-card-text">' + escapeHtml(s.text || '').replace(/\n/g, '<br>') + '</div>');
    if (s.type === 'credits') return holdWith('<div class="cb-credits"><img src="' + CB_LOGO + '" alt=""><div>' + escapeHtml(s.line1 || '') + '</div><small>' + escapeHtml(s.line2 || '') + '</small><small>' + escapeHtml(s.line3 || '') + '</small></div>');
    if (s.type === 'needed') return holdWith('<div class="cb-needed"><b>TO BE MADE · ' + escapeHtml(s.clipType || '') + (s.reverse ? ' (reversed)' : '') + '</b><div>' + escapeHtml(s.beat || 'no beat written yet') + '</div><small>' + escapeHtml(s.set || '') + '</small></div>');
    if (s.type === 'picture' || !s.video) return holdWith('<img src="' + escapeHtml(s.image || '') + '" alt="">');
    // clip or green piece: play the video (reversed by stepping back), green keyed over the backdrop on a canvas
    const bd = s.type === 'green' && s.backdrop ? cbBackdrops().find(b => b.id === s.backdrop) : null;
    let cv = null, ctx = null;
    // Cloudinary clips are played as WebM for the preview (works in every browser); if that fails, the original file is tried.
    const srcs = /res\.cloudinary\.com\/.*\.mp4$/.test(s.video) ? [s.video.replace(/\.mp4$/, '.webm'), s.video] : [s.video];
    const v = document.createElement('video'); v.crossOrigin = 'anonymous'; v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = srcs[0];
    const bimg = new Image(); if (bd) { bimg.crossOrigin = 'anonymous'; bimg.src = bd.image; }
    let tainted = false; let t0 = performance.now(); const trim = Math.max(0, Number(s.trimStart) || 0);
    const draw = () => {
      if (!CB_PLAY.on) return;
      const el = Math.min(len, performance.now() - t0) / 1000;
      if (s.reverse) { const dur = isFinite(v.duration) ? v.duration : (Number(s.src) || 3); v.currentTime = Math.max(0, Math.min(dur - 0.05, dur - trim - el)); }
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 270, 480);
      if (bd && bimg.complete && bimg.naturalWidth) { const sw = bimg.naturalHeight * 270 / 480; const sx = (bimg.naturalWidth - sw) * (Math.min(100, Math.max(0, Number(s.bdX) || 50)) / 100); ctx.drawImage(bimg, sx, 0, sw, bimg.naturalHeight, 0, 0, 270, 480); }
      const sc = (Number(s.scale) || 100) / 100; const vw = 270 * sc, vh = 480 * sc; const vx = (270 - vw) / 2, vy = (480 - vh) / 2 + 480 * ((Number(s.offY) || 0) / 100);
      if (s.type === 'green' && !tainted) {
        try {
          const off = document.createElement('canvas'); off.width = 270; off.height = 480; const oc = off.getContext('2d', { willReadFrequently: true });
          oc.drawImage(v, vx, vy, vw, vh); const im = oc.getImageData(0, 0, 270, 480); const d = im.data;
          for (let p = 0; p < d.length; p += 4) { const r = d[p], g = d[p + 1], b = d[p + 2]; if (g > 90 && g > r * 1.35 && g > b * 1.35) d[p + 3] = 0; else if (g > r && g > b) { const k = Math.min(r, b); d[p + 1] = Math.min(g, k + 20); } }
          oc.putImageData(im, 0, 0); ctx.drawImage(off, 0, 0);
        } catch (e) { tainted = true; ctx.drawImage(v, vx, vy, vw, vh); }
      } else ctx.drawImage(v, vx, vy, vw, vh);
      tick(t0);
      if (performance.now() - t0 < len) CB_PLAY.raf = requestAnimationFrame(draw); else { v.pause(); resolve(); }
    };
    CB_PLAY.stopFn = () => { v.pause(); };
    v.addEventListener('loadedmetadata', () => { v.currentTime = s.reverse ? Math.max(0, (v.duration || 3) - trim - 0.05) : trim; });
    v.addEventListener('canplay', () => {
      // the stage switches only once the clip can play, so there is no black gap between shots
      const st = cbStageSet('<canvas id="cbCanvas" width="270" height="480"></canvas>'); if (!st) return resolve();
      cv = document.getElementById('cbCanvas'); ctx = cv.getContext('2d', { willReadFrequently: true });
      t0 = performance.now(); if (!s.reverse) v.play().catch(() => {}); draw();
    }, { once: true });
    setTimeout(() => { if (CB_PLAY.on && !cv) { holdWith('<div class="cb-needed">Clip is still loading</div>'); } }, 6000);
    let srcIdx = 0;
    v.addEventListener('error', () => { srcIdx += 1; if (srcIdx < srcs.length) { v.src = srcs[srcIdx]; v.load(); return; } holdWith('<div class="cb-needed">Could not load this clip</div>'); });
  });
}

// ---- open and save ----
function cbOpenCartoon(id) {
  cbStop();
  if (!id) { CB = { id: '', title: '', character: CB.character, shots: [], filter: CB.filter }; renderCartoons(); return; }
  const row = cbCartoons().find(c => String(c.id) === String(id)); if (!row) return;
  let r = {}; try { r = JSON.parse(row.recipe || '{}'); } catch (e) { r = {}; }
  CB = { id: String(row.id), title: row.title || '', character: row.character || CB.character, shots: Array.isArray(r.shots) ? r.shots : [], filter: CB.filter };
  renderCartoons();
}
async function cbSave() {
  const st = document.getElementById('cbStatus'); const tot = cbTotals();
  if (!CB.title.trim()) { st.textContent = 'Give the cartoon a title first.'; return; }
  st.textContent = 'Saving…';
  const recipe = { version: 1, shots: CB.shots, totals: tot, saved: new Date().toISOString() };
  const needed = CB.shots.filter(s => s.type === 'needed').map((s, k) => (k + 1) + '. ' + (s.clipType || '') + ' ' + (s.len || 3) + ' s: ' + (s.beat || '(no beat)') + (s.set ? ' [' + s.set + ']' : ''));
  const notes = 'Board recipe saved ' + new Date().toISOString().slice(0, 10) + '. ' + CB.shots.length + ' shots, ' + tot.seconds + ' s. Needed clips (' + tot.needed + ', about $' + tot.cost.toFixed(2) + '): ' + (needed.join(' | ') || 'none');
  try {
    const res = await fetch(CB_SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: CB.id || undefined, title: CB.title.trim(), character: CB.character, recipe, duration: tot.seconds, notes }) });
    const j = await res.json(); if (!j.ok) throw new Error(j.reason || 'save failed');
    if (j.id) CB.id = String(j.id);
    st.textContent = 'Saved to the Content Library' + (tot.needed ? '. ' + tot.needed + ' clip(s) to be made, about $' + tot.cost.toFixed(2) + '.' : '.');
    LIB = null; await loadLibrary();
    const sel = document.getElementById('cbOpen'); if (sel) { sel.innerHTML = '<option value="">New cartoon</option>' + cbCartoons().map(c => '<option value="' + c.id + '"' + (String(CB.id) === String(c.id) ? ' selected' : '') + '>' + escapeHtml(c.title || ('Cartoon ' + c.id)) + '</option>').join(''); }
  } catch (e) { st.textContent = 'Save failed: ' + e.message; }
}
document.getElementById('btnCartoons').addEventListener('click', () => { VIEW = 'cartoons'; setViewButtons(); render(); });
