<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stiff Competition — Content Calendar</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafafa;
    --panel: #ffffff;
    --olive: #3a3a3a;
    --olive-dark: #1a1a1a;
    --red: #6b6b6b;
    --red-dark: #444444;
    --amber: #6b6b6b;
    --line: #d8d8d8;
    --mono: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: #ffffff;
    color: var(--ink);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  header h1 {
    margin: 0;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 0.3px;
    font-size: 20px;
  }
  header p { margin: 2px 0 0; color: #6b6b6b; font-size: 13px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .toolbar select, .toolbar input[type="search"] {
    font-family: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  .toolbar .counts { margin-left: auto; font-family: var(--mono); font-size: 12px; color: #565a44; }
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid var(--line);
  }
  body { padding-top: var(--topbar-h, 130px); }
  .view-toggle { display: flex; border: 1px solid var(--olive); }
  .view-toggle button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 14px;
    background: #fff;
    border: none;
    cursor: pointer;
    color: var(--olive-dark);
  }
  .view-toggle button.active { background: var(--olive); color: #fff; }

  main { padding: 20px 28px 60px; }

  .week-group { margin-bottom: 32px; }
  .week-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    color: #6a6f52;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 0;
  }

  /* Fixed day-column grid */
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    border-left: 1px solid var(--line);
  }
  .day-header {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--olive-dark);
    padding: 6px 8px;
    text-align: center;
    border-right: 1px solid #555;
    border-bottom: 1px solid var(--line);
  }
  .day-header.sunday { background: var(--red-dark); }
  .day-col {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-height: 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    background: var(--paper);
  }
  .day-col.empty { background: #f5f5f3; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--olive);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: box-shadow .15s ease;
  }
  .card:hover { box-shadow: 2px 2px 0 var(--line); }
  .card.sunday { border-left-color: var(--red); }
  .card .date { font-family: var(--mono); font-size: 11px; color: #565a44; }
  .card .day { font-weight: 700; font-size: 13px; line-height: 1.3; }
  .card .character { font-size: 12px; font-style: italic; color: #4b5320; }
  .card .format { font-family: var(--mono); font-size: 11px; color: var(--red-dark); }
  .card .snippet { font-size: 12.5px; line-height: 1.4; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .card .snippet.empty { color: #9a927a; font-style: italic; }
  .badge {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
    border: 1px solid;
  }
  .badge.draft { color: #8a8a8a; border-color: #8a8a8a; border-style: dashed; }
  .badge.notdesigned { color: #8a8a8a; border-color: #8a8a8a; border-style: dotted; }
  .badge.textapproved { color: #2a5db0; border-color: #2a5db0; }
  .badge.approved { color: var(--ink); border-color: var(--ink); }
  .badge.scheduled { color: #fff; background: #4a4a4a; border-color: #4a4a4a; }
  .badge.posted { color: #fff; background: var(--ink); border-color: var(--ink); }
  .badge.paused { color: var(--ink); border-color: var(--ink); text-decoration: line-through; }

  .list-view table { width: 100%; border-collapse: collapse; background: var(--panel); }
  .list-view th, .list-view td {
    border: 1px solid var(--line);
    padding: 10px 12px;
    text-align: left;
    font-size: 14.5px;
    line-height: 1.5;
    vertical-align: top;
  }
  .list-view th { background: var(--olive-dark); color: var(--paper); font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.5px; position: sticky; top: var(--topbar-h, 118px); }
  .list-view td.text-cell { max-width: 260px; }
  .list-view tr:hover { background: #efe9d8; }
  .row-btn { font-family: var(--mono); font-size: 11px; padding: 4px 8px; border: 1px solid var(--olive); background: #fff; cursor: pointer; }
  .row-btn:hover { background: var(--olive); color: #fff; }

  /* Editor drawer */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,23,15,0.55);
    z-index: 20;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .overlay.open { display: flex; }
  .drawer {
    background: var(--panel);
    width: min(420px, 92vw);
    height: 100%;
    padding: 22px;
    overflow-y: auto;
    border-left: 4px solid var(--red);
  }
  .drawer h2 { margin: 0 0 2px; font-size: 17px; }
  .drawer .sub { font-family: var(--mono); font-size: 12px; color: #6a6f52; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; color: #565a44; margin-bottom: 4px; }
  .field textarea, .field input, .field select {
    width: 100%; font-family: inherit; font-size: 14.5px;
    padding: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .drawer-actions { display: flex; gap: 8px; margin-top: 18px; }
  .btn { font-family: var(--mono); font-size: 12px; padding: 8px 14px; border: 1px solid var(--olive); background: var(--olive); color: #fff; cursor: pointer; }
  .btn.secondary { background: #fff; color: var(--olive-dark); }
  .btn.danger { border-color: var(--red-dark); background: var(--red-dark); }
  .save-status { font-family: var(--mono); font-size: 11px; margin-top: 8px; height: 14px; }

  .status-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .status-btn {
    font-family: var(--mono); font-size: 11px; padding: 6px 10px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  .status-btn:hover { border-color: var(--olive); }
  .status-btn.active { background: var(--olive); border-color: var(--olive); color: #fff; }
  .status-btn.active[data-value="approved"] { background: var(--ink); border-color: var(--ink); }
  .status-btn.active[data-value="text approved"] { background: #2a5db0; border-color: #2a5db0; }

  .loading, .error-state { padding: 40px 28px; font-family: var(--mono); font-size: 13px; color: #6a6f52; }
  .error-state { color: var(--red-dark); }

  .onscreen-preview { border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 10px; background: #fbfbf8; }
  .onscreen-preview.empty { font-style: italic; color: #9a927a; font-size: 12.5px; border-style: dashed; }
  .os-tag { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .5px; color: #6a6f52; margin-bottom: 2px; }
  .os-setup { opacity: .5; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .os-delivery { font-weight: 700; font-size: 15px; }
  .os-card-line { font-size: 12px; font-weight: 700; margin-top: -2px; }
  .os-card-line .os-setup-hint { font-weight: 400; color: #9a927a; font-size: 10px; }
  .os-card-line.empty { font-weight: 400; font-style: italic; color: #9a927a; }
.brief-part{white-space:pre-wrap;font-size:13px;line-height:1.45;padding:8px 10px;border:1px solid var(--line);background:#fafafa}
.panel-box{margin:10px 0;padding:10px 12px;border:1px solid var(--line);font-size:13px}
.panel-box.ok{background:#eef8ee;border-color:#9ccc9c}
.panel-box.bad{background:#fdeceb;border-color:#e0a9a4}
.panel-fails{white-space:pre-wrap;margin-top:6px;font-size:12px;line-height:1.4}
</style>
</head>
<body>

<div id="topbar">
<header>
  <div class="logo">SC</div>
  <div>
    <h1>Content Calendar</h1>
    <p>Plan content → pick a concept → text approved (start image) → image approved (video) → approved (scheduled)</p>
  </div>
</header>

<div class="toolbar">
  <div class="view-toggle">
    <button id="btnGrid" class="active">Calendar</button>
    <button id="btnList">List</button>
  </div>
  <select id="filterCharacter"><option value="">All characters</option></select>
  <select id="filterFormat"><option value="">All formats</option></select>
  <select id="filterStatus"><option value="">All statuses</option></select>
  <select id="filterPlatform"><option value="">All platforms</option></select>
  <input type="search" id="filterSearch" placeholder="search text...">
  <button class="btn" id="btnPlan">Plan content</button>
  <button class="btn secondary" id="btnAdhoc">Add a post</button>
  <div class="counts" id="counts"></div>
</div>
</div>

<main id="main">
  <div class="loading">Loading calendar…</div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<div class="overlay" id="planOverlay" style="justify-content:center;align-items:flex-start;overflow-y:auto">
  <div class="drawer" id="planPanel" style="width:min(760px,96vw);height:auto;margin:30px 0;border-left:4px solid var(--olive)"></div>
</div>

<script>
const LIST_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-list';
const UPDATE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-update';
const CONCEPT_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-concept-creator';
const PLAN_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-plan-content';
const OPTIONS_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-plan-options';

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// JS getDay(): 0=Sun,1=Mon,...,6=Sat. Map to our 0=Mon..6=Sun index:
function dayIndex(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return (d.getDay() + 6) % 7; // Mon=0 ... Sun=6
}

let ROWS = [];
let VIEW = 'grid';

const STATUS_CLASS = (s) => {
  if (!s) return 'draft';
  if (s.startsWith('draft - format')) return 'notdesigned';
  if (s.startsWith('draft')) return 'draft';
  if (s === 'text approved' || s === 'image ready' || s === 'image approved') return 'textapproved';
  if (s === 'approved') return 'approved';
  if (s === 'scheduled') return 'scheduled';
  if (s === 'posted') return 'posted';
  if (s === 'paused') return 'paused';
  return 'draft';
};
const STATUS_LABEL = (s) => {
  if (!s) return 'draft';
  if (s.startsWith('draft - format')) return 'not designed';
  return s;
};

function fmtDate(raw) {
  const d = new Date(raw);
  return d.toLocaleDateString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
function isoDate(raw) {
  const d = new Date(raw);
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}

async function loadRows() {
  try {
    const res = await fetch(LIST_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    ROWS = (Array.isArray(data) ? data : []).sort((a, b) => isoDate(a.post_date).localeCompare(isoDate(b.post_date)));
    populateFilters();
    render();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="error-state">Could not load the calendar (' + e.message + '). The n8n webhook may need a moment after publish, or check the workflow is active.</div>';
  }
}

function populateFilters() {
  const chars = [...new Set(ROWS.map(r => r.character))].sort();
  const formats = [...new Set(ROWS.map(r => r.format))].sort();
  const statuses = [...new Set(ROWS.map(r => r.status))].sort();
  const platforms = [...new Set(ROWS.flatMap(r => (r.platforms || '').split(',').map(p => p.trim()).filter(Boolean)))].sort();
  const fill = (id, values) => {
    const el = document.getElementById(id);
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      el.appendChild(opt);
    });
  };
  fill('filterCharacter', chars);
  fill('filterFormat', formats);
  fill('filterStatus', statuses);
  fill('filterPlatform', platforms);
}

function filteredRows() {
  const c = document.getElementById('filterCharacter').value;
  const f = document.getElementById('filterFormat').value;
  const s = document.getElementById('filterStatus').value;
  const p = document.getElementById('filterPlatform').value;
  const q = document.getElementById('filterSearch').value.trim().toLowerCase();
  return ROWS.filter(r =>
    ['cleared', 'ready', 'concepts', 'creating', 'failed'].indexOf(r.panel_status) !== -1 &&
    (!c || r.character === c) &&
    (!f || r.format === f) &&
    (!s || r.status === s) &&
    (!p || (r.platforms || '').split(',').map(x => x.trim()).includes(p)) &&
    (!q || (r.text_content || '').toLowerCase().includes(q))
  );
}

function render() {
  const rows = filteredRows();
  document.getElementById('counts').textContent = rows.length + ' / ' + ROWS.length + ' posts';
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (VIEW === 'grid') {
    // Group rows by week (Mon as week start)
    const weeks = {};
    rows.forEach(r => {
      const iso = isoDate(r.post_date);
      const d = new Date(iso + 'T00:00:00');
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - dayIndex(iso)); // back to Monday
      const sortKey = weekStart.toISOString().slice(0, 10);
      const label = weekStart.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      if (!weeks[sortKey]) weeks[sortKey] = { label, cols: Array.from({length:7}, ()=>[]) };
      weeks[sortKey].cols[dayIndex(iso)].push(r);
    });

    Object.keys(weeks).sort().forEach(sortKey => {
      const { label, cols } = weeks[sortKey];
      const group = document.createElement('div');
      group.className = 'week-group';

      const weekLabel = document.createElement('div');
      weekLabel.className = 'week-label';
      weekLabel.textContent = 'Week of ' + label;
      group.appendChild(weekLabel);

      const grid = document.createElement('div');
      grid.className = 'day-grid';

      // Header row
      DAYS.forEach((d, i) => {
        const h = document.createElement('div');
        h.className = 'day-header' + (i === 6 ? ' sunday' : '');
        h.textContent = d;
        grid.appendChild(h);
      });

      // Card columns
      cols.forEach((dayRows, i) => {
        const col = document.createElement('div');
        col.className = 'day-col' + (dayRows.length === 0 ? ' empty' : '');
        dayRows.forEach(r => col.appendChild(makeCard(r)));
        grid.appendChild(col);
      });

      group.appendChild(grid);
      main.appendChild(group);
    });

    if (!rows.length) main.innerHTML = '<div class="loading">No posts match these filters.</div>';
  } else {
    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Date</th><th>Day / Character</th><th>Format</th><th>Text</th><th>Platforms</th><th>Status</th><th></th></tr></thead>';
    const tbody = document.createElement('tbody');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + fmtDate(r.post_date) + '</td>' +
        '<td>' + r.day_of_week + '<br><em>' + r.character + '</em></td>' +
        '<td>' + r.format + '</td>' +
        '<td class="text-cell">' + (r.text_content ? escapeHtml(r.text_content) : '<span class="snippet empty">no text yet</span>') + '</td>' +
        '<td>' + (r.platforms || '') + '</td>' +
        '<td><span class="badge ' + STATUS_CLASS(r.status) + '">' + STATUS_LABEL(r.status) + '</span></td>' +
        '<td><button class="row-btn" data-id="' + r.id + '">Edit</button></td>';
      tr.querySelector('.row-btn').addEventListener('click', () => openDrawer(r));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    const wrap = document.createElement('div');
    wrap.className = 'list-view';
    wrap.appendChild(table);
    main.appendChild(wrap);
  }
}

function makeCard(r) {
  const card = document.createElement('div');
  card.className = 'card' + (r.character === 'SC Logo' ? ' sunday' : '');
  const os = extractOnScreen(r.notes);
  const osLine = os.hasText
    ? '<div class="os-card-line"><b>' + escapeHtml((os.deliveryText).replace(/\*/g, '').toUpperCase()) + '</b>' + (os.isSplit ? ' <span class="os-setup-hint">(+ setup)</span>' : '') + '</div>'
    : '<div class="os-card-line empty">no on-screen text</div>';
  card.innerHTML =
    '<div class="date">' + fmtDate(r.post_date) + '</div>' +
    '<div class="character">' + r.character + '</div>' +
    '<div class="format">' + r.format + '</div>' +
    osLine +
    '<div class="snippet' + (r.text_content ? '' : ' empty') + '">' + (r.text_content ? escapeHtml(r.text_content) : 'no caption yet') + '</div>' +
    '<span class="badge ' + STATUS_CLASS(r.status) + '">' + STATUS_LABEL(r.status) + '</span>' +
    (r.video_url ? '<span class="badge" style="border-color:#2a5db0;color:#2a5db0;">&#9654; video ready</span>' : '') +
    (r.panel_status === 'concepts' ? '<span class="badge" style="border-color:#b06a00;color:#b06a00;">pick a concept</span>' : '') +
    (r.status === 'image ready' ? '<span class="badge" style="border-color:#b06a00;color:#b06a00;">check start image</span>' : '') +
    (r.panel_status === 'creating' ? '<span class="badge" style="border-color:#777;color:#777;">writing brief...</span>' : '') +
    (r.panel_status === 'failed' ? '<span class="badge" style="border-color:#b00;color:#b00;">concepts failed</span>' : '') +
    (r.post_time ? '<span class="badge" style="border-color:#2a5db0;color:#2a5db0;">custom ' + escapeHtml(r.post_time) + '</span>' : '');
  card.addEventListener('click', () => openDrawer(r));
  return card;
}

function extractOnScreen(notes) {
  if (!notes) return { hasText: false };
  const m = notes.match(/On-screen:\s*([\s\S]+?)\s*(?:Sound:|Motion:|ID:|$)/i);
  const raw = m ? m[1].trim() : '';
  if (!raw) return { hasText: false };
  const flattened = raw.includes('/') ? raw.split('/').map(s => s.trim()).filter(Boolean).join(' ') : raw;
  const sentences = flattened.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
  const isSplit = sentences.length > 1;
  const setupText = isSplit ? sentences.slice(0, -1).join(' ') : '';
  const deliveryText = isSplit ? sentences[sentences.length - 1] : flattened;
  return { hasText: true, isSplit, setupText, deliveryText };
}

function renderOsWords(text) {
  return text.split(/\s+/).filter(Boolean).map(w => {
    const important = /^\*.+\*[^\w]*$/.test(w);
    const clean = w.replace(/\*/g, '').replace(/[.,!?;:'"]/g, '');
    const disp = escapeHtml(clean.toUpperCase());
    return important ? '<b>' + disp + '</b>' : disp;
  }).join(' ');
}

function onScreenPreviewHtml(notes) {
  const p = extractOnScreen(notes);
  if (!p.hasText) return '<div class="onscreen-preview empty">No On-screen: text found in Notes.</div>';
  if (p.isSplit) {
    return '<div class="onscreen-preview">' +
      '<span class="os-tag">SETUP — fades out around 1.9s</span>' +
      '<div class="os-setup">' + renderOsWords(p.setupText) + '</div>' +
      '<span class="os-tag">DELIVERY — holds to end of clip (5s)</span>' +
      '<div class="os-delivery">' + renderOsWords(p.deliveryText) + '</div>' +
    '</div>';
  }
  return '<div class="onscreen-preview">' +
    '<span class="os-tag">HOLDS TO END OF CLIP (5s) — no setup/delivery split</span>' +
    '<div class="os-delivery">' + renderOsWords(p.deliveryText) + '</div>' +
  '</div>';
}


function briefPart(notes, label) {
  if (!notes) return '';
  const LABELS = ['Appearance','Scene','End frame','On-screen','Sound','Motion','Source','ID','NFT'];
  const lower = notes.toLowerCase();
  const hits = [];
  LABELS.forEach(function(L) {
    const needle = (L + ':').toLowerCase();
    let from = 0;
    while (true) {
      const at = lower.indexOf(needle, from);
      if (at === -1) break;
      hits.push({ label: L, start: at, valueStart: at + needle.length });
      from = at + needle.length;
    }
  });
  hits.sort(function(a, b) { return a.start - b.start; });
  for (let i = 0; i < hits.length; i++) {
    if (hits[i].label.toLowerCase() === label.toLowerCase()) {

      return notes.slice(hits[i].valueStart, end).trim();

  }
  return '';
}

const CHARACTERS = ['Major Wood', "Hammerin' Hanky", 'The Grip', 'The Velvet Python', 'Slick Willy', 'The Rear Admiral'];

function leftFor(ch, f) { return (LEFT[ch] && LEFT[ch][f] != null) ? LEFT[ch][f] : null; }
const ROT_TYPES = ['Wisdom', 'Character Lore', 'Travel the World'];
function recentProductHandles() {
  const out = [];
  ROWS.forEach(r => { const m = String(r.notes || '').match(/products\/([a-z0-9-]+)/i) || String(r.notes || '').match(/SHOP:([a-z0-9-]+)/i); if (m) out.push(m[1]); });
  return out;
}
// Balanced defaults for empty slots only (Playbook 7.6): Mon-Sat spread Wisdom / Character Lore / Travel evenly,
// skipping any type with no lines left; Sunday = Brand Lore; Wed/Fri/Sat 12pm = a product, rotating product and character.
function planDefaults(start, n) {
  const left = JSON.parse(JSON.stringify(LEFT || {}));
  const used = recentProductHandles();
  const picks = {};
  let lastChar = '';
  for (let w = 0; w < n; w += 7) {
    const counts = { 'Wisdom': 0, 'Character Lore': 0, 'Travel the World': 0 };
    const days = [];
    for (let i = w; i < Math.min(n, w + 7); i++) { const d = new Date(start + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + i); days.push({ date: ymd(d), dow: d.getUTCDay(), i: i }); }
    days.forEach(x => { const r = existingRow(x.date, '7am'); if (r && !slotState(r).gap && counts[r.format] != null) counts[r.format]++; });
    days.forEach(x => {
      const ch = DAY_CHAR[x.dow];
      const r7 = existingRow(x.date, '7am');
      if (!r7 || slotState(r7).gap) {
        if (x.dow === 0) { picks[x.date + '|7am'] = (leftFor('SC Logo', 'Brand Lore') === 0) ? '' : 'Brand Lore'; }
        else {
          const cand = ROT_TYPES.filter(f => { const k = left[ch] && left[ch][f]; return k == null || k > 0; });
          cand.sort((p, q) => (counts[p] - counts[q]) || (((ROT_TYPES.indexOf(p) - x.i) % 3 + 3) % 3 - ((ROT_TYPES.indexOf(q) - x.i) % 3 + 3) % 3));
          const f = cand[0] || '';
          picks[x.date + '|7am'] = f;
          if (f) { counts[f]++; if (left[ch] && left[ch][f] != null) left[ch][f]--; }
        }
      }
      if ([3, 5, 6].indexOf(x.dow) !== -1) {
        const r12 = existingRow(x.date, '12pm');
        if (!r12 || slotState(r12).gap) {
          const pool = (PRODUCTS || []).slice();
          pool.sort((p, q) => ((used.indexOf(p.handle) !== -1) - (used.indexOf(q.handle) !== -1)) || (((p.character || DAY_CHAR[x.dow]) === lastChar) - ((q.character || DAY_CHAR[x.dow]) === lastChar)));
          const p = pool[0];
          if (p) { picks[x.date + '|12pm'] = p.handle; used.push(p.handle); lastChar = p.character || DAY_CHAR[x.dow]; }
        }
      }
    });
  }
  return picks;
}
function formatSelect(date, dow, row, pick) {
  const ch = DAY_CHAR[dow];

  let opts = '';
  if (!st.gap) opts += '<option value="" selected>Keep</option>';
  opts += types.map(f => { const n = leftFor(ch, f); return '<option value="' + f + '"' + (st.gap && f === pick ? ' selected' : '') + (n === 0 || st.done ? ' disabled' : '') + '>' + (st.gap ? '' : 'Replace with ') + f + (n === null ? '' : ' (' + n + ' left)') + '</option>'; }).join('');
  if (st.gap) opts += '<option value=""' + (pick ? '' : ' selected') + '>None</option>';
  return '<select data-date="' + date + '" class="plan7">' + opts + '</select>';
}
function drawPlanDays(useDefaults) {

  let html = '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th align="left">Day</th><th align="left">7am</th><th align="left">12pm product</th></tr>';
  for (let i = 0; i < n; i++) {
    const d = new Date(start + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + i);
    const date = ymd(d); const dow = d.getUTCDay();
    const e7 = existingRow(date, '7am');

      const st12 = slotState(e12);
      const pk = picks[date + '|12pm'] || '';

      prod = stateTag(e12) + '<br>' + (st12.gap
        ? '<select data-date="' + date + '" class="plan12">' + productOptions(pk) + '</select> <select data-date="' + date + '" class="plan12c">' + charOptions((pp && pp.character) || DAY_CHAR[dow]) + '</select>'
        : '<em>Keep</em>');

    html += '<tr style="border-top:1px solid var(--line);' + bg + '"><td>' + WEEKDAY[dow] + ' ' + date.slice(8) + '/' + date.slice(5, 7) + '<br><em>' + escapeHtml(DAY_CHAR[dow]) + '</em></td><td>' + main + '</td><td>' + prod + '</td></tr>';
  }

  let foot = '';
  if (DRAFTS) foot += '<div class="brief-part" style="margin-top:8px">' + DRAFTS + ' new lines are waiting for your approval in the Facts Master (set Status to APPROVED to use them).</div>';
  document.getElementById('planDaysBox').innerHTML = summary + html + foot;
  document.querySelectorAll('.plan12').forEach(sel => sel.addEventListener('change', () => {
    const p = (PRODUCTS || []).find(x => x.handle === sel.value);
    const c = document.querySelector('.plan12c[data-date="' + sel.dataset.date + '"]');
    if (p && p.character && c) c.value = p.character;
  }));
}
async function sendPlan(plan, statusEl) {
  if (!plan.length) { statusEl.textContent = 'Nothing selected.'; return; }
  statusEl.textContent = 'Sending...';
  try {
    const res = await fetch(PLAN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan: plan }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    statusEl.textContent = 'Started: ' + plan.length + ' post(s). Each brief takes about a minute; the calendar refreshes every 30 seconds.';
    startAutoRefresh();
  } catch (e) { statusEl.textContent = 'Failed: ' + e.message; }
}
function submitPlan() {
  const plan = [];
  document.querySelectorAll('.plan7').forEach(sel => { if (sel.value) plan.push({ date: sel.dataset.date, format: sel.value }); });
  document.querySelectorAll('.plan12').forEach(sel => {
    if (!sel.value) return;
    const p = (PRODUCTS || []).find(x => x.handle === sel.value) || {};
    const c = document.querySelector('.plan12c[data-date="' + sel.dataset.date + '"]');
    plan.push({ date: sel.dataset.date, format: 'Product', product_handle: sel.value, product_title: p.title || '', character: c ? c.value : '' });
  });
  sendPlan(plan, document.getElementById('planStatus'));
}
async function openAdhoc() {
  const panel = document.getElementById('planPanel');
  const t = new Date(); t.setUTCDate(t.getUTCDate() + 1);
  panel.innerHTML = '<h2>Add a post</h2><div class="sub">One extra post at a time you choose (London time). It gets one brief like any other post.</div>' +
    '<div class="field"><label>Date</label><input type="date" id="adDate" value="' + ymd(t) + '"></div>' +
    '<div class="field"><label>Time (London, 24h)</label><input type="time" id="adTime" value="18:00" step="900"></div>' +
    '<div class="field"><label>Post type</label><select id="adFormat"><option>Wisdom</option><option>Character Lore</option><option>Travel the World</option><option>Brand Lore</option><option>Product</option></select></div>' +
    '<div class="field" id="adProductBox" style="display:none"><label>Product</label><select id="adProduct"></select><label style="margin-top:8px">Character</label><select id="adChar">' + charOptions('Major Wood') + '</select></div>' +
    '<div class="field"><label>Character</label><div id="adCharInfo" class="brief-part"></div></div>' +
    '<div class="drawer-actions"><button class="btn" id="adGo">Create brief</button><button class="btn secondary" id="adClose">Close</button></div>' +
    '<div class="save-status" id="adStatus"></div>';
  document.getElementById('planOverlay').classList.add('open');
  document.getElementById('adClose').addEventListener('click', closePlan);
  await loadProducts();
  document.getElementById('adProduct').innerHTML = productOptions('');
  const refresh = () => {
    const f = document.getElementById('adFormat').value;
    const dow = new Date(document.getElementById('adDate').value + 'T12:00:00Z').getUTCDay();
    document.getElementById('adProductBox').style.display = f === 'Product' ? 'block' : 'none';
    const n = leftFor(DAY_CHAR[dow], f);
    const info = f === 'Product' ? 'Chosen below with the product.' : (f === 'Brand Lore' ? (dow === 0 ? 'SC Logo' + (n === null ? '' : ' - ' + n + ' lines left') : 'Brand Lore is Sunday only - pick a Sunday.') : (dow === 0 ? 'Sunday belongs to Brand Lore - pick another day.' : DAY_CHAR[dow] + ' (the day\'s character)' + (n === null ? '' : ' - ' + n + ' left')));
    document.getElementById('adCharInfo').textContent = info;
  };
  ['adFormat', 'adDate'].forEach(id => document.getElementById(id).addEventListener('change', refresh));
  document.getElementById('adProduct').addEventListener('change', () => {
    const p = (PRODUCTS || []).find(x => x.handle === document.getElementById('adProduct').value);
    if (p && p.character) document.getElementById('adChar').value = p.character;
  });
  refresh();
  document.getElementById('adGo').addEventListener('click', () => {
    const f = document.getElementById('adFormat').value;
    const item = { date: document.getElementById('adDate').value, time: document.getElementById('adTime').value, format: f };
    if (f === 'Product') {
      const h = document.getElementById('adProduct').value;
      const p = (PRODUCTS || []).find(x => x.handle === h) || {};
      item.product_handle = h; item.product_title = p.title || ''; item.character = document.getElementById('adChar').value;
    }
    sendPlan([item], document.getElementById('adStatus'));
  });
}
let AUTO = null;
function startAutoRefresh() {
  if (AUTO) clearInterval(AUTO);
  let n = 0;
  AUTO = setInterval(() => { n++; if (!document.getElementById('overlay').classList.contains('open')) loadRows(); if (n > 40) clearInterval(AUTO); }, 30000);
}
document.getElementById('btnPlan').addEventListener('click', openPlanner);
document.getElementById('btnAdhoc').addEventListener('click', openAdhoc);

loadRows();
</script>
