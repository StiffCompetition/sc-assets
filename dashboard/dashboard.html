<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stiff Competition — Content Calendar</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafafa;
    --panel: #ffffff;
    --olive: #3a3a3a;
    --olive-dark: #1a1a1a;
    --red: #6b6b6b;
    --red-dark: #444444;
    --amber: #6b6b6b;
    --line: #d8d8d8;
    --mono: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: #ffffff;
    color: var(--ink);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  header h1 {
    margin: 0;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 0.3px;
    font-size: 20px;
  }
  header p { margin: 2px 0 0; color: #6b6b6b; font-size: 13px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .toolbar select, .toolbar input[type="search"] {
    font-family: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  .toolbar .counts { margin-left: auto; font-family: var(--mono); font-size: 12px; color: #565a44; }
  .toolbar label.showposted { font-size: 13px; display: flex; align-items: center; gap: 5px; color: #444; }
  .tickfilter { position: relative; }
  .tickfilter > button { font-family: inherit; font-size: 14px; padding: 7px 9px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .tickfilter > button.set { border-color: var(--ink); font-weight: 600; }
  .tickpanel { display: none; position: absolute; top: 100%; left: 0; z-index: 20; background: #fff; border: 1px solid var(--ink); min-width: 180px; max-height: 260px; overflow-y: auto; padding: 6px; margin-top: 2px; }
  .tickpanel.open { display: block; }
  .tickpanel label { display: flex; align-items: center; gap: 6px; padding: 3px 2px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tickpanel .tickclear { font-size: 12px; color: #2a5db0; cursor: pointer; padding: 3px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid var(--line);
  }
  body { padding-top: var(--topbar-h, 130px); }
  .view-toggle { display: flex; border: 1px solid var(--olive); }
  .view-toggle button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 14px;
    background: #fff;
    border: none;
    cursor: pointer;
    color: var(--olive-dark);
  }
  .view-toggle button.active { background: var(--olive); color: #fff; }

  main { padding: 20px 28px 60px; }

  .week-group { margin-bottom: 32px; }
  .week-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    color: #6a6f52;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 0;
  }

  /* Fixed day-column grid */
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    border-left: 1px solid var(--line);
  }
  .day-header {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--olive-dark);
    padding: 6px 8px;
    text-align: center;
    border-right: 1px solid #555;
    border-bottom: 1px solid var(--line);
  }
  .day-header.sunday { background: var(--red-dark); }
  .day-col {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-height: 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    background: var(--paper);
  }
  .day-col.empty { background: #f5f5f3; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--olive);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: box-shadow .15s ease;
  }
  .card:hover { box-shadow: 2px 2px 0 var(--line); }
  .card.sunday { border-left-color: var(--red); }
  .card .date { font-family: var(--mono); font-size: 11px; color: #565a44; }
  .card .day { font-weight: 700; font-size: 13px; line-height: 1.3; }
  .card .character { font-size: 12px; font-style: italic; color: #4b5320; }
  .card .format { font-family: var(--mono); font-size: 11px; color: var(--red-dark); }
  .card .snippet { font-size: 12.5px; line-height: 1.4; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .card .snippet.empty { color: #9a927a; font-style: italic; }
  .badge {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
    border: 1px solid;
  }
  .badge.draft { color: #8a8a8a; border-color: #8a8a8a; border-style: dashed; }
  .badge.notdesigned { color: #8a8a8a; border-color: #8a8a8a; border-style: dotted; }
  .badge.textapproved { color: #2a5db0; border-color: #2a5db0; }
  .badge.approved { color: var(--ink); border-color: var(--ink); }
  .badge.scheduled { color: #fff; background: #4a4a4a; border-color: #4a4a4a; }
  .badge.posted { color: #fff; background: var(--ink); border-color: var(--ink); }
  .badge.paused { color: var(--ink); border-color: var(--ink); text-decoration: line-through; }

  .list-view table { width: 100%; border-collapse: collapse; background: var(--panel); }
  .list-view th, .list-view td {
    border: 1px solid var(--line);
    padding: 10px 12px;
    text-align: left;
    font-size: 14.5px;
    line-height: 1.5;
    vertical-align: top;
  }
  .list-view th { background: var(--olive-dark); color: var(--paper); font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.5px; position: sticky; top: var(--topbar-h, 118px); }
  .list-view td.text-cell { max-width: 260px; }
  .list-view tr:hover { background: #efe9d8; }
  .row-btn { font-family: var(--mono); font-size: 11px; padding: 4px 8px; border: 1px solid var(--olive); background: #fff; cursor: pointer; }
  .row-btn:hover { background: var(--olive); color: #fff; }

  /* Editor drawer */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,23,15,0.55);
    z-index: 20;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .overlay.open { display: flex; }
  .drawer {
    background: var(--panel);
    width: min(420px, 92vw);
    height: 100%;
    padding: 22px;
    overflow-y: auto;
    border-left: 4px solid var(--red);
  }
  .drawer.full { width: 100vw; max-width: 100vw; border-left: none; padding: 0 max(22px, calc((100vw - 920px) / 2)) 40px; }
  .drawer.full .field textarea { min-height: 150px; font-size: 16px; line-height: 1.45; padding: 12px; }
  .drawer.full .field label { font-size: 12.5px; }
  .drawer.full h2 { font-size: 22px; }
  .brief-topbar { position: sticky; top: 0; z-index: 2; background: var(--panel); display: flex; justify-content: space-between; align-items: center; padding: 12px 0; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
  .drawer h2 { margin: 0 0 2px; font-size: 17px; }
  .drawer .sub { font-family: var(--mono); font-size: 12px; color: #6a6f52; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; color: #565a44; margin-bottom: 4px; }
  .field textarea, .field input, .field select {
    width: 100%; font-family: inherit; font-size: 14.5px;
    padding: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  .drawer-actions { display: flex; gap: 8px; margin-top: 18px; }
  .btn { font-family: var(--mono); font-size: 12px; padding: 8px 14px; border: 1px solid var(--olive); background: var(--olive); color: #fff; cursor: pointer; }
  .btn.secondary { background: #fff; color: var(--olive-dark); }
  .btn.danger { border-color: var(--red-dark); background: var(--red-dark); }
  .save-status { font-family: var(--mono); font-size: 11px; margin-top: 8px; height: 14px; }

  .status-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .status-btn {
    font-family: var(--mono); font-size: 11px; padding: 6px 10px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  .status-btn:hover { border-color: var(--olive); }
  .status-btn.active { background: var(--olive); border-color: var(--olive); color: #fff; }
  .status-btn.active[data-value="approved"] { background: var(--ink); border-color: var(--ink); }
  .status-btn.active[data-value="text approved"] { background: #2a5db0; border-color: #2a5db0; }

  .loading, .error-state { padding: 40px 28px; font-family: var(--mono); font-size: 13px; color: #6a6f52; }
  .error-state { color: var(--red-dark); }

  .onscreen-preview { border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 10px; background: #fbfbf8; }
  .onscreen-preview.empty { font-style: italic; color: #9a927a; font-size: 12.5px; border-style: dashed; }
  .os-tag { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .5px; color: #6a6f52; margin-bottom: 2px; }
  .os-setup { opacity: .5; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .os-delivery { font-weight: 700; font-size: 15px; }
  .os-card-line { font-size: 12px; font-weight: 700; margin-top: -2px; }
  .os-card-line .os-setup-hint { font-weight: 400; color: #9a927a; font-size: 10px; }
  .os-card-line.empty { font-weight: 400; font-style: italic; color: #9a927a; }
.brief-part{white-space:pre-wrap;font-size:13px;line-height:1.45;padding:8px 10px;border:1px solid var(--line);background:#fafafa}
.panel-box{margin:10px 0;padding:10px 12px;border:1px solid var(--line);font-size:13px}
.panel-box.ok{background:#eef8ee;border-color:#9ccc9c}
.panel-box.bad{background:#fdeceb;border-color:#e0a9a4}
.panel-fails{white-space:pre-wrap;margin-top:6px;font-size:12px;line-height:1.4}

/* Phone layout (added 3 Oct 2026). Applies only below 760px wide; desktop is unchanged. */
@media (max-width: 760px) {
  body { padding-top: 0 !important; }
  #topbar { position: static; }
  header { padding: 12px 14px; gap: 10px; }
  header h1 { font-size: 18px; }
  header p { font-size: 12px; }
  .toolbar { padding: 10px 14px; gap: 8px; }
  .toolbar .counts { margin-left: 0; width: 100%; }
  .toolbar input[type="search"] { flex: 1 1 100%; }
  .toolbar select, .toolbar input[type="search"], .tickfilter > button, .view-toggle button, .btn, .row-btn, .status-btn, .toolbar label.showposted { min-height: 44px; }
  .tickpanel { max-width: calc(100vw - 28px); }
  main { padding: 14px 14px 48px; }
  /* Calendar: one day per row (header, then that day's posts) */
  .day-grid { grid-template-columns: 1fr; border-left: none; }
  .day-header { text-align: left; padding: 8px 10px; border-right: none; }
  .day-col { min-height: 0; }
 .day-grid > :nth-child(1) { order: 1; } .day-grid > :nth-child(8) { order: 2; }
 .day-grid > :nth-child(2) { order: 3; } .day-grid > :nth-child(9) { order: 4; }
 .day-grid > :nth-child(3) { order: 5; } .day-grid > :nth-child(10) { order: 6; }
 .day-grid > :nth-child(4) { order: 7; } .day-grid > :nth-child(11) { order: 8; }
 .day-grid > :nth-child(5) { order: 9; } .day-grid > :nth-child(12) { order: 10; }
 .day-grid > :nth-child(6) { order: 11; } .day-grid > :nth-child(13) { order: 12; }
 .day-grid > :nth-child(7) { order: 13; } .day-grid > :nth-child(14) { order: 14; }
  /* List: each post is a stacked card instead of a 7-column table */
  .list-view table, .list-view tbody, .list-view tr, .list-view td { display: block; width: 100%; }
  .list-view thead { display: none; }
  .list-view tr { border: 1px solid var(--line); background: var(--panel); margin-bottom: 12px; padding: 6px 0; }
  .list-view td { border: none; padding: 4px 12px; }
  .list-view td.text-cell { max-width: none; }
  .list-view td::before { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.5px; color: #565a44; }
  .list-view td:nth-child(1)::before { content: "Date"; }
  .list-view td:nth-child(2)::before { content: "Day / Character"; }
  .list-view td:nth-child(3)::before { content: "Format"; }
  .list-view td:nth-child(4)::before { content: "Text"; }
  .list-view td:nth-child(5)::before { content: "Platforms"; }
  .list-view td:nth-child(6)::before { content: "Status"; }
  .list-view .row-btn { width: 100%; }
  /* Editor */
  .drawer.full { padding-left: 14px !important; padding-right: 14px !important; }
  .brief-topbar { flex-wrap: wrap; gap: 8px; }
  .drawer-actions { flex-wrap: wrap; }
  .drawer-actions .btn { flex: 1 1 140px; }
  .drawer.full .field textarea, .field input, .field select { font-size: 16px; }
}
</style>
</head>
<body>

<div id="topbar">
<header>
  <div class="logo">SC</div>
  <div>
    <h1>Content Calendar</h1>
    <p>Plan content → brief ready → text approved (start image) → image approved (video) → approved (scheduled)</p>
  </div>
</header>

<div class="toolbar">
  <div class="view-toggle">
    <button id="btnGrid" class="active">Calendar</button>
    <button id="btnList">List</button>
  </div>
  <div class="tickfilter" id="tf_character"><button type="button">Characters</button><div class="tickpanel"></div></div>
  <div class="tickfilter" id="tf_format"><button type="button">Formats</button><div class="tickpanel"></div></div>
  <div class="tickfilter" id="tf_status"><button type="button">Statuses</button><div class="tickpanel"></div></div>
  <div class="tickfilter" id="tf_platform"><button type="button">Platforms</button><div class="tickpanel"></div></div>
  <input type="search" id="filterSearch" placeholder="search text...">
  <label class="showposted"><input type="checkbox" id="showPostedRejected"> Show posted/rejected</label>
  <button class="btn" id="btnPlan">Plan content</button>
  <button class="btn secondary" id="btnAdhoc">Add a post</button>
  <button class="btn secondary" id="btnPress">Press coverage</button>
  <div class="counts" id="counts"></div>
</div>
</div>

<main id="main">
  <div class="loading">Loading calendar…</div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<div class="overlay" id="planOverlay" style="justify-content:center;align-items:stretch">
  <div class="drawer full" id="planPanel" style="padding:0 max(22px, calc((100vw - 1200px) / 2)) 40px"></div>
</div>

<script>
const LIST_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-list';
const UPDATE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-update';
const DELETE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-delete';
const CONCEPT_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-concept-creator';
const PLAN_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-plan-content';
const OPTIONS_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-plan-options';
const PRODUCTBOX_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-productbox';
const COVERAGE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-coverage-list';
const PREVIEW_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-text-preview';

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// JS getDay(): 0=Sun,1=Mon,...,6=Sat. Map to our 0=Mon..6=Sun index:
function dayIndex(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return (d.getDay() + 6) % 7; // Mon=0 ... Sun=6
}

let ROWS = [];
let PRESS_ITEMS = [];
let VIEW = 'grid';
const FILTERS = { character: new Set(), format: new Set(), status: new Set(), platform: new Set() };

function decodeEntities(s) {
  if (!s) return s;
  const t = document.createElement('textarea');
  t.innerHTML = s;
  return t.value;
}

const STATUS_CLASS = (s) => {
  if (!s) return 'draft';
  if (s.startsWith('draft - format')) return 'notdesigned';
  if (s.startsWith('draft')) return 'draft';
  if (s === 'text approved' || s === 'image ready' || s === 'image approved') return 'textapproved';
  if (s === 'approved') return 'scheduled';
  if (s === 'scheduled') return 'scheduled';
  if (s === 'posted') return 'posted';
  if (s === 'paused') return 'paused';
  return 'draft';
};
const STATUS_LABEL = (s) => {
  if (!s) return 'draft';
  if (s.startsWith('draft - format')) return 'not designed';
  if (s === 'approved') return 'scheduled';   // "approved" IS the scheduled-to-post state (Plan → ... → approved (scheduled))
  return s;
};

function fmtDate(raw) {
  const d = new Date(raw);
  return d.toLocaleDateString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
function isoDate(raw) {
  const d = new Date(raw);
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}

async function loadRows() {
  try {
    const res = await fetch(LIST_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    ROWS = (Array.isArray(data) ? data : []).sort((a, b) => isoDate(a.post_date).localeCompare(isoDate(b.post_date)));
    try {
      const pr = await fetch(COVERAGE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(x => x.json());
      PRESS_ITEMS = [];
      ((pr && pr.rows) || []).forEach(row => (row.channels || []).forEach(c => PRESS_ITEMS.push({ _press: true, id: 'press-' + row.record_id + '-' + c.name, post_date: c.date, channel: c.name, state: c.state, headline: row.headline, outlet: row.outlet, url: row.url })));
    } catch (e) { PRESS_ITEMS = []; }
    populateFilters();
    render();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="error-state">Could not load the calendar (' + e.message + '). The n8n webhook may need a moment after publish, or check the workflow is active.</div>';
  }
}

function buildTickPanel(key, values) {
  const wrap = document.getElementById('tf_' + key);
  const btn = wrap.querySelector('button');
  const panel = wrap.querySelector('.tickpanel');
  panel.innerHTML = values.map(v =>
    '<label><input type="checkbox" value="' + escapeHtml(String(v)) + '"' + (FILTERS[key].has(v) ? ' checked' : '') + '> ' + escapeHtml(String(v)) + '</label>'
  ).join('') + '<div class="tickclear">Clear</div>';
  panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    if (cb.checked) FILTERS[key].add(cb.value); else FILTERS[key].delete(cb.value);
    updateTickButton(key);
    render();
  }));
  panel.querySelector('.tickclear').addEventListener('click', () => {
    FILTERS[key].clear();
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    updateTickButton(key);
    render();
  });
  if (!btn.dataset.wired) {
    btn.dataset.wired = '1';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.tickpanel.open').forEach(p => { if (p !== panel) p.classList.remove('open'); });
      panel.classList.toggle('open');
    });
  }
  updateTickButton(key);
}
function updateTickButton(key) {
  const wrap = document.getElementById('tf_' + key);
  const btn = wrap.querySelector('button');
  const n = FILTERS[key].size;
  const label = { character: 'Characters', format: 'Formats', status: 'Statuses', platform: 'Platforms' }[key];
  btn.textContent = n ? label + ' (' + n + ')' : label;
  btn.classList.toggle('set', n > 0);
}
document.addEventListener('click', () => document.querySelectorAll('.tickpanel.open').forEach(p => p.classList.remove('open')));

function populateFilters() {
  const chars = [...new Set(ROWS.map(r => r.character))].sort();
  const formats = [...new Set(ROWS.map(r => r.format))].sort();
  if (PRESS_ITEMS.length) formats.push('Press');
  const statuses = STATE_NAMES;
  const platforms = [...new Set(ROWS.flatMap(r => (r.platforms || '').split(',').map(p => p.trim()).filter(Boolean)))].sort();
  buildTickPanel('character', chars);
  buildTickPanel('format', formats);
  buildTickPanel('status', statuses);
  buildTickPanel('platform', platforms);
}

function filteredRows() {
  const showPR = document.getElementById('showPostedRejected').checked;
  const q = document.getElementById('filterSearch').value.trim().toLowerCase();
  return ROWS.filter(r =>
    (['cleared', 'ready', 'concepts', 'creating', 'failed'].indexOf(r.panel_status) !== -1 || (showPR && r.panel_status === 'rejected')) &&
    (showPR || r.status !== 'posted') &&
    (!FILTERS.character.size || FILTERS.character.has(r.character)) &&
    (!FILTERS.format.size || FILTERS.format.has(r.format)) &&
    (!FILTERS.status.size || FILTERS.status.has(stateName(r))) &&
    (!FILTERS.platform.size || (r.platforms || '').split(',').map(x => x.trim()).some(p => FILTERS.platform.has(p))) &&

function render() {
  const rows = filteredRows();
  document.getElementById('counts').textContent = rows.length + ' / ' + ROWS.length + ' posts';
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (VIEW === 'grid') {
    // Group rows by week (Mon as week start)
    const weeks = {};
    rows.concat(pressCards()).forEach(r => {
      const iso = isoDate(r.post_date);
      const d = new Date(iso + 'T00:00:00');
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - dayIndex(iso)); // back to Monday
      const sortKey = weekStart.toISOString().slice(0, 10);
      const label = weekStart.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      if (!weeks[sortKey]) weeks[sortKey] = { label, cols: Array.from({length:7}, ()=>[]) };
      weeks[sortKey].cols[dayIndex(iso)].push(r);
    });

    Object.keys(weeks).sort().forEach(sortKey => {
      const { label, cols } = weeks[sortKey];
      const group = document.createElement('div');
      group.className = 'week-group';

      const weekLabel = document.createElement('div');
      weekLabel.className = 'week-label';
      weekLabel.textContent = 'Week of ' + label;
      group.appendChild(weekLabel);

      const grid = document.createElement('div');
      grid.className = 'day-grid';

      // Header row
      DAYS.forEach((d, i) => {
        const h = document.createElement('div');
        h.className = 'day-header' + (i === 6 ? ' sunday' : '');
        h.textContent = d;
        grid.appendChild(h);
      });

      // Card columns
      cols.forEach((dayRows, i) => {
        const col = document.createElement('div');
        col.className = 'day-col' + (dayRows.length === 0 ? ' empty' : '');
        dayRows.forEach(r => col.appendChild(r._press ? makePressCard(r) : makeCard(r)));
        grid.appendChild(col);
      });

      group.appendChild(grid);
      main.appendChild(group);
    });

    if (!rows.length && !pressCards().length) main.innerHTML = '<div class="loading">No posts match these filters.</div>';
  } else {
    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Date</th><th>Day / Character</th><th>Format</th><th>Text</th><th>Platforms</th><th>Status</th><th></th></tr></thead>';
    const tbody = document.createElement('tbody');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + fmtDate(r.post_date) + '</td>' +
        '<td>' + r.day_of_week + '<br><em>' + r.character + '</em></td>' +
        '<td>' + r.format + '</td>' +
        '<td class="text-cell">' + (r.text_content ? escapeHtml(r.text_content) : '<span class="snippet empty">no text yet</span>') + '</td>' +
        '<td>' + (r.platforms || '') + '</td>' +
        '<td><span class="badge ' + STATUS_CLASS(r.status) + '">' + STATUS_LABEL(r.status) + '</span></td>' +
        '<td><button class="row-btn" data-id="' + r.id + '">Edit</button></td>';
      tr.querySelector('.row-btn').addEventListener('click', () => openDrawer(r));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    const wrap = document.createElement('div');
    wrap.className = 'list-view';
    wrap.appendChild(table);
    main.appendChild(wrap);
  }
}

function extractOnScreen(notes) {
  if (!notes) return { hasText: false };
  const m = notes.match(/On-screen:\s*([\s\S]+?)\s*(?:Sound:|Motion:|ID:|$)/i);
  const raw = m ? m[1].trim() : '';
  if (!raw) return { hasText: false };
  // Same split rule as the video step (Build Text Elements): a slash separates the text; without a slash, sentence ends do.
  const hasSlash = raw.includes('/');
  const flattened = hasSlash ? raw.split('/').map(s => s.trim()).filter(Boolean).join(' ') : raw;
  const sentences = hasSlash ? raw.split('/').map(s => s.trim()).filter(Boolean) : flattened.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
  const isSplit = sentences.length > 1;
  const setupText = isSplit ? sentences.slice(0, -1).join(' ') : '';
  const deliveryText = isSplit ? sentences[sentences.length - 1] : flattened;
  const words = t => t.split(/\s+/).filter(Boolean).length;
  // 8 words or fewer with a slash: two stacked blocks (title on top, message below), both held to the end of the clip.
  const stacked = hasSlash && isSplit && (words(setupText) + words(deliveryText)) <= 8;
  return { hasText: true, isSplit, stacked, setupText, deliveryText };
}

function renderOsWords(text) {
  return text.split(/\s+/).filter(Boolean).map(w => {
    const important = /^\*.+\*[^\w]*$/.test(w);
    const clean = w.replace(/\*/g, '').replace(/[.,;:"]/g, '');
    const disp = escapeHtml(clean.toUpperCase());
    return important ? '<b>' + disp + '</b>' : disp;
  }).join(' ');
}

function onScreenPreviewHtml(notes) {
  const p = extractOnScreen(notes);
  if (!p.hasText) return '<div class="onscreen-preview empty">No On-screen: text found in Notes.</div>';
  if (p.stacked) {
    return '<div class="onscreen-preview">' +
      '<span class="os-tag">TITLE (top) — holds to end of clip (5s)</span>' +
      '<div class="os-delivery" style="margin-bottom:8px">' + renderOsWords(p.setupText) + '</div>' +
      '<span class="os-tag">MESSAGE (below the title) — holds to end of clip (5s)</span>' +
      '<div class="os-delivery">' + renderOsWords(p.deliveryText) + '</div>' +
    '</div>';
  }
  if (p.isSplit) {
    return '<div class="onscreen-preview">' +
      '<span class="os-tag">SETUP — fades out around 1.9s</span>' +
      '<div class="os-setup">' + renderOsWords(p.setupText) + '</div>' +
      '<span class="os-tag">DELIVERY — holds to end of clip (5s)</span>' +
      '<div class="os-delivery">' + renderOsWords(p.deliveryText) + '</div>' +
    '</div>';
  }
  return '<div class="onscreen-preview">' +
    '<span class="os-tag">HOLDS TO END OF CLIP (5s) — no setup/delivery split</span>' +
    '<div class="os-delivery">' + renderOsWords(p.deliveryText) + '</div>' +
  '</div>';
}

function briefPart(notes, label) {
  if (!notes) return '';
  const LABELS = ['Appearance','Scene','End frame','End','On-screen','Sound','Motion','Source','Plan','ID','NFT'];
  const lower = notes.toLowerCase();
  const hits = [];
  LABELS.forEach(function(L) {
    const needle = (L + ':').toLowerCase();
    let from = 0;
    while (true) {
      const at = lower.indexOf(needle, from);
      if (at === -1) break;
      if (!(L === 'NFT' && /source:\s*$/.test(lower.slice(Math.max(0, at - 12), at)))) hits.push({ label: L, start: at, valueStart: at + needle.length });
      from = at + needle.length;
    }
  });
  hits.sort(function(a, b) { return a.start - b.start; });
  for (let i = 0; i < hits.length; i++) {
    if (hits[i].label.toLowerCase() === label.toLowerCase()) {
      const end = (i + 1 < hits.length) ? hits[i + 1].start : notes.length;
      return notes.slice(hits[i].valueStart, end).trim();
    }
  }
  return '';
}

function briefField(notes, label, display) {
  const v = briefPart(notes, label);
  if (!v) return '';
  return '<div class="field"><label>' + display + '</label><div class="brief-part">' + escapeHtml(v) + '</div></div>';
}

function briefEdit(notes, key, label, id) {
  const v = briefPart(notes, key);
  return '<div class="field"><label>' + label + '</label><textarea id="b_' + id + '">' + escapeHtml(v || '') + '</textarea></div>';
}
function composeNotes(orig) {
  const g = id => { const el = document.getElementById('b_' + id); return el ? el.value.trim() : null; };
  if (g('scene') === null) return orig;
  const idPart = briefPart(orig, 'ID');
  const sound = (g('sound') || '').replace(/[.]+$/, '');
  let src = briefPart(orig, 'Source');
  // Shot plan (Playbook 7.33): written by the concept step; kept unchanged on save.
  const plan = briefPart(orig, 'Plan');
  // Rows from the spreadsheet carry Payoff (the sound the pipeline makes) inside the Source part: an edited Sound replaces it.
  if (src && /Payoff:/i.test(src) && sound) src = src.replace(/Payoff:\s*[\s\S]*$/i, 'Payoff: ' + sound + '.');
  return 'Scene: ' + g('scene') + ' On-screen: ' + g('onscreen') + ' Sound: ' + sound + '. Motion: ' + g('motion') +
    (idPart ? ' ID: ' + idPart.replace(/[.]+$/, '') + '.' : '') + (src ? ' Source: ' + src : '') + (plan ? ' Plan: ' + plan : '');
}
// Shot plan (Playbook 7.33): the Shot Library picks for this post - Camera is the shot-1 camera move, Entrance and Ending (framing) are shot 2.
function shotPlanBox(notes) {
  const plan = briefPart(notes, 'Plan');

}

function panelBox(r) {

async function pickConcept(r, n) {
  const c = conceptData(r); if (!c) return;
  const o = (c.options || []).find(x => x.n === n); if (!o) return;
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Saving concept ' + n + '...';
  const payload = { id: r.id, notes: o.notes, text_content: o.text_content, caption_instagram: o.caption_instagram,
    caption_x: o.caption_x, caption_facebook: o.caption_facebook, panel_status: 'ready', panel_notes: 'Concept ' + n + ' picked: ' + o.concept };
  try {
    const res = await fetch(UPDATE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const row = ROWS.find(x => x.id === r.id); if (row) Object.assign(row, payload);
    statusEl.textContent = 'Concept ' + n + ' saved. Review the brief, then set "text approved" to render.';
    render(); setTimeout(() => openDrawer(row || r), 400);
  } catch (e) { statusEl.textContent = 'Failed: ' + e.message; }
}

async function newConcepts(r) {
  const statusEl = document.getElementById('saveStatus');

    statusEl.textContent = 'Done - reloading.'; setTimeout(() => location.reload(), 800);

}

function escapeHtml(s) {
  s = decodeEntities(s);
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function londonYmd(v) { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(v)); }

          cand.sort((p, q) => (counts[p] - counts[q]) || (((ROT_TYPES.indexOf(p) - x.i) % 3 + 3) % 3 - ((ROT_TYPES.indexOf(q) - x.i) % 3 + 3) % 3));
          const f = cand[0] || '';
          picks[x.date + '|7am'] = f;
          if (f) { counts[f]++; if (left[ch] && left[ch][f] != null) left[ch][f]--; }
        }
      }
      if ([3, 5, 6].indexOf(x.dow) !== -1) {
        const r12 = existingRow(x.date, '12pm');
        if (!r12 || slotState(r12).gap) {
          const pool = (PRODUCTS || []).slice();
          pool.sort((p, q) => ((used.indexOf(p.handle) !== -1) - (used.indexOf(q.handle) !== -1)) || (((p.character || DAY_CHAR[x.dow]) === lastChar) - ((q.character || DAY_CHAR[x.dow]) === lastChar)));
          const p = pool[0];
          if (p) { picks[x.date + '|12pm'] = p.handle; used.push(p.handle); lastChar = p.character || DAY_CHAR[x.dow]; }
        }
      }
    });
  }
  return picks;
}
function formatSelect(date, dow, row, pick) {
  const ch = DAY_CHAR[dow];
  const st = slotState(row);
  const types = dow === 0 ? ['Brand Lore'] : ROT_TYPES;
  let opts = '';
  if (!st.gap) opts += '<option value="" selected>Keep</option>';
  opts += types.map(f => { const n = leftFor(ch, f); return '<option value="' + f + '"' + (st.gap && f === pick ? ' selected' : '') + (n === 0 || st.done ? ' disabled' : '') + '>' + (st.gap ? '' : 'Replace with ') + f + (n === null ? '' : ' (' + n + ' left)') + '</option>'; }).join('');
  if (st.gap) opts += '<option value=""' + (pick ? '' : ' selected') + '>None</option>';
  return '<select data-date="' + date + '" class="plan7">' + opts + '</select>';
}
// Extra posts (Playbook 7.6): any number per day, each at its own London time; published by the custom-time schedule.
function extraCell(date, dow) {
  const have = ROWS.filter(r => londonYmd(r.post_date) === date && r.post_time).sort((a, b) => String(a.post_time).localeCompare(String(b.post_time)));
  const list = have.map(r => '<div>' + escapeHtml(r.post_time) + ' ' + stateTag(r) + '</div>').join('');
  return list + '<div class="extra-box" data-date="' + date + '" data-dow="' + dow + '"></div><button type="button" class="btn secondary extra-add" data-date="' + date + '" data-dow="' + dow + '" style="padding:2px 10px;font-size:12px;margin-top:4px">+ Add post</button>';
}
function extraTypes(dow) {
  const t = ['Day Greeting', 'Wisdom', 'Character Lore', 'Travel the World', 'Product'];
  if (dow === 0) return ['Day Greeting', 'Brand Lore', 'Product'];
  return t;
}
function addExtraLine(box) {
  const dow = Number(box.dataset.dow);
  const ch = DAY_CHAR[dow];
  const line = document.createElement('div');
  line.className = 'extra-line';
  line.style.cssText = 'margin-top:4px;padding:4px;border:1px solid var(--line);border-radius:6px';
  line.innerHTML = '<input type="time" class="ex-time" value="18:00" step="900" style="width:95px"> ' +
    '<select class="ex-format">' + extraTypes(dow).map(f => { const n = leftFor(f === 'Brand Lore' || dow === 0 ? 'SC Logo' : ch, f); return '<option value="' + f + '"' + (n === 0 ? ' disabled' : '') + '>' + f + (n === null || f === 'Product' ? '' : ' (' + n + ')') + '</option>'; }).join('') + '</select> ' +
    '<span class="ex-prod" style="display:none"><select class="ex-product">' + productOptions('') + '</select> <select class="ex-char">' + charOptions('') + '</select></span> ' +
    '<button type="button" class="btn secondary ex-remove" style="padding:0 8px;font-size:12px">x</button>';
  box.appendChild(line);
  const fmt = line.querySelector('.ex-format');
  fmt.addEventListener('change', () => { line.querySelector('.ex-prod').style.display = fmt.value === 'Product' ? 'inline' : 'none'; });
  line.querySelector('.ex-product').addEventListener('change', (e) => { const p = (PRODUCTS || []).find(x => x.handle === e.target.value); line.querySelector('.ex-char').value = (p && p.character) ? p.character : ''; });
  line.querySelector('.ex-remove').addEventListener('click', () => line.remove());
}
function drawPlanDays(useDefaults) {
  const start = document.getElementById('planStart').value;
  const n = Number(document.getElementById('planDays').value);
  if (!start) return;
  const picks = useDefaults === false ? {} : planDefaults(start, n);
  let slots = 0, gaps = 0; const gapList = [];
  let html = '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th align="left">Day</th><th align="left">6am greeting</th><th align="left">7am</th><th align="left">12pm product</th><th align="left">Extra posts</th></tr>';
  for (let i = 0; i < n; i++) {
    const d = new Date(start + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + i);
    const date = ymd(d); const dow = d.getUTCDay();
    const e6 = existingRow(date, '6am');
    slots++; if (slotState(e6).gap) { gaps++; gapList.push(WEEKDAY[dow] + ' 6am'); }
    const n6 = leftFor(DAY_CHAR[dow], 'Day Greeting');
    const greet = stateTag(e6) + '<br>' + (slotState(e6).gap
      ? '<select data-date="' + date + '" class="plan6"><option value="Day Greeting"' + (picks[date + '|6am'] ? ' selected' : '') + (n6 === 0 ? ' disabled' : '') + '>Day Greeting' + (n6 === null ? '' : ' (' + n6 + ')') + '</option><option value=""' + (picks[date + '|6am'] ? '' : ' selected') + '>None</option></select>'
      : '<em>Keep</em>');
    const e7 = existingRow(date, '7am');
    slots++; if (slotState(e7).gap) { gaps++; gapList.push(WEEKDAY[dow] + ' 7am'); }
    const main = stateTag(e7) + '<br>' + formatSelect(date, dow, e7, picks[date + '|7am']);
    let prod = '';
    if ([3, 5, 6].indexOf(dow) !== -1) {
      const e12 = existingRow(date, '12pm');
      slots++; if (slotState(e12).gap) { gaps++; gapList.push(WEEKDAY[dow] + ' 12pm'); }
      const st12 = slotState(e12);
      const pk = picks[date + '|12pm'] || '';
      const pp = (PRODUCTS || []).find(x => x.handle === pk);
      prod = stateTag(e12) + '<br>' + (st12.gap
        ? '<select data-date="' + date + '" class="plan12">' + productOptions(pk) + '</select> <select data-date="' + date + '" class="plan12c">' + charOptions((pp && pp.character) || '') + '</select>'
        : '<em>Keep</em>');
    }
    const bg = (slotState(e6).gap || slotState(e7).gap || ([3, 5, 6].indexOf(dow) !== -1 && slotState(existingRow(date, '12pm')).gap)) ? 'background:rgba(176,106,0,0.07);' : '';
    html += '<tr style="border-top:1px solid var(--line);' + bg + '"><td>' + WEEKDAY[dow] + ' ' + date.slice(8) + '/' + date.slice(5, 7) + '<br><em>' + escapeHtml(DAY_CHAR[dow]) + '</em></td><td>' + greet + '</td><td>' + main + '</td><td>' + prod + '</td><td>' + extraCell(date, dow) + '</td></tr>';
  }
  html += '</table>';
  const summary = '<div class="brief-part" style="margin-bottom:8px"><b>' + (slots - gaps) + ' of ' + slots + ' slots filled.</b> ' + (gaps ? 'Empty: ' + gapList.join(', ') + '. Empty slots are pre-filled with a balanced mix below - change anything, then Create.' : 'Nothing missing.') + '</div>';
  let foot = '';
  if (DRAFTS) foot += '<div class="brief-part" style="margin-top:8px">' + DRAFTS + ' rows in the content spreadsheet are not yet approved (set status to approved to use them).</div>';
  document.getElementById('planDaysBox').innerHTML = summary + html + foot;
  document.querySelectorAll('.extra-add').forEach(b => b.addEventListener('click', () => addExtraLine(document.querySelector('.extra-box[data-date="' + b.dataset.date + '"]'))));
  document.querySelectorAll('.plan12').forEach(sel => sel.addEventListener('change', () => {
    const p = (PRODUCTS || []).find(x => x.handle === sel.value);
    const c = document.querySelector('.plan12c[data-date="' + sel.dataset.date + '"]');
    if (c) c.value = (p && p.character) ? p.character : '';
  }));
}
async function sendPlan(plan, statusEl) {
  if (!plan.length) { statusEl.textContent = 'Nothing selected.'; return; }
  statusEl.textContent = 'Sending...';
  try {
    const res = await fetch(PLAN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan: plan }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    statusEl.textContent = 'Started: ' + plan.length + ' post(s). Each brief takes about a minute; the calendar refreshes every 30 seconds.';
    startAutoRefresh();
  } catch (e) { statusEl.textContent = 'Failed: ' + e.message; }
}
function submitPlan() {
  const plan = [];
  document.querySelectorAll('.plan6').forEach(sel => { if (sel.value) plan.push({ date: sel.dataset.date, format: 'Day Greeting' }); });
  let extraError = '';
  document.querySelectorAll('.extra-box').forEach(box => box.querySelectorAll('.extra-line').forEach(line => {
    const f = line.querySelector('.ex-format').value;
    const item = { date: box.dataset.date, time: line.querySelector('.ex-time').value, format: f };
    if (!item.time) { extraError = 'Every extra post needs a time.'; return; }
    if (f === 'Product') {
      const h = line.querySelector('.ex-product').value;
      if (!h) { extraError = 'Pick a product or promotable item for each extra Product post.'; return; }
      item.character = line.querySelector('.ex-char').value;
      if (h.indexOf('promo:') === 0) item.promo_item = h.slice(6);
      else { const p = (PRODUCTS || []).find(x => x.handle === h) || {}; item.product_handle = h; item.product_title = p.title || ''; }
    }
    plan.push(item);
  }));
  if (extraError) { document.getElementById('planStatus').textContent = extraError; return; }
  document.querySelectorAll('.plan7').forEach(sel => { if (sel.value) plan.push({ date: sel.dataset.date, format: sel.value }); });
  document.querySelectorAll('.plan12').forEach(sel => {
    if (!sel.value) return;
    const c0 = document.querySelector('.plan12c[data-date="' + sel.dataset.date + '"]');
    if (sel.value.indexOf('promo:') === 0) { plan.push({ date: sel.dataset.date, format: 'Product', promo_item: sel.value.slice(6), character: c0 ? c0.value : '' }); return; }
    const p = (PRODUCTS || []).find(x => x.handle === sel.value) || {};
    const c = document.querySelector('.plan12c[data-date="' + sel.dataset.date + '"]');
    plan.push({ date: sel.dataset.date, format: 'Product', product_handle: sel.value, product_title: p.title || '', character: c ? c.value : '' });
  });
  sendPlan(plan, document.getElementById('planStatus'));
}

    document.getElementById('adCharInfo').textContent = info;

let AUTO = null;
