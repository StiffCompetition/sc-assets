<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafafa;
    --panel: #ffffff;
    --olive: #3a3a3a;
    --olive-dark: #1a1a1a;
    --red: #6b6b6b;
    --red-dark: #444444;
    --amber: #6b6b6b;
    --line: #d8d8d8;
    --mono: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: #ffffff;
    color: var(--ink);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header img.logo-img { height: 56px; width: auto; display: block; flex-shrink: 0; }
  header .logo {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  header h1 {
    margin: 0;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 0.3px;
    font-size: 20px;
  }
  header p { margin: 2px 0 0; color: #6b6b6b; font-size: 13px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .toolbar select, .toolbar input[type="search"] {
    font-family: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  .toolbar .counts { margin-left: auto; font-family: var(--mono); font-size: 12px; color: #565a44; }
  .toolbar label.showposted { font-size: 13px; display: flex; align-items: center; gap: 5px; color: #444; }
  .tickfilter { position: relative; }
  .tickfilter > button { font-family: inherit; font-size: 14px; padding: 7px 9px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .tickfilter > button.set { border-color: var(--ink); font-weight: 600; }
  .tickpanel { display: none; position: absolute; top: 100%; left: 0; z-index: 20; background: #fff; border: 1px solid var(--ink); min-width: 180px; max-height: 260px; overflow-y: auto; padding: 6px; margin-top: 2px; }
  .tickpanel.open { display: block; }
  .tickpanel label { display: flex; align-items: center; gap: 6px; padding: 3px 2px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tickpanel .tickclear { font-size: 12px; color: #2a5db0; cursor: pointer; padding: 3px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid var(--line);
  }
  body { padding-top: var(--topbar-h, 130px); }
  .view-toggle { display: flex; border: 1px solid var(--olive); }
  .view-toggle button {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 14px;
    background: #fff;
    border: none;
    cursor: pointer;
    color: var(--olive-dark);
  }
  .view-toggle button.active { background: var(--olive); color: #fff; }

  main { padding: 20px 28px 60px; }

  .week-group { margin-bottom: 32px; }
  .week-label {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    color: #6a6f52;
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    margin-bottom: 0;
  }

  /* Fixed day-column grid */
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    border-left: 1px solid var(--line);
  }
  .day-header {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--olive-dark);
    padding: 6px 8px;
    text-align: center;
    border-right: 1px solid #555;
    border-bottom: 1px solid var(--line);
  }
  .day-header.sunday { background: var(--red-dark); }
  .day-col {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-height: 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    background: var(--paper);
  }
  .day-col.empty { background: #f5f5f3; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--olive);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: box-shadow .15s ease;
  }
  .card:hover { box-shadow: 2px 2px 0 var(--line); }
  .card.sunday { border-left-color: var(--red); }
  .card { border-left-width: 6px; }
  .card.needs { background: #fff4dc; }
  .char-tag { align-self: flex-start; font-size: 11px; font-weight: 700; color: #fff; padding: 1px 7px; border-radius: 9px; letter-spacing: .2px; }
  .type-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 28px 10px; font-family: var(--mono); font-size: 11px; color: #555; }
  .plan-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  .plan-table th { text-align: left; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; padding: 6px; border-bottom: 2px solid var(--ink); }
  .plan-table td { vertical-align: top; padding: 8px 6px; border-top: 1px solid var(--line); overflow: hidden; }
  .plan-table td.pgap { background: #fff4dc; }
  .plan-table select, .plan-table input[type=time] { max-width: 100%; margin-top: 4px; }
  .pchip { border-left: 5px solid #999; background: #fff; border: 1px solid var(--line); border-left-width: 5px; padding: 3px 6px; margin-bottom: 4px; font-size: 12px; line-height: 1.35; }
  .pchip .pst { display: block; font-size: 11px; }
  .pempty { display: block; font-family: var(--mono); font-size: 11px; font-weight: 700; color: #b06a00; }
  .pday b { display: block; margin-bottom: 4px; }
  .psum { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .psum span { background: #fff4dc; border: 1px solid #e0b860; padding: 1px 7px; font-size: 12px; }
  .plan-reuse { font-size: 12px; display: block; margin-top: 4px; }
  .clip-info { border: 1px solid var(--line); background: #f7f7f2; padding: 8px 10px; font-size: 13px; }
  .card .date { font-family: var(--mono); font-size: 11px; color: #565a44; }
  .card .day { font-weight: 700; font-size: 13px; line-height: 1.3; }
  .card .character { font-size: 12px; font-style: italic; color: #4b5320; }
  .card .format { font-family: var(--mono); font-size: 11px; color: var(--red-dark); }
  .card .snippet { font-size: 12.5px; line-height: 1.4; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .card .snippet.empty { color: #9a927a; font-style: italic; }
  .badge {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 6px;
    border: 1px solid;
  }
  .badge.draft { color: #8a8a8a; border-color: #8a8a8a; border-style: dashed; }
  .badge.notdesigned { color: #8a8a8a; border-color: #8a8a8a; border-style: dotted; }
  .badge.textapproved { color: #2a5db0; border-color: #2a5db0; }
  .badge.approved { color: var(--ink); border-color: var(--ink); }
  .badge.scheduled { color: #fff; background: #2e7d32; border-color: #2e7d32; }
  .badge.posted { color: #fff; background: var(--ink); border-color: var(--ink); }
  .badge.paused { color: var(--ink); border-color: var(--ink); text-decoration: line-through; }

  .list-view table { width: 100%; border-collapse: collapse; background: var(--panel); }
  .list-view th, .list-view td {
    border: 1px solid var(--line);
    padding: 10px 12px;
    text-align: left;
    font-size: 14.5px;
    line-height: 1.5;
    vertical-align: top;
  }
  .list-view th { background: var(--olive-dark); color: var(--paper); font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.5px; position: sticky; top: var(--topbar-h, 118px); }
  .list-view td.text-cell { max-width: 260px; }
  .list-view tr:hover { background: #efe9d8; }
  .row-btn { font-family: var(--mono); font-size: 11px; padding: 4px 8px; border: 1px solid var(--olive); background: #fff; cursor: pointer; }
  .row-btn:hover { background: var(--olive); color: #fff; }

  /* Editor drawer */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,23,15,0.55);
    z-index: 20;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .overlay.open { display: flex; }
  .drawer {
    background: var(--panel);
    width: min(420px, 92vw);
    height: 100%;
    padding: 22px;
    overflow-y: auto;
    border-left: 4px solid var(--red);
  }
  .drawer.full { width: 100vw; max-width: 100vw; border-left: none; padding: 0 max(22px, calc((100vw - 920px) / 2)) 40px; }
  .drawer.full .field textarea { min-height: 150px; font-size: 16px; line-height: 1.45; padding: 12px; }
  .drawer.full .field label { font-size: 12.5px; }
  .drawer.full h2 { font-size: 22px; }
  .brief-topbar { position: sticky; top: 0; z-index: 2; background: var(--panel); display: flex; justify-content: space-between; align-items: center; padding: 12px 0; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
  .drawer h2 { margin: 0 0 2px; font-size: 17px; }
  .drawer .sub { font-family: var(--mono); font-size: 12px; color: #6a6f52; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; color: #565a44; margin-bottom: 4px; }
  .field textarea, .field input, .field select {
    width: 100%; font-family: inherit; font-size: 14.5px;
    padding: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .field textarea { min-height: 70px; resize: vertical; }
  /* 23 Oct 2026 (Andy): date and time boxes are narrow, and open their picker wherever they are clicked */
  .field input[type="date"], .field input[type="time"] { width: 11em; max-width: 100%; cursor: pointer; }
  .clip-line { font-family: var(--mono); font-size: 11px; color: #565a44; margin-top: 4px; }
  .from-box { border: 1px solid var(--line); background: #f7f7f2; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
  .from-box b { font-family: var(--mono); font-size: 11px; letter-spacing: 0.4px; color: #565a44; }
  .drawer-actions { display: flex; gap: 8px; margin-top: 18px; }
  .btn { font-family: var(--mono); font-size: 12px; padding: 8px 14px; border: 1px solid var(--olive); background: var(--olive); color: #fff; cursor: pointer; }
  .btn.secondary { background: #fff; color: var(--olive-dark); }
  .btn.danger { border-color: var(--red-dark); background: var(--red-dark); }
  .save-status { font-family: var(--mono); font-size: 11px; margin-top: 8px; height: 14px; }

  .status-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .status-btn {
    font-family: var(--mono); font-size: 11px; padding: 6px 10px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  .status-btn:hover { border-color: var(--olive); }
  .status-btn.active { background: var(--olive); border-color: var(--olive); color: #fff; }
  .status-btn.active[data-value="approved"] { background: var(--ink); border-color: var(--ink); }
  .status-btn.active[data-value="text approved"] { background: #2a5db0; border-color: #2a5db0; }

  .loading, .error-state { padding: 40px 28px; font-family: var(--mono); font-size: 13px; color: #6a6f52; }
  .error-state { color: var(--red-dark); }

  .onscreen-preview { border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 10px; background: #fbfbf8; }
  .onscreen-preview.empty { font-style: italic; color: #9a927a; font-size: 12.5px; border-style: dashed; }
  .os-tag { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .5px; color: #6a6f52; margin-bottom: 2px; }
  .os-setup { opacity: .5; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .os-delivery { font-weight: 700; font-size: 15px; }
  .os-card-line { font-size: 12px; font-weight: 700; margin-top: -2px; }
  .os-card-line .os-setup-hint { font-weight: 400; color: #9a927a; font-size: 10px; }
  .os-card-line.empty { font-weight: 400; font-style: italic; color: #9a927a; }
.brief-part{white-space:pre-wrap;font-size:13px;line-height:1.45;padding:8px 10px;border:1px solid var(--line);background:#fafafa}
.panel-box{margin:10px 0;padding:10px 12px;border:1px solid var(--line);font-size:13px}
.panel-box.ok{background:#eef8ee;border-color:#9ccc9c}
.panel-box.bad{background:#fdeceb;border-color:#e0a9a4}
.panel-fails{white-space:pre-wrap;margin-top:6px;font-size:12px;line-height:1.4}

/* Phone layout (added 3 Oct 2026). Applies only below 760px wide; desktop is unchanged. */
@media (max-width: 760px) {
  body { padding-top: 0 !important; }
  #topbar { position: static; }
  header { padding: 12px 14px; gap: 10px; }
  header h1 { font-size: 18px; }
  header p { font-size: 12px; }
  .toolbar { padding: 10px 14px; gap: 8px; }
  .toolbar .counts { margin-left: 0; width: 100%; }
  .toolbar input[type="search"] { flex: 1 1 100%; }
  .toolbar select, .toolbar input[type="search"], .tickfilter > button, .view-toggle button, .btn, .row-btn, .status-btn, .toolbar label.showposted { min-height: 44px; }
  .tickpanel { max-width: calc(100vw - 28px); }
  main { padding: 14px 14px 48px; }
  /* Calendar: one day per row (header, then that day's posts) */
  .day-grid { grid-template-columns: 1fr; border-left: none; }
  .day-header { text-align: left; padding: 8px 10px; border-right: none; }
  .day-col { min-height: 0; }
 .day-grid > :nth-child(1) { order: 1; } .day-grid > :nth-child(8) { order: 2; }
 .day-grid > :nth-child(2) { order: 3; } .day-grid > :nth-child(9) { order: 4; }
 .day-grid > :nth-child(3) { order: 5; } .day-grid > :nth-child(10) { order: 6; }
 .day-grid > :nth-child(4) { order: 7; } .day-grid > :nth-child(11) { order: 8; }
 .day-grid > :nth-child(5) { order: 9; } .day-grid > :nth-child(12) { order: 10; }
 .day-grid > :nth-child(6) { order: 11; } .day-grid > :nth-child(13) { order: 12; }
 .day-grid > :nth-child(7) { order: 13; } .day-grid > :nth-child(14) { order: 14; }
  /* List: each post is a stacked card instead of a 7-column table */
  .list-view table, .list-view tbody, .list-view tr, .list-view td { display: block; width: 100%; }
  .list-view thead { display: none; }
  .list-view tr { border: 1px solid var(--line); background: var(--panel); margin-bottom: 12px; padding: 6px 0; }
  .list-view td { border: none; padding: 4px 12px; }
  .list-view td.text-cell { max-width: none; }
  .list-view td::before { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.5px; color: #565a44; }
  .list-view td:nth-child(1)::before { content: "Date"; }
  .list-view td:nth-child(2)::before { content: "Day / Character"; }
  .list-view td:nth-child(3)::before { content: "Format"; }
  .list-view td:nth-child(4)::before { content: "Text"; }
  .list-view td:nth-child(5)::before { content: "Platforms"; }
  .list-view td:nth-child(6)::before { content: "Status"; }
  .list-view .row-btn { width: 100%; }
  /* Editor */
  .drawer.full { padding-left: 14px !important; padding-right: 14px !important; }
  .brief-topbar { flex-wrap: wrap; gap: 8px; }
  .drawer-actions { flex-wrap: wrap; }
  .drawer-actions .btn { flex: 1 1 140px; }
  .drawer.full .field textarea, .field input, .field select { font-size: 16px; }
}
.postno{font-family:var(--mono);font-size:11px;color:#888;margin-left:4px}

.camp-h{font-size:18px;margin:18px 0 10px;border-bottom:3px solid #F5B800;padding-bottom:4px}
.hype-sec{margin:0 0 26px}
.hype-wk{font-size:15px;margin:16px 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}

.hype-card label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#555}

.hype-btns{display:flex;flex-wrap:wrap;gap:6px}

.camp-tt{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}

.camp-cap pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;background:#f6f4ef;padding:8px;margin:4px 0 6px}
.lib-clipname{font-size:15px;font-weight:700;line-height:1.3}
.lib-title{font-size:13.5px;font-weight:600;line-height:1.35}

/* ---------- Cartoons board (18 Oct 2026, Andy) ---------- */
.cb-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.cb-pieces{background:#fff;border:1px solid var(--line);padding:10px;max-height:calc(100vh - 180px);overflow:auto}
.cb-pieces h3,.cb-board h3{margin:0 0 8px;font-size:14px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px}
.cb-pieces select{width:100%;margin-bottom:8px;min-height:36px}
.cb-piece{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:6px;margin-bottom:6px;background:#fafafa;cursor:grab}
.cb-piece img,.cb-piece .cb-ph{width:44px;height:78px;object-fit:cover;background:#222;flex-shrink:0;display:block}
.cb-piece .cb-ph{display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;text-align:center;line-height:1.1}
.cb-piece .cb-pt{font-size:12.5px;line-height:1.3}
.cb-piece .cb-pk{font-family:var(--mono);font-size:10.5px;color:#777}
.cb-piece button{margin-left:auto;min-height:36px;font-size:12px}
.cb-board{display:flex;flex-direction:column;gap:12px}
.cb-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);padding:10px}
.cb-head input,.cb-head select{min-height:40px;font-size:14px;padding:6px 8px;border:1px solid var(--line)}
.cb-head input[type=text]{flex:1 1 220px}
.cb-stage-row{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start}
.cb-stage{position:relative;width:270px;height:480px;background:#000;overflow:hidden;border:1px solid var(--line)}
.cb-stage canvas,.cb-stage video,.cb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb-stage .cb-card-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-family:Impact,'Arial Narrow Bold',sans-serif;font-size:30px;line-height:1.15;text-transform:uppercase;background:#000}
.cb-stage .cb-needed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;background:#4a3b00;font-size:14px;gap:8px}
.cb-stage .cb-needed b{font-family:var(--mono);font-size:12px;letter-spacing:.5px}
.cb-stage .cb-credits{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.cb-stage .cb-credits img{position:static;width:120px;height:120px;object-fit:contain}
.cb-stage .cb-credits div{font-family:Impact,'Arial Narrow Bold',sans-serif;font-size:22px;letter-spacing:1px}
.cb-stage .cb-credits small{font-family:var(--mono);font-size:11px;color:#E8B923}
.cb-stage .cb-time{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px}
.cb-controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cb-controls .btn{min-height:40px}
.cb-totals{background:#fff;border:1px solid var(--line);padding:10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.cb-totals b{font-family:var(--mono)}
.cb-strip{display:flex;gap:10px;overflow-x:auto;padding:10px;background:#fff;border:1px solid var(--line);min-height:300px;align-items:flex-start}
.cb-shot{flex:0 0 190px;border:1px solid var(--line);border-top:5px solid #777;background:#fafafa;display:flex;flex-direction:column;gap:5px;padding:7px;font-size:12px;position:relative}
.cb-shot.dragover{outline:3px dashed #F5B800;outline-offset:2px}
.cb-shot.clip{border-top-color:#2a5db0}.cb-shot.picture{border-top-color:#6a9a3a}.cb-shot.green{border-top-color:#2a9a5a}.cb-shot.text{border-top-color:#111}.cb-shot.credits{border-top-color:#E8B923}.cb-shot.needed{border-top-color:#c27a00;background:#fff4dc}
.cb-shot .cb-th{width:100%;aspect-ratio:9/16;max-height:200px;object-fit:cover;background:#111;display:block}
.cb-shot .cb-th.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;text-align:center;padding:8px}
.cb-shot .cb-n{font-family:var(--mono);font-size:10.5px;color:#777;display:flex;justify-content:space-between}
.cb-shot .cb-t{font-weight:600;font-size:12.5px;line-height:1.3}
.cb-shot label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11.5px}
.cb-shot input[type=number]{width:62px;min-height:30px;font-size:12px}
.cb-shot input[type=text],.cb-shot textarea,.cb-shot select{width:100%;font-size:12px;min-height:30px;border:1px solid var(--line);padding:3px 5px}
.cb-shot textarea{min-height:54px;resize:vertical}
.cb-shot .cb-row{display:flex;gap:4px}
.cb-shot .cb-row button{flex:1;min-height:32px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:#fff}
.cb-shot .cb-cost{font-family:var(--mono);font-size:11px;color:#8a5200}
.cb-empty{color:#777;font-size:13px;padding:30px;text-align:center;width:100%}
.cb-status{font-family:var(--mono);font-size:12px;color:#555;min-height:18px}
@media (max-width: 900px){.cb-wrap{grid-template-columns:1fr}.cb-pieces{max-height:260px}.cb-stage-row{grid-template-columns:1fr}.cb-stage{margin:0 auto}}

/* Cartoons mode: the calendar header and filters are hidden so the board has the room */
body.cb-mode #topbar{display:none}
body.cb-mode{padding-top:0 !important}
body.cb-mode main{padding-top:10px}
.cb-title{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-right:6px}
</style>
</head>
<body>

<div id="topbar">
<header>
  <img class="logo-img" src="https://res.cloudinary.com/dkapdtxek/image/upload/v1791598843/SCSMAuto/sc_letters_logo_header_v1.png" alt="SC" onerror="this.outerHTML='&lt;div class=&quot;logo&quot;&gt;SC&lt;/div&gt;'">
  <div>
    <h1>Content Calendar</h1>
    <p>Plan content → brief ready → text approved (start image) → image approved (video) → approved (scheduled)</p>
  </div>
</header>
<div class="legend" id="typeLegend"></div>

<div class="toolbar">
  <div class="view-toggle">
    <button id="btnGrid" class="active">Calendar</button>
    <button id="btnList">List</button>
    <button id="btnLibrary">Library</button>
    <button id="btnCampaigns">Campaigns</button>
    <button id="btnCartoons">Cartoons</button>
  </div>
  <div class="tickfilter" id="tf_character"><button type="button">Characters</button><div class="tickpanel"></div></div>
  <div class="tickfilter" id="tf_format"><button type="button">Formats</button><div class="tickpanel"></div></div>
  <div class="tickfilter" id="tf_status"><button type="button">Statuses</button><div class="tickpanel"></div></div>
  <div class="tickfilter" id="tf_platform"><button type="button">Platforms</button><div class="tickpanel"></div></div>
  <input type="search" id="filterSearch" placeholder="search text...">
  <label class="showposted"><input type="checkbox" id="showPostedRejected"> Show posted/rejected</label>
  <button class="btn" id="btnPlan">Plan content</button>
  <button class="btn secondary" id="btnAdhoc">Add a post</button>
  <button class="btn secondary" id="btnPress">Press coverage</button>
  <button class="btn secondary" id="btnBoxes">Product boxes</button>
  <div class="counts" id="counts"></div>
</div>
</div>

<main id="main">
  <div class="loading">Loading calendar…</div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<div class="overlay" id="planOverlay" style="justify-content:center;align-items:stretch">
  <div class="drawer full" id="planPanel" style="padding:0 max(22px, calc((100vw - 1200px) / 2)) 40px"></div>
</div>

<script>
const LIST_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-list';
const UPDATE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-update';
const DELETE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-delete';
const CONCEPT_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-concept-creator';
const PLAN_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-plan-content';
const OPTIONS_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-plan-options';
const IDEAS_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-ideas-list';   // 23 Oct 2026: approved Ideas-tab lines for the Recreate panel (SC - Ideas List Feed)
const BOX_LIST_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-product-box';
const BOX_SAVE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-product-box-save';
const PRODUCTBOX_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-productbox';
const COVERAGE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-coverage-list';
const PREVIEW_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-text-preview';
const VO_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-vo-timing';   // SC - VO Timing Check: speaks lines in the announcer voice

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// JS getDay(): 0=Sun,1=Mon,...,6=Sat. Map to our 0=Mon..6=Sun index:
function dayIndex(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return (d.getDay() + 6) % 7; // Mon=0 ... Sun=6
}

let ROWS = [];
let PRESS_ITEMS = [];
let VIEW = 'grid';
const FILTERS = { character: new Set(), format: new Set(), status: new Set(), platform: new Set() };

function decodeEntities(s) {
  if (!s) return s;
  const t = document.createElement('textarea');
  t.innerHTML = s;
  return t.value;
}

const STATUS_CLASS = (s) => {
  if (!s) return 'draft';
  if (s.startsWith('draft - format')) return 'notdesigned';
  if (s.startsWith('draft')) return 'draft';
  if (s === 'text approved' || s === 'image ready' || s === 'image approved') return 'textapproved';
  if (s === 'approved') return 'scheduled';
  if (s === 'scheduled') return 'scheduled';
  if (s === 'posted') return 'posted';
  if (s === 'paused') return 'paused';
  return 'draft';
};
const STATUS_LABEL = (s) => {
  if (!s) return 'draft';
  if (s.startsWith('draft - format')) return 'not designed';
  if (s === 'approved') return 'scheduled';   // "approved" IS the scheduled-to-post state (Plan → ... → approved (scheduled))
  return s;
};

function fmtDate(raw) {
  const d = new Date(raw);
  return d.toLocaleDateString('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
// Colour coding (9 Oct 2026): each post type has its own colour on the card edge; each character his Roll Call colour.
const FORMAT_COLOR = { 'Day Greeting': '#E0A100', 'Wisdom': '#2E7D32', 'Character Lore': '#8E24AA', 'Travel the World': '#0288D1', 'Brand Lore': '#C62828', 'Product': '#EF6C00', 'NFT': '#00897B', 'Dare to Buy': '#D81B60', 'Campaign': '#F5B800' };
const CHAR_COLOR = { 'Major Wood': '#556B2F', 'The Rear Admiral': '#1E3A8A', "Hammerin' Hanky": '#FF7A00', 'The Grip': '#1E5BD8', 'Slick Willy': '#111111', 'The Velvet Python': '#6B2FA0', 'SC Logo': '#555555' };
// Brand posts are filed under "SC Logo" for the pipeline; on screen they read "All 6" (Roll Call) or "Brand".
function charLabel(c, r) { return c === 'SC Logo' ? (r && isRollCall(r.notes) ? 'All 6' : 'Brand') : (c || ''); }
function charTag(c, r) { return '<span class="char-tag" style="background:' + (CHAR_COLOR[c] || '#777') + '">' + escapeHtml(charLabel(c, r)) + '</span>'; }
function typeDot(f) { return '<span class="type-dot" style="background:' + (FORMAT_COLOR[f] || '#999') + '"></span>'; }
function dayName(r) { return r.day_of_week || new Date(r.post_date).toLocaleDateString('en-GB', { timeZone: 'Europe/London', weekday: 'long' }); }
function needsYou(r) { return cardStage(r).you; }   // amber tint on every post waiting for Andy (10 Oct 2026)
// One status per card (10 Oct 2026, Andy): what the post needs next, or where it is.
function cardStage(r) {
  const AMBER = '#b06a00', BLUE = '#2a5db0', GREEN = '#2a7a2a', RED = '#b00', GREY = '#777';
  const s = r.status || '';
  if (s === 'posted') return { label: 'posted', color: GREEN, you: false };
  if (s === 'approved' || s === 'scheduled') return isMissed(r) ? { label: 'slot missed - reschedule or Post Now', color: RED, you: true } : { label: 'scheduled', color: GREEN, you: false };
  if (s === 'paused') return { label: 'paused', color: GREY, you: false };
  if (s === 'rejected') return { label: 'rejected', color: GREY, you: false };
  if (s.indexOf('draft - format') === 0) return { label: 'not designed', color: GREY, you: false };
  if (r.panel_status === 'failed') return { label: 'needs attention', color: RED, you: true };
  if (r.panel_status === 'creating') return { label: 'writing brief...', color: GREY, you: false };
  if (r.panel_status === 'concepts') return { label: 'pick a concept', color: AMBER, you: true };
  if (dtbSlides(r)) return { label: 'approve slides', color: AMBER, you: true };
  if (r.video_url) return { label: 'approve clip', color: AMBER, you: true };
  if (s === 'image ready') return { label: 'check start image', color: AMBER, you: true };
  if (s === 'text approved') return { label: ({ rollcall: 'making the video...', travel: 'preparing the artwork...', product: 'seating the presenter...' }[flowOf(r)] || 'making start image...'), color: BLUE, you: false };
  if (s === 'image approved') return { label: r.kling_job ? 'video rendering at Kling...' : 'making video...', color: BLUE, you: false };
  return { label: 'approve text', color: AMBER, you: true };
}
function postTimeKey(r) { try { return r._press ? '99:99' : londonHm(slotDue(r)); } catch (e) { return '99:99'; } }   // press cards sit after the day's posts
function londonHm(d) { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false }).format(d); }

function isRollCall(notes) { return /Roll:\s*call/i.test(String(notes || '')); }
function renderLegend() { const el = document.getElementById('typeLegend'); if (el) el.innerHTML = Object.keys(FORMAT_COLOR).map(f => '<span>' + typeDot(f) + escapeHtml(f) + '</span>').join('') + '<span><span class="type-dot" style="background:#fff4dc;border:1px solid #e0b860"></span>needs you</span>'; }
document.addEventListener('DOMContentLoaded', renderLegend);
function isoDate(raw) {
  const d = new Date(raw);
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}

async function loadRows() {
  try {
    const res = await fetch(LIST_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    // 10 Oct 2026 (Andy): posts run by day, then by posting time (London), so each day reads in time order.
    ROWS = (Array.isArray(data) ? data : []).sort((a, b) => isoDate(a.post_date).localeCompare(isoDate(b.post_date)) || (postTimeKey(a)).localeCompare(postTimeKey(b)));
    try {
      const pr = await fetch(COVERAGE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(x => x.json());
      PRESS_ITEMS = [];
      ((pr && pr.rows) || []).forEach(row => (row.channels || []).forEach(c => PRESS_ITEMS.push({ _press: true, id: 'press-' + row.record_id + '-' + c.name, post_date: c.date, channel: c.name, state: c.state, headline: row.headline, outlet: row.outlet, url: row.url })));
    } catch (e) { PRESS_ITEMS = []; }
    populateFilters();
    render();
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="error-state">Could not load the calendar (' + e.message + '). The n8n webhook may need a moment after publish, or check the workflow is active.</div>';
  }
}

function buildTickPanel(key, values) {
  const wrap = document.getElementById('tf_' + key);
  const btn = wrap.querySelector('button');
  const panel = wrap.querySelector('.tickpanel');
  panel.innerHTML = values.map(v =>
    '<label><input type="checkbox" value="' + escapeHtml(String(v)) + '"' + (FILTERS[key].has(v) ? ' checked' : '') + '> ' + escapeHtml(String(v)) + '</label>'
  ).join('') + '<div class="tickclear">Clear</div>';
  panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    if (cb.checked) FILTERS[key].add(cb.value); else FILTERS[key].delete(cb.value);
    updateTickButton(key);
    render();
  }));
  panel.querySelector('.tickclear').addEventListener('click', () => {
    FILTERS[key].clear();
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    updateTickButton(key);
    render();
  });
  if (!btn.dataset.wired) {
    btn.dataset.wired = '1';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.tickpanel.open').forEach(p => { if (p !== panel) p.classList.remove('open'); });
      panel.classList.toggle('open');
    });
  }
  updateTickButton(key);
}
function updateTickButton(key) {
  const wrap = document.getElementById('tf_' + key);
  const btn = wrap.querySelector('button');
  const n = FILTERS[key].size;
  const label = { character: 'Characters', format: 'Formats', status: 'Statuses', platform: 'Platforms' }[key];
  btn.textContent = n ? label + ' (' + n + ')' : label;
  btn.classList.toggle('set', n > 0);
}
document.addEventListener('click', () => document.querySelectorAll('.tickpanel.open').forEach(p => p.classList.remove('open')));

function populateFilters() {
  const chars = [...new Set(ROWS.map(r => r.character))].sort();
  const formats = [...new Set(ROWS.map(r => r.format))].sort();
  if (PRESS_ITEMS.length) formats.push('Press');
  const statuses = STATE_NAMES;
  const platforms = [...new Set(ROWS.flatMap(r => (r.platforms || '').split(',').map(p => p.trim()).filter(Boolean)))].sort();
  buildTickPanel('character', chars);
  buildTickPanel('format', formats);
  buildTickPanel('status', statuses);
  buildTickPanel('platform', platforms);
}

function filteredRows() {
  const showPR = document.getElementById('showPostedRejected').checked;
  const q = document.getElementById('filterSearch').value.trim().toLowerCase();
  return ROWS.filter(r =>
    (['cleared', 'ready', 'concepts', 'creating', 'failed'].indexOf(r.panel_status) !== -1 || (showPR && r.panel_status === 'rejected')) &&
    (showPR || r.status !== 'posted') &&
    (!FILTERS.character.size || FILTERS.character.has(r.character)) &&
    (!FILTERS.format.size || FILTERS.format.has(r.format)) &&
    (!FILTERS.status.size || FILTERS.status.has(stateName(r))) &&
    (!FILTERS.platform.size || (r.platforms || '').split(',').map(x => x.trim()).some(p => FILTERS.platform.has(p))) &&
    (!q || (r.text_content || '').toLowerCase().includes(q))
  );
}

// Press coverage cards (read-only, from SC - Coverage List API). Shown when no other filter is set, or when Format = Press.
function pressCards() {
  const other = FILTERS.character.size || FILTERS.status.size || FILTERS.platform.size || document.getElementById('filterSearch').value.trim();
  const fset = FILTERS.format;
  if (other || (fset.size && !fset.has('Press'))) return [];
  const showPR = document.getElementById('showPostedRejected').checked;
  return showPR ? PRESS_ITEMS : PRESS_ITEMS.filter(p => p.state !== 'posted');
}
function makePressCard(p) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.borderLeftColor = '#7a3db0';
  const col = p.state === 'posted' ? '#2a7a2a' : (p.state.indexOf('held') === 0 ? '#b06a00' : (p.state === 'sent to you' ? '#2a5db0' : '#777'));
  card.innerHTML =
    '<div class="date">' + fmtDate(p.post_date) + '</div>' +
    '<span class="badge" style="border-color:#7a3db0;color:#fff;background:#7a3db0">PRESS</span>' +
    '<div class="character">' + escapeHtml(p.channel) + '</div>' +
    '<div class="snippet">' + escapeHtml((p.outlet || '') + ': ' + (p.headline || '')) + '</div>' +
    '<span class="badge" style="border-color:' + col + ';color:' + col + '">' + escapeHtml(p.state) + '</span>';
  card.addEventListener('click', () => openPress());
  return card;
}

function render() {
  if (VIEW === 'library') { renderLibrary(); return; }
  if (VIEW === 'campaigns') { renderCampaigns(); return; }
  if (VIEW === 'cartoons') { renderCartoons(); return; }
  const rows = filteredRows();
  document.getElementById('counts').textContent = rows.length + ' / ' + ROWS.length + ' posts';
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (VIEW === 'grid') {
    // Group rows by week (Mon as week start)
    const weeks = {};
    rows.concat(pressCards()).forEach(r => {
      const iso = isoDate(r.post_date);
      const d = new Date(iso + 'T00:00:00');
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - dayIndex(iso)); // back to Monday
      const sortKey = weekStart.toISOString().slice(0, 10);
      const label = weekStart.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      if (!weeks[sortKey]) weeks[sortKey] = { label, cols: Array.from({length:7}, ()=>[]) };
      weeks[sortKey].cols[dayIndex(iso)].push(r);
    });

    Object.keys(weeks).sort().forEach(sortKey => {
      const { label, cols } = weeks[sortKey];
      const group = document.createElement('div');
      group.className = 'week-group';

      const weekLabel = document.createElement('div');
      weekLabel.className = 'week-label';
      weekLabel.textContent = 'Week of ' + label;
      group.appendChild(weekLabel);

      const grid = document.createElement('div');
      grid.className = 'day-grid';

      // Header row
      DAYS.forEach((d, i) => {
        const h = document.createElement('div');
        h.className = 'day-header' + (i === 6 ? ' sunday' : '');
        h.textContent = d;
        grid.appendChild(h);
      });

      // Card columns
      cols.forEach((dayRows, i) => {
        const col = document.createElement('div');
        col.className = 'day-col' + (dayRows.length === 0 ? ' empty' : '');
        dayRows.slice().sort((a, b) => postTimeKey(a).localeCompare(postTimeKey(b))).forEach(r => col.appendChild(r._press ? makePressCard(r) : makeCard(r)));
        grid.appendChild(col);
      });

      group.appendChild(grid);
      main.appendChild(group);
    });

    if (!rows.length && !pressCards().length) main.innerHTML = '<div class="loading">No posts match these filters.</div>';
  } else {
    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Date</th><th>Day / Character</th><th>Format</th><th>Text</th><th>Platforms</th><th>Status</th><th></th></tr></thead>';
    const tbody = document.createElement('tbody');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + fmtDate(r.post_date) + '</td>' +
        '<td>' + dayName(r) + '<br>' + charTag(r.character, r) + '</td>' +
        '<td>' + typeDot(r.format) + r.format + '</td>' +
        '<td class="text-cell">' + (r.text_content ? escapeHtml(r.text_content) : '<span class="snippet empty">no text yet</span>') + '</td>' +
        '<td>' + (r.platforms || '') + '</td>' +
        '<td>' + (st => '<span class="badge" style="border-color:' + st.color + ';color:' + st.color + '">' + escapeHtml(st.label) + '</span>')(cardStage(r)) + '</td>' +
        '<td><button class="row-btn" data-id="' + r.id + '">Edit</button></td>';
      tr.querySelector('.row-btn').addEventListener('click', () => openDrawer(r));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    const wrap = document.createElement('div');
    wrap.className = 'list-view';
    wrap.appendChild(table);
    main.appendChild(wrap);
  }
}

// 23 Oct 2026 (Andy): the clip a post uses is named wherever it is shown. Brand Lore: Roll Call portraits, Roll Call comic pages, Movie Poster,
// or an action clip named by its on-screen line.
function clipName(r) {
  const n = String(r.notes || '');
  if (/Clip:\s*posterwall/i.test(n)) return 'Movie Poster';
  if (isRollCall(n)) return /RollVO:[^|]*\s\/\s/i.test(n) ? 'Roll Call portraits' : 'Roll Call comic pages';
  const os = extractOnScreen(n);
  if (!os.hasText) return 'Action clip';
  return 'Action clip "' + ((os.isSplit ? os.setupText + ' ' : '') + os.deliveryText).replace(/\*/g, '').toUpperCase() + '"';

function extractOnScreen(notes) {
  if (!notes) return { hasText: false };
  const m = notes.match(/On-screen:\s*([\s\S]+?)\s*(?:Sound:|Motion:|ID:|$)/i);
  const raw = m ? m[1].trim() : '';
  if (!raw || raw === '-') return { hasText: false };   // '-' = no on-screen text (Product, NFT)
  // Same split rule as the video step (Build Text Elements): a slash separates the text; without a slash, sentence ends do.
  const hasSlash = raw.includes('/');
  const flattened = hasSlash ? raw.split('/').map(s => s.trim()).filter(Boolean).join(' ') : raw;
  const sentences = hasSlash ? raw.split('/').map(s => s.trim()).filter(Boolean) : flattened.split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(Boolean);
  const isSplit = sentences.length > 1;
  const setupText = isSplit ? sentences.slice(0, -1).join(' ') : '';
  const deliveryText = isSplit ? sentences[sentences.length - 1] : flattened;
  const words = t => t.split(/\s+/).filter(Boolean).length;
  // 8 words or fewer with a slash: two stacked blocks (title on top, message below), both held to the end of the clip.
  const stacked = hasSlash && isSplit && (words(setupText) + words(deliveryText)) <= 8;
  return { hasText: true, isSplit, stacked, setupText, deliveryText };
}

function renderOsWords(text) {
  return text.split(/\s+/).filter(Boolean).map(w => {
    const important = /^\*.+\*[^\w]*$/.test(w);
    const clean = w.replace(/\*/g, '').replace(/[.,;:"]/g, '');
    const disp = escapeHtml(clean.toUpperCase());
    return important ? '<b>' + disp + '</b>' : disp;
  }).join(' ');
}

}

function briefPart(notes, label) {
  if (!notes) return '';
  const LABELS = ['Appearance','Scene','End frame','End','On-screen','Sound','Motion','Source','Plan','ID','NFT'];
  const lower = notes.toLowerCase();
  const hits = [];
  LABELS.forEach(function(L) {
    const needle = (L + ':').toLowerCase();
    let from = 0;
    while (true) {
      const at = lower.indexOf(needle, from);
      if (at === -1) break;
      if (!(L === 'NFT' && /source:\s*$/.test(lower.slice(Math.max(0, at - 12), at)))) hits.push({ label: L, start: at, valueStart: at + needle.length });
      from = at + needle.length;
    }
  });
  hits.sort(function(a, b) { return a.start - b.start; });
  for (let i = 0; i < hits.length; i++) {
    if (hits[i].label.toLowerCase() === label.toLowerCase()) {
      const end = (i + 1 < hits.length) ? hits[i + 1].start : notes.length;
      return notes.slice(hits[i].valueStart, end).trim();
    }
  }
  return '';
}

function briefField(notes, label, display) {

function composeNotes(orig) {
  const g = id => { const el = document.getElementById('b_' + id); return el ? el.value.trim() : null; };
  if (g('scene') === null) {
    const ev = g('rollvo');
    if (ev === null) return orig;
    return orig.replace(/(RollVO:\s*)([\s\S]*?)(\s*\|\s*Logo:[\s\S]*)?$/i, (m, a, b, c) => a + ev.replace(/\s+/g, ' ') + (c || ''));
  }
  const idPart = briefPart(orig, 'ID');
  const sound = (g('sound') || '').replace(/[.]+$/, '');
  let src = briefPart(orig, 'Source');
  // Shot plan (Playbook 7.33): written by the concept step; kept unchanged on save.
  const plan = briefPart(orig, 'Plan');
  // Roll Call (Playbook 7.12): the announcer voice-over sits at the end of the Source part as "RollVO: <line> | Logo: <end line>".
  // It is taken off before the Payoff edit (which runs to the end) and put back with any edit from the Voice-over box.
  let rollTail = '';
  const rv = src ? src.match(/\s*RollVO:\s*([\s\S]*?)\s*(\|\s*Logo:[\s\S]*)?$/i) : null;
  if (rv) {

  }

  if (src && /Payoff:/i.test(src) && sound) src = src.replace(/Payoff:\s*[\s\S]*$/i, 'Payoff: ' + sound + '.');
  // Product voice-over (7.7.2): an edit in the Voice-over box replaces the VO line inside the Source part.
  const voEd = g('vo');
  if (voEd !== null && src && VO_RX.test(src)) src = src.replace(VO_RX, () => 'VO: ' + voEd.replace(/\s+/g, ' ') + ' ');
  src = (src || '').trim() + rollTail;
  return 'Scene: ' + g('scene') + ' On-screen: ' + g('onscreen') + ' Sound: ' + sound + '. Motion: ' + g('motion') +
    (idPart ? ' ID: ' + idPart.replace(/[.]+$/, '') + '.' : '') + (src ? ' Source: ' + src : '') + (plan ? ' Plan: ' + plan : '');

// Each post type's route (9 Oct 2026, checked against the live workflows): the status buttons and their explanation follow it.
function flowOf(r) {
  if (!r) return 'standard';
  if (/REPOST:/.test(String(r.notes || ''))) return 'repost';   // Library repost: the clip is already made
  if (r.format === 'Dare to Buy') return 'dtb';          // SC - Dare to Buy Builder makes the slides; no video
  if (r.format === 'NFT') return 'nft';                  // SC - NFT Post Builder makes the whole clip
  if (isRollCall(r.notes)) return 'rollcall';            // fixed Roll Call clip + voice-over, no start image
  if (r.format === 'Travel the World') return 'travel';  // the NFT artwork extended to 9:16 is the start image
  if (r.format === 'Product') return 'product';          // the presenter seated with the product box is the start image
  return 'standard';
}
const FLOW = {
  standard: { opts: ['draft', 'text approved', 'image ready', 'image approved', 'approved', 'posted', 'paused'],
    help: '"text approved" makes the start image only (small spend) and comes back as "image ready". "image approved" makes the video from that exact image (one clip spend). "approved" is your final sign-off: the post is saved as scheduled and goes out at its time.' },
  product: { opts: ['draft', 'text approved', 'image ready', 'image approved', 'approved', 'posted', 'paused'],
    help: '"text approved" makes the start image: the presenter seated with the product box (small spend), back as "image ready". "image approved" makes the video from that image, with the ticker, box and voice-over (one clip spend). "approved" is your final sign-off: the post is scheduled and goes out at its time.' },
  travel: { opts: ['draft', 'text approved', 'image ready', 'image approved', 'approved', 'posted', 'paused'],
    help: '"text approved" prepares the start image: the NFT artwork extended to fill the frame, back as "image ready". "image approved" makes the video from it (one clip spend). "approved" is your final sign-off: the post is scheduled and goes out at its time.' },
  rollcall: { opts: ['draft', 'text approved', 'approved', 'posted', 'paused'],
    help: 'Roll Call: "text approved" makes the video straight away from the fixed Roll Call clip and the announcer voice-over (about 5-15 min, no start image), back as "clip ready for your approval". "approved" is your final sign-off: the post is scheduled and goes out at its time.' },
  nft: { opts: ['draft', 'approved', 'posted', 'paused'],
    help: 'NFT: the clip is made whole when the post is planned (the character\'s NFT template, the NFT and its ticker). "approved" is your final sign-off: the post is scheduled and goes out at its time. "draft" holds it back.' },
  repost: { opts: ['draft', 'approved', 'posted', 'paused'],
    help: 'Repost (Library tab): the clip is already made, so nothing is generated. Check the captions and platforms, then "approved" schedules it for its date and time. "draft" holds it back.' },
  dtb: { opts: ['draft', 'approved', 'posted', 'paused'],
    help: 'Dare to Buy: the three carousel slides and the X image are made when the post is planned; there is no video. "approved" is your final sign-off: the post is scheduled and goes out at its time. "draft" holds it back.' }
};
function statusField(current, r) {
  // 9 Oct 2026 (Andy): one final-approval button. "approved" saves the post as scheduled, which the scheduler posts at its slot.
  const f = FLOW[flowOf(r)];
  const cur = current === 'scheduled' ? 'approved' : current;
  const options = f.opts.indexOf(cur) === -1 && cur ? f.opts.concat([cur]) : f.opts;   // a status from before is still shown
  let opts = options.map(o => '<button type="button" class="status-btn' + (o === cur ? ' active' : '') + '" data-value="' + o + '">' + o + '</button>').join('');
  return '<div class="field"><label>Status &mdash; ' + f.help + '</label><div class="status-buttons" id="statusButtons">' + opts + '</div></div>';
}

async function postNow(r) {
  const statusEl = document.getElementById('saveStatus');
  // 23 Oct 2026 (Andy): "I post what I want when I want" - anything that looks wrong is a warning with Do it anyway, never a block.
  // The publish step only takes approved posts, so a post that is not approved is marked approved at the moment Andy confirms.
  const warns = [];
  const needsApproval = ['approved', 'scheduled'].indexOf(r.status) === -1 || r.panel_status === 'rejected';
  if (r.status === 'posted') warns.push('This post has already been posted.');
  else if (['approved', 'scheduled'].indexOf(r.status) === -1) warns.push('This post is not approved yet (it is "' + (r.status || 'draft') + '").');
  if (r.panel_status === 'rejected') warns.push('This post was rejected.');
  if (!confirm((warns.length ? warns.join('\n') + '\n\nDo it anyway? Posting marks it approved first.\n\n' : '') + 'Post this now to all platforms immediately?')) return;
  statusEl.textContent = 'Posting...';
  try {
    if (needsApproval) {
      const body = { id: r.id, status: 'approved' };
      if (r.panel_status === 'rejected') body.panel_status = 'ready';
      const up = await fetch(UPDATE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!up.ok) throw new Error('could not mark it approved (HTTP ' + up.status + ')');
      r.status = 'approved'; if (body.panel_status) r.panel_status = body.panel_status;
    }
    const res = await fetch('https://n8n-production-afc2.up.railway.app/webhook/sc-post-now', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rowId: r.id })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    statusEl.textContent = 'Posted.';
    setTimeout(() => { try { loadRows(); } catch (e) {} }, 2500);
  } catch (e) {
    statusEl.textContent = 'Failed: ' + e.message;
  }
}

// Remake (12 Oct 2026, Andy): marks the post rejected, then sends the same slot to the planner, which reuses a rejected post in place and
// runs SC Concept Creator on it again. The product, promotable item and poster clip are read back from the post itself.
const REMAKE_COST = { 'Day Greeting': '$0.57', 'Wisdom': '$0.57', 'Character Lore': '$0.57', 'Brand Lore': '$0.58', 'Product': '$0.50', 'Travel the World': '$0.47', 'NFT': '$0.06' };
async function remakeRow(r) {
  const statusEl = document.getElementById('saveStatus');
  const notes = String(r.notes || ''), pnotes = String(r.panel_notes || '');
  const poster = /Clip:\s*posterwall/i.test(notes);
  const cost = poster ? (r.format === 'Brand Lore' ? '$0.13' : '$0.08') : (REMAKE_COST[r.format] || 'a few cents');
  const item = { date: londonYmd(r.post_date), format: r.format, character: r.character || '' };
  if (r.post_time) item.time = r.post_time;
  if (poster) item.clip = 'posterwall';
  if (r.format === 'Product' || r.format === 'Dare to Buy') {
    const handle = ((notes.match(/products\/([a-z0-9-]+)/i) || notes.match(/Source:\s*SHOP:([a-z0-9-]+)/i) || pnotes.match(/Item:\s*([a-z0-9-]+)\s*(?:\||$)/i) || [])[1] || '');
    const promo = ((notes.match(/Promo:\s*([^.|]+)/i) || (/Source:\s*PROMO:/i.test(notes) ? pnotes.match(/Item:\s*([^|]+)/i) : null) || [])[1] || '').trim();
    if (handle) { await loadProducts(); const p = (PRODUCTS || []).find(x => x.handle === handle) || {}; item.product_handle = handle; item.product_title = p.title || ''; }
    else if (promo && r.format === 'Product') item.promo_item = promo;
    else { statusEl.textContent = 'Could not find this post\'s product. Use Reject, then Add a post.'; return; }
  }
  if (!confirm('Remake this post? About ' + cost + '. It keeps the day, time, type, product and character, and makes a new brief, image and clip for your approval.')) return;
  statusEl.textContent = 'Remaking...';
  try {
    const rj = await fetch(UPDATE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: r.id, panel_status: 'rejected', panel_notes: 'Remake requested' }) });
    if (!rj.ok) throw new Error('HTTP ' + rj.status);
    const res = await fetch(PLAN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan: [item] }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let out = null; try { out = await res.json(); } catch (e2) { out = null; }
    const sk = out && (out.skipped || (Array.isArray(out) && out[0] && out[0].skipped));
    if (sk && sk.length) throw new Error(sk.map(x => x.why).join('; '));
    statusEl.textContent = 'Remaking: the new brief takes about a minute; the calendar refreshes itself.';
    startAutoRefresh();
    setTimeout(() => { closeDrawer(); loadRows(); }, 1200);
  } catch (e) { statusEl.textContent = 'Remake failed: ' + e.message; }
}

async function submitRecreate(r, ctx) {
  const msg = document.getElementById('rcMsg');
  const f = r.format;
  const date = document.getElementById('rcDate').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { msg.textContent = 'Pick a date.'; return; }
  const dow = new Date(date + 'T12:00:00Z').getUTCDay();
  const time = (document.getElementById('rcTime').value || '').trim() || (f === 'Dare to Buy' ? (r.post_time || '19:00') : (f === 'NFT' ? (r.post_time || '') : ''));
  const charEl = document.getElementById('rcChar');
  let character = charEl ? charEl.value : '';
  const prodEl = document.getElementById('rcProduct');
  const prodVal = prodEl ? prodEl.value : '';
  const lineEl = document.getElementById('rcLine');
  const sourceId = lineEl ? lineEl.value : '';
  const slot = time ? 'custom' : (f === 'Product' ? '12pm' : (f === 'Day Greeting' ? '6am' : '7am'));
  const due = new Date(date + 'T' + (time || (slot === '6am' ? '06:00' : (slot === '12pm' ? '12:00' : ((dow === 0 || dow === 6) ? '09:00' : '07:00')))) + ':00Z');
  const warns = [];
  if (due.getTime() < Date.now() - 60 * 60000) warns.push('That time has already passed.');
  const clash = f === 'Dare to Buy' ? null : ROWS.find(x => x.id !== r.id && londonYmd(x.post_date) === date && x.panel_status !== 'rejected' && (slotOfFormat(x.format) === slotOfFormat(f) || (time && x.post_time === time)));
  if (clash) warns.push('That slot already has a post (' + clash.character + ', ' + clash.format + ').');
  const cost = recreateCost(r);
  if (!confirm((warns.length ? warns.join('\n') + '\n\n' : '') + 'Recreate this post? About ' + cost + '. It makes a new brief, image and clip for your approval.' + (warns.length ? '\n\nDo it anyway?' : ''))) { msg.textContent = 'Not recreated. Nothing was spent.'; return; }
  const DAY_TITLE = { 1: 'Major Wood Monday', 2: "Hammerin' Tuesday", 3: 'White-Knuckle Wednesday', 4: 'Thrusting Thursday', 5: 'Full-Friction Friday', 6: 'Sailor Saturday', 0: 'Standing Tall Sunday' };
  const post_date = date + (slot === '6am' ? 'T06:00:00.000Z' : (slot === '7am' ? 'T07:00:00.000Z' : 'T12:00:00.000Z'));
  const statusEl = document.getElementById('saveStatus');
  msg.textContent = 'Recreating...';
  try {
    if (ctx.lineFormat) {
      // Wisdom, Character Lore, Brand Lore and Day Greeting go straight to the concept maker, which can take one chosen line of the Ideas tab.
      if (f === 'Day Greeting') character = DAY_CHAR[dow];
      else if (!character && f !== 'Brand Lore') character = r.character;
      const body = { id: r.id, post_date: post_date, post_time: time || null, format: f, status: 'draft', notes: ctx.poster ? 'Clip: posterwall.' : '', text_content: '',
        image_url: null, video_url: null, panel_status: 'creating', panel_notes: 'Recreate', caption_instagram: null, caption_x: null, caption_facebook: null };
      if (character && f !== 'Brand Lore') body.character = character;
      if (f === 'Day Greeting') body.day_of_week = DAY_TITLE[dow];
      const rj = await fetch(UPDATE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!rj.ok) throw new Error('HTTP ' + rj.status);
      const cbody = { row_id: r.id }; if (sourceId) cbody.source_id = sourceId;
      fetch(CONCEPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cbody) }).catch(() => {});
    } else {
      // Product, Dare to Buy, NFT and Travel the World go through the planner, which remakes the rejected post in place at its (new) date and time.
      const mv = { id: r.id, post_date: post_date, post_time: time || null, panel_status: 'rejected', panel_notes: 'Recreate requested' };
      const rj = await fetch(UPDATE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(mv) });
      if (!rj.ok) throw new Error('HTTP ' + rj.status);
      const item = { date: date, format: f, character: character || (r.character === 'SC Logo' ? '' : r.character) || '' };
      if (time) item.time = time;
      if (f === 'Product' || f === 'Dare to Buy') {
        const notes = String(r.notes || ''), pnotes = String(r.panel_notes || '');
        let handle = prodVal || ctx.curHandle, promo = '';
        if (handle.indexOf('promo:') === 0) { promo = handle.slice(6); handle = ''; }
        else if (!handle) promo = ((notes.match(/Promo:\s*([^.|]+)/i) || (/Source:\s*PROMO:/i.test(notes) ? pnotes.match(/Item:\s*([^|]+)/i) : null) || [])[1] || '').trim();
        if (handle) { await loadProducts(); const p = (PRODUCTS || []).find(x => x.handle === handle) || {}; item.product_handle = handle; item.product_title = p.title || ''; }
        else if (promo && f === 'Product') item.promo_item = promo;
        else throw new Error('could not find this post\'s product; pick one above');
      }
      const res = await fetch(PLAN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan: [item] }) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let out = null; try { out = await res.json(); } catch (e2) { out = null; }
      const sk = out && (out.skipped || (Array.isArray(out) && out[0] && out[0].skipped));
      if (sk && sk.length) throw new Error(sk.map(x => (x && x.why) || x).join('; '));
    }
    msg.textContent = '';
    statusEl.textContent = 'Recreating: the new brief takes about a minute; the calendar refreshes itself.';
    startAutoRefresh();
    setTimeout(() => { closeDrawer(); loadRows(); }, 1500);
  } catch (e) { msg.textContent = 'Recreate failed: ' + e.message; }
}

async function deleteRow(r) {
  if (!confirm('Delete this post permanently? This cannot be undone.')) return;
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Deleting...';
  try {
    const res = await fetch(DELETE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: r.id })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    statusEl.textContent = 'Deleted.';
    ROWS = ROWS.filter(x => x.id !== r.id);
    render();
    setTimeout(closeDrawer, 500);
  } catch (e) { statusEl.textContent = 'Failed to delete (posted rows cannot be deleted): ' + e.message; }
}

async function saveRow(r) {
  const id = r.id;
  const payload = {
    id: id,
    post_date: r.post_date,
    day_of_week: r.day_of_week,
    character: r.character,
    format: r.format,
    text_content: (document.getElementById('f_caption_instagram') || {}).value || r.text_content || '',
    image_url: document.getElementById('f_image_url').value,

    // NFT posts carry the NFT Post Builder's record (Source, NFT title, template, shop link), not a brief: kept exactly as written.
    notes: r.format === 'NFT' ? (r.notes || '') : composeNotes(r.notes || ''),
    caption_instagram: (document.getElementById('f_caption_instagram') || {}).value,
    caption_x: (document.getElementById('f_caption_x') || {}).value,
    caption_facebook: (document.getElementById('f_caption_facebook') || {}).value
  };
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Saving...';
  try {
    const res = await fetch(UPDATE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    statusEl.textContent = 'Saved.';
    const row = ROWS.find(r => r.id === id);

// Every finished clip in one grid: calendar posts with a video (approved, scheduled or posted) plus the SC Content Library
// (media made before the calendar, e.g. the 6 intro videos). Each card shows where and when it already went out.
// "Recently posted" (last 30 days) is shown to help pick, never to block. "Repost" makes a DRAFT calendar row
// (notes REPOST:#N or REPOST:LIB:N) for Andy to check and set "approved"; nothing posts without that.
const LIBRARY_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-library-list';
const RESTORE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-calendar-restore';
const REPOST_PLATFORMS = [['Instagram', 'IG'], ['Facebook', 'FB'], ['X', 'X'], ['YouTube', 'YT']];
const RECENT_DAYS = 30;
let LIB = null;
const LIBF = { character: '', source: '', hideRecent: false };

async function loadLibrary() {
  try {

    if (!res.ok) throw new Error('HTTP ' + res.status);

function repostKey(r) { const m = String(r.notes || '').match(/REPOST:(#\d+|LIB:\d+)/); return m ? m[1] : null; }
// Which platforms a posted row reached: from the publisher's "PUBLISH RESULT:" note, else its platforms list.
function postedPlatforms(r) {
  const n = String(r.notes || '');
  const i = n.lastIndexOf('PUBLISH RESULT:');
  const plats = REPOST_PLATFORMS.map(p => p[0]);
  if (i === -1) return String(r.platforms || '').split(',').map(x => x.trim()).filter(p => plats.indexOf(p) !== -1);
  const res = n.slice(i);
  return plats.filter(p => new RegExp('(^|\\W)' + p + ':\\s*posted', 'i').test(res));
}
function libraryItems() {
  const items = [];
  ROWS.filter(r => !repostKey(r) && r.video_url && r.format !== 'Dare to Buy' && ['approved', 'scheduled', 'posted'].indexOf(r.status) !== -1)
    .forEach(r => items.push({ key: '#' + r.id, src: 'calendar', title: r.format + ' · post #' + r.id, character: r.character, format: r.format, video_url: r.video_url,
      image_url: r.image_url || '', caption_instagram: r.caption_instagram || r.text_content || '', caption_facebook: r.caption_facebook || r.text_content || '',
      caption_x: r.caption_x || r.text_content || '', made: isoDate(r.post_date), row: r }));
  (LIB || []).filter(l => l.video_url || (l.kind === 'campaign' && l.image_url)).forEach(l => items.push({ key: 'LIB:' + l.id, src: 'library', title: l.title || ('Library ' + l.id), character: l.character || '',
    format: l.kind === 'campaign' ? 'Campaign' : 'Intro', camp: l.kind === 'campaign' ? (l.campaign || 'Campaign') : '', video_url: l.video_url || '', image_url: l.image_url || '',
    caption_instagram: l.caption_instagram || '', caption_facebook: l.caption_facebook || '', caption_x: l.caption_x || '', made: l.added_on || '', lib: l }));
  // History: the original post itself plus every repost row made from it.
  items.forEach(it => {
    const rows = ROWS.filter(r => (it.row && r.id === it.row.id) || repostKey(r) === it.key);
    it.history = []; it.booked = [];
    rows.forEach(r => {
      const d = isoDate(r.post_date);
      if (r.status === 'posted') postedPlatforms(r).forEach(p => it.history.push({ platform: p, date: d, id: r.id }));
      else if (r.id !== (it.row || {}).id && r.panel_status !== 'rejected') it.booked.push({ date: d, time: r.post_time || '', status: r.status, id: r.id, platforms: r.platforms || '' });
    });
    it.last = {};
    it.history.forEach(h => { if (!it.last[h.platform] || h.date > it.last[h.platform]) it.last[h.platform] = h.date; });
    it.recent = Object.keys(it.last).filter(p => daysAgo(it.last[p]) <= RECENT_DAYS);
  });
  return items.sort((a, b) => (b.made || '').localeCompare(a.made || ''));
}

  const miss = [];
  if (!plats.length) miss.push('pick at least one platform');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) miss.push('pick a date');
  if (!/^\d{2}:\d{2}$/.test(time)) miss.push('pick a time');
  if (plats.indexOf('Instagram') !== -1 && !ig) miss.push('write the Instagram caption');
  if ((plats.indexOf('Facebook') !== -1 || plats.indexOf('YouTube') !== -1) && !fb) miss.push('write the Facebook caption');
  if (plats.indexOf('X') !== -1 && !x) miss.push('write the X caption');

  const weekday = new Date(date + 'T12:00:00Z').toLocaleDateString('en-GB', { timeZone: 'Europe/London', weekday: 'long' });
  const src = it.src === 'library' ? 'library clip ' + it.title : 'post #' + it.row.id;
  const body = {
    post_date: date + 'T12:00:00.000Z', post_time: time, day_of_week: weekday, character: it.character || 'SC Logo', format: it.format,
    text_content: ig || fb || x, caption_instagram: ig, caption_facebook: fb, caption_x: x, video_url: it.video_url || null, image_url: it.image_url,
    platforms: plats.join(', '), status: 'draft', panel_status: 'ready', notes: 'REPOST:' + it.key,
    panel_notes: 'Repost of ' + src + ', made in the Library tab ' + new Date().toISOString().slice(0, 10) + '. Check the clip and captions, then set "approved" to schedule it.'
  };
  try {
    const res = await fetch(RESTORE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

const CAMPAIGN_SAVE_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-campaign-save';

function campCopy(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => { campCopyOld(text); done(); });
  else { campCopyOld(text); done(); }
}
function campCopyOld(text) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); }
async function campGetClip(it, btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Getting clip…';
  try {
    const res = await fetch(it.video_url); if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const file = new File([blob], 'stiff-competition-' + it.key.replace(/\W+/g, '-') + '.mp4', { type: 'video/mp4' });
    if (it.lib && it.lib.caption_tiktok) campCopyOld(it.lib.caption_tiktok);
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); }
    btn.textContent = 'Caption copied. Pick TikTok.';
  } catch (e) { btn.textContent = (e && e.name === 'AbortError') ? old : 'Could not get clip'; }
  setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 3500);
}
async function campMarkTikTok(it, posted) {

    if (!res.ok) throw new Error('HTTP ' + res.status);

}

const HYPE_LIST_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-hype-list';

function hypeMonday(iso) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); }

// ---------- Planner (Playbook 7.6) ----------
const DAY_CHAR = { 1: 'Major Wood', 2: "Hammerin' Hanky", 3: 'The Grip', 4: 'The Velvet Python', 5: 'Slick Willy', 6: 'The Rear Admiral', 0: 'SC Logo' };
const CHARACTERS = ['Major Wood', "Hammerin' Hanky", 'The Grip', 'The Velvet Python', 'Slick Willy', 'The Rear Admiral'];
const WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let PRODUCTS = null;
let PROMOS = [];
let LEFT = {};
let DRAFTS = 0;
function ymd(d) { return d.toISOString().slice(0, 10); }
// Reschedule (1 Oct 2026; 7 Oct 2026; 19 Oct 2026): moves a post to another date and/or London time. Every post, the Day Greeting and Brand Lore
// included, can move to any day (Andy: the calendar guides, it never restricts). Only a non-Day-Greeting post cannot go to a day whose own character is the post's character.
// A slot that already holds a post is refused. Status and approval are kept.
function openReschedule(r) {
  const box = document.getElementById('saveStatus');
  const curDate = londonYmd(r.post_date);
  const anyDay = true;   // 19 Oct 2026 (Andy): the calendar guides what to make, it never restricts when he posts; any post can move to any day
  const dowName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(curDate + 'T12:00:00Z').getUTCDay()];
  box.innerHTML = '<div class="panel-box" style="margin-top:10px">' +
    '<div style="font-weight:700;margin-bottom:6px">Reschedule</div>' +
    '<div class="field"><label>Date' + (anyDay ? '' : ' (' + dowName + 's only)') + '</label><input type="date" id="rsDate" value="' + curDate + '"></div>' +
    '<div class="field"><label>Time (London, 24h) - leave blank for the usual slot</label><input type="time" id="rsTime" step="900" value="' + (r.post_time || '') + '"></div>' +
    '<button class="btn" id="rsGo">Move post</button> <span id="rsMsg"></span></div>';
  document.getElementById('rsGo').addEventListener('click', async () => {
    const msg = document.getElementById('rsMsg');
    const date = document.getElementById('rsDate').value;
    const time = (document.getElementById('rsTime').value || '').trim() || (r.format === 'Dare to Buy' ? (r.post_time || '19:00') : '');   // 19 Oct 2026 (Andy): a Dare to Buy always keeps its own time (19:00 unless set)
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { msg.textContent = 'Pick a date.'; return; }
    const dow = new Date(date + 'T12:00:00Z').getUTCDay();
    if (!anyDay && dow !== new Date(curDate + 'T12:00:00Z').getUTCDay()) { msg.textContent = 'This post belongs to ' + dowName + '; pick another ' + dowName + '.'; return; }
    const warns = [];   // 23 Oct 2026 (Andy): every check below is a warning with Do it anyway, never a refusal
    if (anyDay && r.format !== 'Day Greeting' && r.format !== 'Product' && r.format !== 'Dare to Buy' && r.character === DAY_CHAR[dow]) warns.push(r.character + ' is that day\'s character; only the Day Greeting normally uses him.');
    const slot = time ? 'custom' : (r.format === 'Product' ? '12pm' : (r.format === 'Day Greeting' ? '6am' : '7am'));
    const due = new Date(date + 'T' + (time || (slot === '6am' ? '06:00' : (slot === '12pm' ? '12:00' : ((dow === 0 || dow === 6) ? '09:00' : '07:00')))) + ':00Z');
    if (due.getTime() < Date.now() - 60 * 60000) warns.push('That time has already passed.');
    // The day must not already hold a post of the same slot type (any time), nor any post at the exact custom time.
    const clash = r.format === 'Dare to Buy' ? null : ROWS.find(x => x.id !== r.id && londonYmd(x.post_date) === date && (slotOfFormat(x.format) === slotOfFormat(r.format) || (time && x.post_time === time)));
    if (clash) warns.push('That slot already has a post (' + clash.character + ', ' + clash.format + ').');
    if (warns.length && !confirm(warns.join('\n') + '\n\nDo it anyway?')) { msg.textContent = 'Not moved.'; return; }
    const post_date = date + (slot === '6am' ? 'T06:00:00.000Z' : (slot === '7am' ? 'T07:00:00.000Z' : 'T12:00:00.000Z'));
    const DAY_TITLE = { 1: 'Major Wood Monday', 2: "Hammerin' Tuesday", 3: 'White-Knuckle Wednesday', 4: 'Thrusting Thursday', 5: 'Full-Friction Friday', 6: 'Sailor Saturday', 0: 'Standing Tall Sunday' };
    const body = { id: r.id, post_date: post_date, post_time: time || null };
    if (r.format === 'Day Greeting') body.day_of_week = DAY_TITLE[dow];
    msg.textContent = 'Moving...';
    try {
      const res = await fetch(UPDATE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      msg.textContent = 'Moved to ' + date + (time ? ' ' + time + ' London' : ' (usual slot)') + '.';
      setTimeout(() => { closeDrawer(); loadRows(); }, 900);
    } catch (e) { msg.textContent = 'Could not move it: ' + e.message; }
  });
}

  holder.innerHTML = '<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:8px"><div id="' + id('View') + '" style="position:relative;width:' + BOX_W + 'px;height:' + BOX_H + 'px;overflow:hidden;border:5px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4);background:#1c3faa;cursor:grab;touch-action:none"><img id="' + id('Img') + '" src="' + escapeHtml(src) + '" style="position:absolute;left:0;top:0;user-select:none;-webkit-user-drag:none" draggable="false"></div><div style="min-width:220px"><label style="font-size:12px">Zoom</label><br><input type="range" id="' + id('Zoom') + '" min="1" max="8" step="0.01" value="1" style="width:220px"><p style="font-size:12px">Drag the photo to position it. The box must be filled edge to edge.</p><button class="btn" id="' + id('Save') + '">' + (slot === 2 ? 'Save second photo' : 'Save framing') + '</button> <span id="' + id('Status') + '" style="font-size:12px"></span></div></div>';
  const img = document.getElementById(id('Img')), view = document.getElementById(id('View')), zoom = document.getElementById(id('Zoom'));
  let nw = 0, nh = 0, base = 1, z = 1, x = 0, y = 0;
  const clamp = () => { const w = nw * base * z, h = nh * base * z; x = Math.min(0, Math.max(BOX_W - w, x)); y = Math.min(0, Math.max(BOX_H - h, y)); img.style.width = w + 'px'; img.style.height = h + 'px'; img.style.left = x + 'px'; img.style.top = y + 'px'; };
  img.onload = () => {
    nw = img.naturalWidth; nh = img.naturalHeight; base = Math.max(BOX_W / nw, BOX_H / nh);
    const m = cropSource(saved) === src ? /c_crop,g_xy_center,x_([0-9.]+),y_([0-9.]+),w_([0-9.]+),h_([0-9.]+)/.exec(saved || '') : null;
    if (m) { z = 1 / Math.max(0.01, Number(m[3]) * nw * base / BOX_W); zoom.value = z; const w = nw * base * z, h = nh * base * z; x = BOX_W / 2 - Number(m[1]) * w; y = BOX_H / 2 - Number(m[2]) * h; }
    else { x = (BOX_W - nw * base) / 2; y = 0; }   // 19 Oct 2026 (Andy): start at the top of the photo so the head is not cut off
    clamp();
  };
  zoom.addEventListener('input', () => { const cx = (BOX_W / 2 - x) / (nw * base * z), cy = (BOX_H / 2 - y) / (nh * base * z); z = Number(zoom.value); x = BOX_W / 2 - cx * nw * base * z; y = BOX_H / 2 - cy * nh * base * z; clamp(); });
  let drag = null;
  view.addEventListener('pointerdown', e => { drag = { sx: e.clientX, sy: e.clientY, x0: x, y0: y }; view.setPointerCapture(e.pointerId); view.style.cursor = 'grabbing'; });
  view.addEventListener('pointermove', e => { if (!drag) return; x = drag.x0 + e.clientX - drag.sx; y = drag.y0 + e.clientY - drag.sy; clamp(); });
  view.addEventListener('pointerup', () => { drag = null; view.style.cursor = 'grab'; });
  document.getElementById(id('Save')).addEventListener('click', async () => {
    const w = nw * base * z, h = nh * base * z, f = v => Math.max(0, Math.min(1, v)).toFixed(4);
    const crop = 'https://res.cloudinary.com/dkapdtxek/image/fetch/c_crop,g_xy_center,x_' + f((BOX_W / 2 - x) / w) + ',y_' + f((BOX_H / 2 - y) / h) + ',w_' + f(BOX_W / w) + ',h_' + f(BOX_H / h) + ',fl_relative/' + encodeURIComponent(src);
    const st = document.getElementById(id('Status')); st.textContent = 'Saving...';
    try { const r = await (await fetch(BOX_SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ handle: item.handle, crop: crop, slot: slot }) })).json(); if (!r.ok) throw new Error('save failed'); if (slot === 2) item.crop2 = crop; else { item.crop = crop; item.stale = false; } st.textContent = slot === 2 ? 'Saved. Product posts for this item now show this close-up.' : 'Saved. Every Product post for this item uses this framing.'; }
    catch (e) { st.textContent = 'Not saved - please try again.'; }
  });
}
// Quick approve (19 Oct 2026, Andy): one click approves every product that is not framed (or whose shop photo changed), each framed from the top of its photo.
// Saved one after another, because each save writes to the Product Box sheet.
async function quickApprove(items) {
  const queue = items.filter(i => !i.crop || i.stale), ed = document.getElementById('quickBox'), btn = document.getElementById('boxQuick');
  if (!queue.length) { ed.innerHTML = '<div class="sub">Every product is framed.</div>'; return; }
  if (btn) btn.disabled = true;
  ed.scrollIntoView({ block: 'start' });
  const failed = [];
  for (let k = 0; k < queue.length; k++) {
    const it = queue[k];
    ed.innerHTML = '<div class="sub" style="margin:10px 0">Approving ' + (k + 1) + ' of ' + queue.length + ': ' + escapeHtml(it.name || it.handle) + '</div>';
    try {
      const dims = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res([im.naturalWidth, im.naturalHeight]); im.onerror = () => rej(new Error('photo did not load')); im.src = it.photo; });
      const nw = dims[0], nh = dims[1];
      if (!nw || !nh) throw new Error('photo has no size');
      const base = Math.max(BOX_W / nw, BOX_H / nh), w = nw * base, h = nh * base, x = (BOX_W - w) / 2, y = 0, f = v => Math.max(0, Math.min(1, v)).toFixed(4);
      const crop = 'https://res.cloudinary.com/dkapdtxek/image/fetch/c_crop,g_xy_center,x_' + f((BOX_W / 2 - x) / w) + ',y_' + f((BOX_H / 2 - y) / h) + ',w_' + f(BOX_W / w) + ',h_' + f(BOX_H / h) + ',fl_relative/' + encodeURIComponent(it.photo);
      const r = await (await fetch(BOX_SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ handle: it.handle, crop: crop, slot: 1 }) })).json();
      if (!r.ok) throw new Error('save failed');
      it.crop = crop; it.stale = false;
    } catch (e) { failed.push(it.name || it.handle); }
  }
  const done = queue.length - failed.length;
  ed.innerHTML = '<div class="sub" style="margin:10px 0;color:' + (failed.length ? '#b00' : '#2a7a2a') + '">Approved ' + done + ' of ' + queue.length + '.' + (failed.length ? ' NOT saved: ' + escapeHtml(failed.join('; ')) + '. Press Quick approve again to retry them.' : ' Every product is framed from the top of its photo. Reopen Product boxes to see them.') + '</div>';
  if (btn) { btn.disabled = false; btn.textContent = 'Quick approve all (' + failed.length + ' left)'; }
}
