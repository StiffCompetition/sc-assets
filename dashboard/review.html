<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC Character Fact Review</title>
<style>
body{font-family:system-ui,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;background:#f7f7f8}
h1{font-size:20px}
h2{font-size:16px;border-bottom:2px solid #333;padding-bottom:4px;margin-top:32px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;color:#555}
.lbl{font-size:12px;text-transform:uppercase;color:#888;margin:8px 0 2px}
.box{background:#f2f2f2;border-radius:4px;padding:8px;white-space:pre-wrap}
textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;padding:6px;border-radius:4px;border:1px solid #ccc}
.val{background:#eef6ff}
.note{margin-top:8px;color:#555}
.src{font-size:12px;color:#999;margin-top:8px}
.btns{margin-top:10px;display:flex;gap:8px}
button{padding:6px 12px;border-radius:4px;border:1px solid #ccc;background:#fff;cursor:pointer}
button:hover{background:#f0f0f0}
.accept{border-color:#2e7d32;color:#2e7d32}
.del{border-color:#c62828;color:#c62828}
.empty{color:#888}
.err{color:#c62828}
</style>
</head>
<body>
<h1 id="title">SC Character Fact Review</h1>
<div id="app"><p>Loading&hellip;</p></div>

<script>
var DATA_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-review-data';
var ACTION_URL = 'https://n8n-production-afc2.up.railway.app/webhook/sc-review-action';

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render(rows) {
  var app = document.getElementById('app');
  document.getElementById('title').textContent = 'SC Character Fact Review (' + rows.length + ')';
  if (!rows.length) {
    app.innerHTML = '<p class="empty">Nothing pending.</p>';
    return;
  }
  var byChar = {};
  rows.forEach(function (r) {
    var c = r.character || 'Unassigned';
    (byChar[c] = byChar[c] || []).push(r);
  });
  var chars = Object.keys(byChar).sort();
  var html = '';
  chars.forEach(function (name) {
    var group = byChar[name];
    html += '<section><h2>' + esc(name) + ' (' + group.length + ')</h2>';
    group.forEach(function (r) {
      html += '<div class="card" data-id="' + esc(r.id) + '">' +
        '<h3>' + esc(r.field) + '</h3>' +
        (r.currentValue ? '<p class="lbl">Current</p><div class="box">' + esc(r.currentValue) + '</div>' : '') +
        '<p class="lbl">Proposed</p><textarea class="val" rows="3">' + esc(r.proposedValue) + '</textarea>' +
        '<p class="src">Source: ' + esc(r.source) + '</p>' +
        '<textarea class="note" rows="1" placeholder="Note (optional)">' + esc(r.note) + '</textarea>' +
        '<div class="btns">' +
        '<button class="accept" data-status="accepted">Accept</button>' +
        '<button class="change" data-status="changed">Change</button>' +
        '<button class="del" data-status="deleted">Delete</button>' +
        '<button class="hold" data-status="held">Hold</button>' +
        '</div></div>';
    });
    html += '</section>';
  });
  app.innerHTML = html;
  app.querySelectorAll('button[data-status]').forEach(function (btn) {
    btn.addEventListener('click', function () { act(btn); });
  });
}

function act(btn) {
  var card = btn.closest('.card');
  var id = card.getAttribute('data-id');
  var val = card.querySelector('.val').value;
  var note = card.querySelector('.note').value;
  var status = btn.getAttribute('data-status');
  btn.closest('.btns').querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  fetch(ACTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, status: status, proposedValue: val, note: note })
  }).then(function (res) {
    if (!res.ok) throw new Error('save failed');
    card.style.opacity = 0.4;
    card.querySelector('.btns').innerHTML = 'Saved: ' + status;
  }).catch(function () {
    card.querySelector('.btns').insertAdjacentHTML('beforeend', '<span class="err">Save failed, try again</span>');
    card.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
  });
}

fetch(DATA_URL)
  .then(function (res) {
    if (!res.ok) throw new Error('load failed: ' + res.status);
    return res.json();
  })
  .then(render)
  .catch(function (e) {
    document.getElementById('app').innerHTML = '<p class="err">Could not load the review queue (' + esc(e.message) + ').</p>';
  });
</script>
</body>
</html>
